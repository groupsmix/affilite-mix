[allowlist]
description = "Ignore test credentials and local dev mock secrets"
paths = [
    "docker/kong.yml",
    "docker/.env.example",
    "\\.env\\.example",
    "\\.env\\.production\\.example",
    "secrets-template\\.env",
    "__tests__/fixtures/.*",
]

# F8: Demo JWTs from the official Supabase self-hosted local-stack.
# These are the well-known public demo tokens (iss: supabase-demo) and
# are NOT real secrets — they only work against a local docker-compose
# Supabase instance. Allowlisting them here instead of committing a
# gitleaks scan report (which trains engineers to ignore scan output).
regexes = [
    # Supabase demo anon key
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\\.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8i",
    # Supabase demo service_role key
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\\.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtZGVtbyI",
]
