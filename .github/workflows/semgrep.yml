# ═══════════════════════════════════════════════════════════════════════════
# SEMGREP CUSTOM SAST RULES (F-002 supplement)
#
# Supplements CodeQL with custom rules targeting Next.js, Supabase, and
# Cloudflare Workers patterns specific to this codebase. Catches issues
# that generic SAST tools miss:
#   - Unsafe route handlers missing auth wrappers
#   - Raw service-role imports outside the allowlist
#   - Unvalidated redirects in server components
#   - Missing rate limiting on API routes
#   - Raw IP header parsing instead of getClientIp()
#
# Audit reference: F-002 supplement — "Add Semgrep with custom rules"
# ═══════════════════════════════════════════════════════════════════════════

name: "\U0001F50E Semgrep SAST"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday 08:00 UTC — after CodeQL and security workflows.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      image: semgrep/semgrep:latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Step 1: Custom rules are blocking (--error). These are the
      # codebase-specific security invariants the team owns and must
      # keep green at all times.
      - name: Run custom Semgrep rules (blocking)
        run: |
          semgrep scan \
            --config .semgrep/ \
            --sarif --output semgrep-custom.sarif \
            --error \
            --exclude='node_modules' \
            --exclude='__tests__' \
            --exclude='.open-next' \
            --exclude='.next'

      # Step 2: Community rules are informational. Findings are
      # uploaded to GitHub Security tab for triage but do not block
      # the pipeline. This prevents 1000+ community rules from
      # producing false-positive CI failures while still surfacing
      # findings for security review.
      - name: Run community Semgrep rules (informational)
        if: always()
        run: |
          semgrep scan \
            --config auto \
            --sarif --output semgrep-community.sarif \
            --exclude='node_modules' \
            --exclude='__tests__' \
            --exclude='.open-next' \
            --exclude='.next' \
          || true

      - name: Upload custom SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3
        with:
          sarif_file: semgrep-custom.sarif
          category: semgrep-custom
        continue-on-error: true

      - name: Upload community SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3
        with:
          sarif_file: semgrep-community.sarif
          category: semgrep-community
        continue-on-error: true
