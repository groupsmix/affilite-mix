name: Continuous ASM & DNS Hijacking Audit (A178 / A213)

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  ASM_OUTPUT: asm-snapshot.json
  ASM_FORBIDDEN_PORTS: "22,8080,9000"
  ASM_TIMEOUT_MS: "3000"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CF_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}

jobs:
  asm:
    name: Daily ASM snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Probe configured public domains
        run: node scripts/asm-snapshot.mjs

      - name: Upload ASM snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asm-snapshot-${{ github.run_id }}
          path: asm-snapshot.json
          retention-days: 30
