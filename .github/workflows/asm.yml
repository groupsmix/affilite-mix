name: ASM diff
on:
  schedule: [{ cron: "17 5 * * *" }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: |
          mkdir -p .asm
          dig +short groupsmix.com | sort > .asm/dns.txt || true
