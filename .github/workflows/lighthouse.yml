name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:

# Lighthouse CI uses its own LHCI_GITHUB_APP_TOKEN to post status checks,
# so the default GITHUB_TOKEN only needs read access to the repo.
permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://xyz.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
  SUPABASE_SERVICE_ROLE_KEY: placeholder
  JWT_SECRET: ci-test-secret
  INTERNAL_API_TOKEN: ci-test-internal-token
  CRON_SECRET: ci-test-cron-secret
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
  TURNSTILE_SECRET_KEY: ""
  NEXT_PUBLIC_DEFAULT_SITE: ai-compared
  # `instrumentation.ts` requires SENTRY_DSN to load the server-side
  # error monitor. The variable must be non-empty for `next start` to
  # finish booting; an obviously-fake DSN keeps the audit local.
  SENTRY_DSN: https://placeholder@placeholder.ingest.sentry.io/0
  SUPABASE_JWT_SECRET: ci-test-supabase-jwt-secret
  APP_URL: http://localhost:3000

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Run Lighthouse CI (non-blocking bootstrap)
        # `next start` does not fully serve edge/middleware routes for this Cloudflare
        # Workers app, so initial audits 404. Bootstrap non-blocking; switch to
        # `opennextjs-cloudflare preview` or the live preview URL to enforce budgets.
        run: npx @lhci/cli autorun || echo "LHCI failures allowed during bootstrap"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      # Upload the raw .lighthouseci/ directory so reviewers can inspect
      # actual LCP / INP / CLS / bundle-size / 3rd-party / font / image
      # metrics instead of only seeing that the workflow ran. Also runs on
      # failure so budget-violation reports are preserved.
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
