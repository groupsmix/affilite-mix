name: Zone Lookup
on:
  workflow_dispatch:

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: List compareai.site DNS records
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ZONE_ID="92dbb3eab89263162e7485cdd655092d"
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" | \
            jq -r '.result[] | "\(.type) \(.name) -> \(.content)"' || true
