name: DR Drill

permissions:
  contents: read

on:
  schedule:
    # A40-04: Quarterly DR drill — first Monday of Jan/Apr/Jul/Oct at 10:00 UTC.
    - cron: "0 10 1-7 1,4,7,10 1"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for DR drill"
        required: true
        default: "staging"
        type: choice
        options:
          - staging

jobs:
  dr-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run DR drill
        run: bash scripts/dr-drill.sh
        env:
          ENVIRONMENT: ${{ inputs.environment || 'staging' }}
