name: DR Drill - Supabase Restore Test

on:
  schedule:
    - cron: "0 0 1 * *" # Run monthly on the 1st
  workflow_dispatch: # Allow manual trigger

# DR drill only checks out the repo and exercises a Supabase restore
# script — it doesn't touch GitHub state. Lock GITHUB_TOKEN to read-only.
permissions:
  contents: read

jobs:
  dr-drill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Run Restore Drill Script
        run: ./scripts/dr-restore-test.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Normally this script would download a real pg_dump from R2 here.
          # We use the local `supabase db reset` in the script as the CI proxy.
