name: DR Drill

on:
  schedule:
    # A40-04: Quarterly DR drill — first Monday of Jan/Apr/Jul/Oct at 10:00 UTC.
    - cron: "0 10 1-7 1,4,7,10 1"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for DR drill"
        required: true
        default: "staging"
        type: choice
        options:
          - staging

jobs:
  dr-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
      - name: Run DR drill
        run: bash scripts/dr-drill.sh
        env:
          ENVIRONMENT: ${{ inputs.environment || 'staging' }}
