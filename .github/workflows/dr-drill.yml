name: DR Drill - Supabase Restore Test

on:
  schedule:
    - cron: "0 0 1 * *" # Run monthly on the 1st
  workflow_dispatch: # Allow manual trigger

# DR drill only checks out the repo and exercises a Supabase restore
# script — it doesn't touch GitHub state. Lock GITHUB_TOKEN to read-only.
permissions:
  contents: read

jobs:
  dr-drill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Run Restore Drill Script
        run: ./scripts/dr-restore-test.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Normally this script would download a real pg_dump from R2 here.
          # We use the local `supabase db reset` in the script as the CI proxy.
