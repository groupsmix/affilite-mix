name: DR Drill

permissions:
  contents: read

on:
  schedule:
    # A40-04: Quarterly DR drill — first Monday of Jan/Apr/Jul/Oct at 10:00 UTC.
    - cron: "0 10 1-7 1,4,7,10 1"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for DR drill"
        required: true
        default: "staging"
        type: choice
        options:
          - staging

concurrency:
  group: dr-drill
  cancel-in-progress: false

jobs:
  dr-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql &>/dev/null || ! command -v pg_dump &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi

      - name: Run DR drill
        run: bash scripts/dr-drill.sh --restore
        env:
          ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DR_DATABASE_URL: ${{ inputs.environment == 'production' && secrets.PRODUCTION_DATABASE_URL || secrets.STAGING_DATABASE_URL }}

      - name: Record drill result
        if: always()
        run: |
          echo "## DR Drill Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment**: ${{ inputs.environment || 'staging' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Triggered by**: ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
