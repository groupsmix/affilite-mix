name: Push Missing Secrets

on:
  workflow_dispatch:

jobs:
  push-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Push SUPABASE_JWT_SECRET to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          _SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          npm install -g wrangler@4.85.0
          echo "$_SUPABASE_JWT_SECRET" | wrangler secret put SUPABASE_JWT_SECRET --name affilite-mix
          echo "Done - SUPABASE_JWT_SECRET uploaded to Cloudflare"
