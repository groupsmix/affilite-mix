# ═══════════════════════════════════════════════════════════════════════════════
# AUTO-DEPLOY TO CLOUDFLARE WORKERS
#
# This workflow automatically deploys your site when you push to main.
# It also automatically creates the R2 bucket and KV namespace if they don't exist.
#
# TO DEPLOY:
# 1. Push code to main branch → Auto deploys!
# 2. Or go to GitHub → Actions → "Deploy to Cloudflare" → Run workflow
#
# SETUP REQUIRED (one-time):
# Go to GitHub repo → Settings → Secrets and variables → Actions
# Add these secrets (see docs/CLOUDFLARE.md for full inventory):
#
# ── Build-time (used by Next.js bundler + wrangler CLI) ──
#   - CLOUDFLARE_API_TOKEN (scoped token — see docs/cloudflare-production.md)
#     REQUIRED. CLOUDFLARE_API_KEY + CLOUDFLARE_EMAIL (Global Key) is NOT
#     supported by this workflow — the Global Key grants full account access
#     and must not be used. Create a scoped API token instead.
#   - CLOUDFLARE_ACCOUNT_ID
#   - NEXT_PUBLIC_SUPABASE_URL
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY
#   - SUPABASE_DB_URL (for DB migrations only — must be IPv4-reachable;
#     GitHub-hosted runners are IPv4-only and the direct Supabase host
#     `db.<ref>.supabase.co` is IPv6-only on the free tier. Use the
#     Session pooler URL instead: aws-0-<region>.pooler.supabase.com:5432).
#   - SUPABASE_DB_POOLER_URL (optional override; if set, used for migrations
#     in preference to SUPABASE_DB_URL. Lets teams keep the direct URL for
#     other tooling while giving CI an IPv4-reachable pooler URL.)
#
# ── Runtime Worker secrets (set via `wrangler secret put`) ──
#   - SUPABASE_SERVICE_ROLE_KEY
#   - JWT_SECRET (generate: openssl rand -hex 64)
#   - CRON_SECRET (generate: openssl rand -hex 32)
#   - CRON_HOST (e.g. https://wristnerd.xyz)
#   - INTERNAL_API_TOKEN (generate: openssl rand -hex 64)
#   - RESEND_API_KEY, SENTRY_DSN, TURNSTILE_SECRET_KEY (optional)
#   - AI keys: CLOUDFLARE_AI_API_TOKEN, GEMINI_API_KEY, GROQ_API_KEY, COHERE_API_KEY (optional)
#   - Affiliate: CJ_API_KEY, CJ_PUBLISHER_ID, PARTNERSTACK_API_KEY, ADMITAD_API_KEY, ADMITAD_PUBLISHER_ID (optional)
#   - R2: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, R2_PUBLIC_URL (optional)
#
# ── Admin bootstrap ──
#   Admin user creation has been moved to a separate break-glass workflow:
#   .github/workflows/admin-bootstrap.yml (manual trigger only)
# ═══════════════════════════════════════════════════════════════════════════════

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Top-level default: read-only. Each deploy job below explicitly opts into
# the extra scopes it needs (e.g. `id-token: write` for OIDC,
# `deployments: write` for GitHub deployment statuses).
permissions:
  contents: read

env:
  # ── Wrangler pin ───────────────────────────────────────────────────
  # Pin wrangler to a known version so CI is reproducible. `npx wrangler`
  # without a version will resolve whatever `@opennextjs/cloudflare`'s
  # floating dep range picks up that day, which has caused OpenNext
  # breakage before. Keep this in sync with the `wrangler` devDependency
  # in package.json so local `npm run preview` / `npm run deploy` and CI
  # run the same wrangler. Bump deliberately when upgrading
  # @opennextjs/cloudflare.
  WRANGLER_VERSION: "4.85.0"

  # ── Build-time only ────────────────────────────────────────────────
  # NEXT_PUBLIC_* vars are inlined by Next.js at bundle time.
  # Everything else here is consumed by wrangler CLI or DB migrations.
  # Server-side secrets (JWT, cron, AI, affiliate, etc.) are set as
  # Worker secrets in the "Set Worker secrets" step below so they are
  # readable at runtime and rotatable without a rebuild.
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
  NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
  # Required at build time by lib/site-context.ts#getCurrentSite: static
  # prerendering of public pages has no request headers, so the build must
  # know which site's metadata/layout to render for paths outside the
  # dynamic routes. Must be a valid slug from config/sites/ or the DB.
  NEXT_PUBLIC_DEFAULT_SITE: ${{ secrets.NEXT_PUBLIC_DEFAULT_SITE }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # STAGE 1: Validate migrations on staging + validate secrets
  # ═══════════════════════════════════════════════════════════════════
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ── Validate required Cloudflare Worker secrets ────────────────
      - name: Validate required Cloudflare Worker secrets
        env:
          _NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          _NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          _SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          _CRON_SECRET: ${{ secrets.CRON_SECRET }}
          _JWT_SECRET: ${{ secrets.JWT_SECRET }}
          _SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          _CRON_HOST: ${{ secrets.CRON_HOST }}
          _INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          _CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          _CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          MISSING=""

          REQUIRED=(
            _NEXT_PUBLIC_SUPABASE_URL
            _NEXT_PUBLIC_SUPABASE_ANON_KEY
            _SUPABASE_SERVICE_ROLE_KEY
            _CRON_SECRET
            _JWT_SECRET
            _SENTRY_DSN
            _CRON_HOST
            _INTERNAL_API_TOKEN
            _CLOUDFLARE_API_TOKEN
            _CLOUDFLARE_ACCOUNT_ID
          )

          # Map env var names to their user-facing secret names
          declare -A SECRET_NAMES=(
            [_NEXT_PUBLIC_SUPABASE_URL]=NEXT_PUBLIC_SUPABASE_URL
            [_NEXT_PUBLIC_SUPABASE_ANON_KEY]=NEXT_PUBLIC_SUPABASE_ANON_KEY
            [_SUPABASE_SERVICE_ROLE_KEY]=SUPABASE_SERVICE_ROLE_KEY
            [_CRON_SECRET]=CRON_SECRET
            [_JWT_SECRET]=JWT_SECRET
            [_SENTRY_DSN]=SENTRY_DSN
            [_CRON_HOST]=CRON_HOST
            [_INTERNAL_API_TOKEN]=INTERNAL_API_TOKEN
            [_CLOUDFLARE_API_TOKEN]=CLOUDFLARE_API_TOKEN
            [_CLOUDFLARE_ACCOUNT_ID]=CLOUDFLARE_ACCOUNT_ID
          )

          for key in "${REQUIRED[@]}"; do
            if [ -z "${!key}" ]; then
              MISSING="$MISSING ${SECRET_NAMES[$key]}"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            echo "Add them in GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo "All required secrets are present"

      # ── Require scoped API token (no Global API Key fallback) ──────
      - name: Require scoped CLOUDFLARE_API_TOKEN
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. This workflow requires a scoped API token."
            echo "::error::The Global API Key (CLOUDFLARE_API_KEY + CLOUDFLARE_EMAIL) is not supported — it grants full account access."
            echo "::error::Create a scoped token at https://dash.cloudflare.com/profile/api-tokens and add it as the CLOUDFLARE_API_TOKEN repo secret."
            exit 1
          fi

      # ── Install psql for DB validation ─────────────────────────────
      - name: Install psql
        run: |
          set -euo pipefail
          echo "Installing psql..."
          sudo apt-get update && sudo apt-get install -y postgresql-client 2>&1 | tail -5

      # ── Require staging DB for production deploys ──────────────────
      - name: Require staging DB smoke test
        if: github.ref == 'refs/heads/main'
        env:
          _STAGING_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "$_STAGING_DB_URL" ]; then
            echo "::error::STAGING_SUPABASE_DB_URL is required for production deploy"
            echo "::error::Add a staging Supabase DB URL in GitHub → Settings → Secrets"
            exit 1
          fi

          # Guard: refuse to reset a database that matches any production URL
          if [ -n "$SUPABASE_DB_URL" ] && [ "$_STAGING_DB_URL" = "$SUPABASE_DB_URL" ]; then
            echo "::error::STAGING_SUPABASE_DB_URL must not equal SUPABASE_DB_URL — refusing to reset production database"
            exit 1
          fi

          echo "Running fresh staging DB migration apply..."

          # Drop and recreate the public schema (equivalent to supabase db reset).
          psql "$_STAGING_DB_URL" -v ON_ERROR_STOP=1 \
            -c "DROP SCHEMA IF EXISTS public CASCADE;" \
            -c "CREATE SCHEMA public;" \
            -c "GRANT ALL ON SCHEMA public TO postgres;" \
            -c "GRANT ALL ON SCHEMA public TO public;"

          echo "Staging database reset complete"

          # Apply all migrations in order
          echo "Applying migrations to clean database..."
          for file in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            filename=$(basename "$file")
            [[ "$filename" == *.sql ]] || continue

            echo "  -> $filename"
            if ! psql "$_STAGING_DB_URL" -v ON_ERROR_STOP=1 -f "$file" > /tmp/migration.log 2>&1; then
              echo "::error::Migration failed: $filename"
              cat /tmp/migration.log
              exit 1
            fi
          done

          echo "All migrations applied successfully on staging"

          # Verify critical tables exist
          echo "Verifying schema..."
          TABLES="sites categories products content affiliate_clicks admin_users newsletter_subscribers audit_log ad_placements ad_impressions ai_drafts affiliate_networks"
          for table in $TABLES; do
            if ! psql "$_STAGING_DB_URL" -t -A -c "SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='$table';" | grep -q 1; then
              echo "::error::Missing table: $table"
              exit 1
            fi
          done
          echo "All critical tables exist"

          # Verify critical columns
          echo "Verifying critical columns..."

          for col in actor entity_type ip; do
            if ! psql "$_STAGING_DB_URL" -t -A -c "SELECT 1 FROM information_schema.columns WHERE table_name='audit_log' AND column_name='$col';" | grep -q 1; then
              echo "::error::Missing audit_log.$col column"
              exit 1
            fi
          done

          if ! psql "$_STAGING_DB_URL" -t -A -c "SELECT 1 FROM information_schema.columns WHERE table_name='sites' AND column_name='is_active';" | grep -q 1; then
            echo "::error::Missing sites.is_active column"
            exit 1
          fi

          if ! psql "$_STAGING_DB_URL" -t -A -c "SELECT 1 FROM information_schema.columns WHERE table_name='newsletter_subscribers' AND column_name='unsubscribe_token';" | grep -q 1; then
            echo "::error::Missing newsletter_subscribers.unsubscribe_token column"
            exit 1
          fi

          echo "All critical columns exist"

          # Verify analytics RPCs
          echo "Verifying analytics RPC functions..."
          RPCS="get_top_products get_top_referrers get_top_content_slugs get_daily_clicks"
          for rpc in $RPCS; do
            if ! psql "$_STAGING_DB_URL" -t -A -c "SELECT 1 FROM pg_proc WHERE proname='$rpc';" | grep -q 1; then
              echo "::error::Missing RPC function: $rpc"
              exit 1
            fi
          done
          echo "All analytics RPCs exist"

          # ── Schema drift check ──────────────────────────────────────
          # Compare staging schema against production to detect drift.
          echo "Checking for schema drift..."
          STAGING_TABLES=$(psql "$_STAGING_DB_URL" -t -A -c \
            "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name;")

          if [ -n "$SUPABASE_DB_URL" ]; then
            PROD_TABLES=$(psql "$SUPABASE_DB_URL" -t -A -c \
              "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name;" 2>/dev/null || echo "")

            if [ -n "$PROD_TABLES" ]; then
              STAGING_ONLY=$(comm -23 <(echo "$STAGING_TABLES") <(echo "$PROD_TABLES") || true)
              if [ -n "$STAGING_ONLY" ]; then
                echo "New tables being added to production:"
                echo "$STAGING_ONLY" | sed 's/^/  + /'
              fi

              PROD_ONLY=$(comm -13 <(echo "$STAGING_TABLES") <(echo "$PROD_TABLES") || true)
              if [ -n "$PROD_ONLY" ]; then
                echo "::warning::Tables in production but not in migrations (potential drift):"
                echo "$PROD_ONLY" | sed 's/^/  - /'
              fi
            else
              echo "Could not connect to production DB for drift check (non-fatal)"
            fi
          fi

          # ── Rollback notes check ────────────────────────────────────
          # Each migration should contain a rollback comment.
          echo "Checking rollback notes in migrations..."
          MISSING_ROLLBACK=""
          for file in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            filename=$(basename "$file")
            [[ "$filename" == *.sql ]] || continue
            if ! grep -qi "rollback\|revert\|undo\|drop.*if.*exists" "$file"; then
              MISSING_ROLLBACK="$MISSING_ROLLBACK $filename"
            fi
          done
          if [ -n "$MISSING_ROLLBACK" ]; then
            echo "::warning::Migrations without rollback notes:$MISSING_ROLLBACK"
            echo "Consider adding -- ROLLBACK: <instructions> comments to each migration"
          fi

          echo "Database reset smoke test PASSED"

  # ═══════════════════════════════════════════════════════════════════
  # STAGE 2: Snapshot production DB + apply migrations
  # ═══════════════════════════════════════════════════════════════════
  migrate-production:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install psql
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y postgresql-client 2>&1 | tail -5

      # ── Snapshot production DB before migration ────────────────────
      - name: Snapshot production DB
        env:
          _DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          _DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          set -euo pipefail
          DB_URL="${_DB_POOLER_URL:-$_DB_URL}"

          if [ -z "$DB_URL" ]; then
            echo "::warning::No DB URL set, skipping snapshot"
            exit 0
          fi

          echo "Creating pre-migration schema snapshot..."

          # Record table list and row counts before migration
          psql "$DB_URL" -v ON_ERROR_STOP=1 -t -A -c "
            SELECT table_name, pg_relation_size(quote_ident(table_name))
            FROM information_schema.tables
            WHERE table_schema = 'public'
            ORDER BY table_name;
          " > /tmp/pre_migration_snapshot.txt 2>/dev/null || true

          # Record current migration state
          psql "$DB_URL" -v ON_ERROR_STOP=1 -t -A -c "
            SELECT filename, applied_at
            FROM _migrations_applied
            ORDER BY applied_at;
          " > /tmp/pre_migration_ledger.txt 2>/dev/null || true

          echo "Pre-migration snapshot saved"
          echo "--- Tables and sizes ---"
          cat /tmp/pre_migration_snapshot.txt || true
          echo "--- Applied migrations ---"
          cat /tmp/pre_migration_ledger.txt || true

      # ── Apply production migrations ────────────────────────────────
      - name: Apply database migrations to production
        env:
          _DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          _DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          set -euo pipefail

          echo "Applying database migrations to production..."
          # Prefer the pooler URL if provided; fall back to the direct URL.
          DB_URL="${_DB_POOLER_URL:-$_DB_URL}"

          if [ -z "$DB_URL" ]; then
            echo "::warning::Neither SUPABASE_DB_POOLER_URL nor SUPABASE_DB_URL is set, skipping DB migrations"
            exit 0
          fi

          # IPv4 preflight: GitHub Actions runners cannot reach IPv6-only hosts.
          DB_HOST=$(printf '%s' "$DB_URL" | sed -E 's|^[a-zA-Z]+://[^@]+@([^:/?]+).*|\1|')
          if ! getent ahostsv4 "$DB_HOST" >/dev/null 2>&1; then
            echo "::error::SUPABASE_DB_URL host '$DB_HOST' has no IPv4 address, but GitHub Actions runners are IPv4-only."
            echo "::error::Switch SUPABASE_DB_URL (or add SUPABASE_DB_POOLER_URL) to the Supabase session pooler URL:"
            echo "::error::  postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres"
            echo "::error::Find it in Supabase Dashboard → Project Settings → Database → Connection pooling → Session mode."
            exit 1
          fi

          # Create a migrations ledger table to track applied migrations.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE IF NOT EXISTS _migrations_applied (
              filename  text PRIMARY KEY,
              applied_at timestamptz NOT NULL DEFAULT now()
            );
          "

          if [ -d "supabase/migrations" ]; then
            for file in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
              filename=$(basename "$file")
              [[ "$filename" == *.sql ]] || continue

              # Check if this migration has already been applied
              applied=$(psql "$DB_URL" -t -A -c \
                "SELECT COUNT(*) FROM _migrations_applied WHERE filename = '$filename';")

              if [ "$applied" = "1" ]; then
                echo "Already applied: $filename"
                continue
              fi

              echo "Applying: $filename"
              if psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$file"; then
                psql "$DB_URL" -c \
                  "INSERT INTO _migrations_applied (filename) VALUES ('$filename') ON CONFLICT DO NOTHING;"
                echo "Applied: $filename"
              else
                echo "::error::Failed: $filename"
                exit 1
              fi
            done
          fi

          echo "Database migrations complete"

      # ── Verify schema after migration ──────────────────────────────
      - name: Verify production schema
        env:
          _DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          _DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          set -euo pipefail
          DB_URL="${_DB_POOLER_URL:-$_DB_URL}"

          if [ -z "$DB_URL" ]; then
            echo "::warning::No DB URL set, skipping schema verification"
            exit 0
          fi

          echo "Verifying production schema after migration..."

          # Verify critical tables exist
          TABLES="sites categories products content affiliate_clicks admin_users newsletter_subscribers audit_log"
          for table in $TABLES; do
            if ! psql "$DB_URL" -t -A -c "SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='$table';" | grep -q 1; then
              echo "::error::Missing table after migration: $table"
              exit 1
            fi
          done

          echo "Post-migration schema verification passed"

  # ═══════════════════════════════════════════════════════════════════
  # STAGE 3: Build and deploy application
  # ═══════════════════════════════════════════════════════════════════
  deploy:
    needs: [validate, migrate-production]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ── Create R2 bucket if not exists ──────────────────────────────
      - name: Create R2 bucket (if not exists)
        run: |
          echo "Checking R2 bucket..."
          npx --yes wrangler@${WRANGLER_VERSION} r2 bucket create next-inc-cache 2>&1 || echo "Bucket may already exist, continuing..."

      # ── Create KV namespace if not exists, then inline the id ────────
      - name: Create KV namespace (if not exists)
        run: |
          set -euo pipefail
          echo "Resolving KV namespace id for RATE_LIMIT_KV..."

          # Try to look up an existing namespace first.
          KV_ID=$(npx --yes wrangler@${WRANGLER_VERSION} kv namespace list 2>/dev/null \
            | jq -r '.[] | select(.title == "RATE_LIMIT_KV" or .title == "affilite-mix-RATE_LIMIT_KV") | .id' \
            | head -n1 || true)

          # If nothing exists yet, create it and grab the id from the JSON output.
          if [ -z "$KV_ID" ]; then
            echo "No existing RATE_LIMIT_KV namespace found — creating one..."
            CREATE_OUT=$(npx --yes wrangler@${WRANGLER_VERSION} kv namespace create RATE_LIMIT_KV 2>&1 || true)
            echo "$CREATE_OUT"
            KV_ID=$(echo "$CREATE_OUT" | grep -oE '"id"[[:space:]]*:[[:space:]]*"[^"]+"' | head -n1 | sed -E 's/.*"([^"]+)"$/\1/' || true)
            # Fallback: re-list in case `create` raced or used a different title.
            if [ -z "$KV_ID" ]; then
              KV_ID=$(npx --yes wrangler@${WRANGLER_VERSION} kv namespace list 2>/dev/null \
                | jq -r '.[] | select(.title == "RATE_LIMIT_KV" or .title == "affilite-mix-RATE_LIMIT_KV") | .id' \
                | head -n1 || true)
            fi
          fi

          if [ -z "$KV_ID" ]; then
            echo "::error::Unable to resolve RATE_LIMIT_KV namespace id. Check CLOUDFLARE_API_TOKEN has 'Workers KV Storage:Edit' permission."
            exit 1
          fi

          echo "Using KV namespace id: $KV_ID"
          KV_ID="$KV_ID" perl -i -0pe '
            s/("binding"\s*:\s*"RATE_LIMIT_KV"[^}]*?"id"\s*:\s*")[^"]*(")/$1$ENV{KV_ID}$2/s
          ' wrangler.jsonc
          # Verify the substitution actually happened.
          if ! grep -q "\"id\": \"$KV_ID\"" wrangler.jsonc; then
            echo "::error::Failed to inline KV namespace id into wrangler.jsonc"
            grep -n RATE_LIMIT_KV wrangler.jsonc || true
            exit 1
          fi
          echo "Inlined KV namespace id into wrangler.jsonc"

      # ── Build OpenNext bundle ─────────────────────────────────────────
      - name: Build OpenNext bundle
        run: npx @opennextjs/cloudflare build

      # ── Deploy to Cloudflare ──────────────────────────────────────────
      - name: Deploy to Cloudflare
        run: npx opennextjs-cloudflare deploy

      # ── Set Worker secrets ────────────────────────────────────────────
      - name: Set Worker secrets
        run: |
          set -euo pipefail

          # Validate that all required secrets are present before touching the worker.
          MISSING=""
          [ -z "$_CRON_SECRET" ]      && MISSING="$MISSING CRON_SECRET"
          [ -z "$_JWT_SECRET" ]       && MISSING="$MISSING JWT_SECRET"
          [ -z "$_SB_SERVICE_KEY" ]   && MISSING="$MISSING SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$_SB_URL" ]           && MISSING="$MISSING NEXT_PUBLIC_SUPABASE_URL"
          [ -z "$_SB_ANON_KEY" ]      && MISSING="$MISSING NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -z "$_CRON_HOST" ]        && MISSING="$MISSING CRON_HOST"
          [ -z "$_INTERNAL_TOKEN" ]   && MISSING="$MISSING INTERNAL_API_TOKEN"

          if [ -n "$MISSING" ]; then
            echo "::error::Required secrets are missing:$MISSING"
            exit 1
          fi

          echo "Setting required Worker secrets..."
          echo "$_CRON_SECRET"    | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_SECRET --name affilite-mix > /dev/null 2>&1
          echo "$_JWT_SECRET"     | npx --yes wrangler@${WRANGLER_VERSION} secret put JWT_SECRET --name affilite-mix > /dev/null 2>&1
          echo "$_SB_SERVICE_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put SUPABASE_SERVICE_ROLE_KEY --name affilite-mix > /dev/null 2>&1
          echo "$_SB_URL"         | npx --yes wrangler@${WRANGLER_VERSION} secret put NEXT_PUBLIC_SUPABASE_URL --name affilite-mix > /dev/null 2>&1
          echo "$_SB_ANON_KEY"    | npx --yes wrangler@${WRANGLER_VERSION} secret put NEXT_PUBLIC_SUPABASE_ANON_KEY --name affilite-mix > /dev/null 2>&1
          echo "$_CRON_HOST"      | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_HOST --name affilite-mix > /dev/null 2>&1
          echo "$_INTERNAL_TOKEN" | npx --yes wrangler@${WRANGLER_VERSION} secret put INTERNAL_API_TOKEN --name affilite-mix > /dev/null 2>&1

          echo "Setting optional Worker secrets (skipped if not configured)..."
          [ -n "$_RESEND_KEY" ]       && echo "$_RESEND_KEY"       | npx --yes wrangler@${WRANGLER_VERSION} secret put RESEND_API_KEY --name affilite-mix > /dev/null 2>&1       || true
          [ -n "$_SENTRY_DSN" ]       && echo "$_SENTRY_DSN"       | npx --yes wrangler@${WRANGLER_VERSION} secret put SENTRY_DSN --name affilite-mix > /dev/null 2>&1           || true
          [ -n "$_TURNSTILE_KEY" ]    && echo "$_TURNSTILE_KEY"    | npx --yes wrangler@${WRANGLER_VERSION} secret put TURNSTILE_SECRET_KEY --name affilite-mix > /dev/null 2>&1 || true
          [ -n "$_NL_FROM" ]          && echo "$_NL_FROM"          | npx --yes wrangler@${WRANGLER_VERSION} secret put NEWSLETTER_FROM_EMAIL --name affilite-mix > /dev/null 2>&1 || true

          echo "Setting optional AI provider secrets..."
          [ -n "$_CF_AI_TOKEN" ]      && echo "$_CF_AI_TOKEN"      | npx --yes wrangler@${WRANGLER_VERSION} secret put CLOUDFLARE_AI_API_TOKEN --name affilite-mix > /dev/null 2>&1 || true
          [ -n "$_GEMINI_KEY" ]       && echo "$_GEMINI_KEY"       | npx --yes wrangler@${WRANGLER_VERSION} secret put GEMINI_API_KEY --name affilite-mix > /dev/null 2>&1         || true
          [ -n "$_GROQ_KEY" ]         && echo "$_GROQ_KEY"         | npx --yes wrangler@${WRANGLER_VERSION} secret put GROQ_API_KEY --name affilite-mix > /dev/null 2>&1           || true
          [ -n "$_COHERE_KEY" ]       && echo "$_COHERE_KEY"       | npx --yes wrangler@${WRANGLER_VERSION} secret put COHERE_API_KEY --name affilite-mix > /dev/null 2>&1         || true

          echo "Setting optional affiliate network secrets..."
          [ -n "$_CJ_KEY" ]           && echo "$_CJ_KEY"           | npx --yes wrangler@${WRANGLER_VERSION} secret put CJ_API_KEY --name affilite-mix > /dev/null 2>&1             || true
          [ -n "$_CJ_PUB" ]           && echo "$_CJ_PUB"           | npx --yes wrangler@${WRANGLER_VERSION} secret put CJ_PUBLISHER_ID --name affilite-mix > /dev/null 2>&1       || true
          [ -n "$_PSTACK_KEY" ]       && echo "$_PSTACK_KEY"       | npx --yes wrangler@${WRANGLER_VERSION} secret put PARTNERSTACK_API_KEY --name affilite-mix > /dev/null 2>&1   || true
          [ -n "$_ADMITAD_KEY" ]      && echo "$_ADMITAD_KEY"      | npx --yes wrangler@${WRANGLER_VERSION} secret put ADMITAD_API_KEY --name affilite-mix > /dev/null 2>&1        || true
          [ -n "$_ADMITAD_PUB" ]      && echo "$_ADMITAD_PUB"      | npx --yes wrangler@${WRANGLER_VERSION} secret put ADMITAD_PUBLISHER_ID --name affilite-mix > /dev/null 2>&1   || true

          echo "Setting optional R2 image storage secrets..."
          [ -n "$_R2_ACCOUNT" ]       && echo "$_R2_ACCOUNT"       | npx --yes wrangler@${WRANGLER_VERSION} secret put R2_ACCOUNT_ID --name affilite-mix > /dev/null 2>&1          || true
          [ -n "$_R2_KEY_ID" ]        && echo "$_R2_KEY_ID"        | npx --yes wrangler@${WRANGLER_VERSION} secret put R2_ACCESS_KEY_ID --name affilite-mix > /dev/null 2>&1       || true
          [ -n "$_R2_SECRET" ]        && echo "$_R2_SECRET"        | npx --yes wrangler@${WRANGLER_VERSION} secret put R2_SECRET_ACCESS_KEY --name affilite-mix > /dev/null 2>&1   || true
          [ -n "$_R2_BUCKET" ]        && echo "$_R2_BUCKET"        | npx --yes wrangler@${WRANGLER_VERSION} secret put R2_BUCKET_NAME --name affilite-mix > /dev/null 2>&1         || true
          [ -n "$_R2_URL" ]           && echo "$_R2_URL"           | npx --yes wrangler@${WRANGLER_VERSION} secret put R2_PUBLIC_URL --name affilite-mix > /dev/null 2>&1          || true

          echo "Worker secrets configured"
        env:
          _CRON_SECRET: ${{ secrets.CRON_SECRET }}
          _JWT_SECRET: ${{ secrets.JWT_SECRET }}
          _SB_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          _SB_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          _SB_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          _RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
          _SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          _INTERNAL_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          _CRON_HOST: ${{ secrets.CRON_HOST }}
          _TURNSTILE_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          _NL_FROM: ${{ secrets.NEWSLETTER_FROM_EMAIL }}
          _CF_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          _GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          _GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          _COHERE_KEY: ${{ secrets.COHERE_API_KEY }}
          _CJ_KEY: ${{ secrets.CJ_API_KEY }}
          _CJ_PUB: ${{ secrets.CJ_PUBLISHER_ID }}
          _PSTACK_KEY: ${{ secrets.PARTNERSTACK_API_KEY }}
          _ADMITAD_KEY: ${{ secrets.ADMITAD_API_KEY }}
          _ADMITAD_PUB: ${{ secrets.ADMITAD_PUBLISHER_ID }}
          _R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          _R2_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          _R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          _R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          _R2_URL: ${{ secrets.R2_PUBLIC_URL }}

  # ═══════════════════════════════════════════════════════════════════
  # STAGE 4: Health check + verify deployment
  # ═══════════════════════════════════════════════════════════════════
  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post-deploy health gate
        run: |
          set -euo pipefail
          CRON_HOST="${{ secrets.CRON_HOST }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          if [ -z "$CRON_HOST" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_HOST or CRON_SECRET not set — cannot run post-deploy health gate"
            echo "Both are required secrets. Add them in GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo "Waiting 15 s for deploy to propagate..."
          sleep 15

          HTTP_STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" \
            --max-time 20 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_HOST/api/health")

          echo "Health response (HTTP $HTTP_STATUS):"
          cat /tmp/health.json || true

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Health check returned HTTP $HTTP_STATUS — deployment may be broken"
            exit 1
          fi

          # Fail if any check is in error state
          DEGRADED=$(cat /tmp/health.json | grep -o '"status":"degraded"' | head -1 || true)
          if [ -n "$DEGRADED" ]; then
            echo "::error::Worker reports degraded health — check KV binding, env vars, and DB connectivity"
            exit 1
          fi

          echo "Deployment healthy"

      - name: Verify deployment
        run: |
          echo "Deployment complete!"
          echo "Testing site reachability..."
          sleep 5
          CRON_HOST="${{ secrets.CRON_HOST }}"
          if [ -n "$CRON_HOST" ]; then
            curl -s -o /dev/null -w "HTTP %{http_code}" --max-time 10 "$CRON_HOST/" || echo "Site may need DNS propagation"
          else
            echo "::warning::CRON_HOST not set — skipping site reachability check"
          fi

      - name: Traffic promotion note
        run: |
          echo "### Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy completed. Traffic is live." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "For gradual rollouts, use the **Deploy (gradual rollout)** workflow instead." >> "$GITHUB_STEP_SUMMARY"
          echo "See: \`.github/workflows/deploy-gradual.yml\`" >> "$GITHUB_STEP_SUMMARY"
