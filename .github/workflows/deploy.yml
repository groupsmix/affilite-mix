# ═══════════════════════════════════════════════════════════════════════════════
# AUTO-DEPLOY TO CLOUDFLARE WORKERS
#
# This workflow automatically deploys your site when you push to main.
# It also automatically creates the R2 bucket and KV namespace if they don't exist.
#
# TO DEPLOY:
# 1. Push code to main branch → Auto deploys!
# 2. Or go to GitHub → Actions → "Deploy to Cloudflare" → Run workflow
#
# SETUP REQUIRED (one-time):
# Go to GitHub repo → Settings → Secrets and variables → Actions
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║  IMPORTANT: Two separate tabs — Secrets vs Variables            ║
# ║                                                                  ║
# ║  SECRETS tab  → sensitive keys (tokens, passwords, API keys)    ║
# ║  VARIABLES tab → non-sensitive config (URLs, IDs, flags)        ║
# ║                                                                  ║
# ║  Putting a value in the wrong tab = empty value at runtime,     ║
# ║  which silently skips it or fails the validate step.            ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# ── SECRETS tab (Settings → Secrets and variables → Actions → Secrets) ──
#
#   Build / wrangler CLI:
#   - CLOUDFLARE_API_TOKEN  (scoped token — see docs/cloudflare-production.md)
#     REQUIRED. Do NOT use CLOUDFLARE_API_KEY + CLOUDFLARE_EMAIL (Global Key) —
#     the Global Key grants full account access. Create a scoped token instead.
#   - SUPABASE_DB_URL        (migrations; use IPv4 Session pooler URL on free tier)
#   - SUPABASE_DB_POOLER_URL (optional; preferred over SUPABASE_DB_URL for CI)
#
#   Runtime Worker secrets (pushed via `wrangler secret put`):
#   - SUPABASE_SERVICE_ROLE_KEY
#   - SUPABASE_JWT_SECRET
#   - JWT_SECRET              (generate: openssl rand -hex 64)
#   - CRON_SECRET             (generate: openssl rand -hex 32) — shared fallback
#   - INTERNAL_API_TOKEN      (generate: openssl rand -hex 64)
#   - TURNSTILE_SECRET_KEY
#   - RESEND_API_KEY          (optional)
#   - Stripe (optional — required for paid memberships):
#       STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
#       STRIPE_PRICE_ID_INSIDER, STRIPE_PRICE_ID_PRO
#   - Per-trigger cron secrets — REQUIRED in production (NEW-001):
#       CRON_PUBLISH_SECRET, CRON_STRIPE_SYNC_SECRET, CRON_AI_SECRET,
#       CRON_SITEMAP_SECRET, CRON_RETENTION_SECRET, CRON_COMMISSION_SECRET,
#       CRON_EPC_SECRET, CRON_PRICE_SECRET, CRON_DEALS_SECRET,
#       CRON_CLICK_RECONCILE_SECRET, CRON_ACCESS_REVIEW_SECRET,
#       CRON_HOMEPAGE_SYNTHETIC_SECRET
#     (single source of truth: `lib/cron-registry.ts -> cronJobs`)
#   - AI keys (optional):
#       CLOUDFLARE_AI_API_TOKEN, GEMINI_API_KEY, GROQ_API_KEY, COHERE_API_KEY
#   - Affiliate (optional):
#       CJ_API_KEY, CJ_PUBLISHER_ID, PARTNERSTACK_API_KEY,
#       ADMITAD_API_KEY, ADMITAD_PUBLISHER_ID
#   - R2 credentials (optional):
#       R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   - Misc (optional):
#       SLACK_DEPLOY_WEBHOOK_URL, E2E_BASE_URL,
#       STAGING_SUPABASE_URL, STAGING_SUPABASE_ANON_KEY, STAGING_SUPABASE_DB_URL
#
# ── VARIABLES tab (Settings → Secrets and variables → Actions → Variables) ──
#
#   Required:
#   - CLOUDFLARE_ACCOUNT_ID
#   - NEXT_PUBLIC_SUPABASE_URL
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY
#   - CRON_HOST               (e.g. https://wristnerd.xyz)
#
#   Optional:
#   - NEXT_PUBLIC_TURNSTILE_SITE_KEY
#   - NEXT_PUBLIC_SENTRY_DSN
#   - NEXT_PUBLIC_DEFAULT_SITE
#   - SENTRY_DSN
#   - R2_ACCOUNT_ID, R2_BUCKET_NAME, R2_PUBLIC_URL
#   - R2_PRIVATE_BUCKET, R2_PUBLIC_BUCKET
#   - LOG_SHIPPER_ENABLED     (set to 'true' once log-shipper worker is deployed)
#   - GRADUAL_ROLLOUT_ENABLED (set to 'true' for canary deploys; requires Workers Paid)
#   - SKIP_ALERTING_CHECK     (set to 'true' to bypass alerting config check)
#   - SKIP_LOG_SHIPPER_CHECK  (set to 'true' to bypass log-shipper enforcement)
#   - SKIP_DB_MIGRATIONS, SKIP_STAGING_SMOKE (break-glass overrides)
#
# ── Admin bootstrap ──
#   Admin user creation has been moved to a separate break-glass workflow:
#   .github/workflows/admin-bootstrap.yml (manual trigger only)
# ═══════════════════════════════════════════════════════════════════════════════

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize all deploys to the same ref so concurrent pushes to main
# (e.g. batch-merging multiple PRs) do not hit Cloudflare API rate
# limits from parallel `wrangler secret put` calls (each deploy makes
# ~35 sequential API calls). cancel-in-progress: false queues later
# runs instead of cancelling them, so no migration is interrupted.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Top-level default: read-only. Each deploy job below explicitly opts into
# the extra scopes it needs (e.g. `id-token: write` for OIDC,
# `deployments: write` for GitHub deployment statuses).
permissions:
  contents: read

env:
  # ── Wrangler pin ───────────────────────────────────────────────────
  # Pin wrangler to a known version so CI is reproducible. `npx wrangler`
  # without a version will resolve whatever `@opennextjs/cloudflare`'s
  # floating dep range picks up that day, which has caused OpenNext
  # breakage before. Keep this in sync with the `wrangler` devDependency
  # in package.json so local `npm run preview` / `npm run deploy` and CI
  # run the same wrangler. Bump deliberately when upgrading
  # @opennextjs/cloudflare.
  WRANGLER_VERSION: "4.93.1"

  # ── Build-time only ────────────────────────────────────────────────
  # NEXT_PUBLIC_* vars are inlined by Next.js at bundle time.
  # Everything else here is consumed by wrangler CLI or DB migrations.
  # Server-side secrets (JWT, cron, AI, affiliate, etc.) are set as
  # Worker secrets in the "Set Worker secrets" step below so they are
  # readable at runtime and rotatable without a rebuild.
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
  NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
  # Required at build time by lib/site-context.ts#getCurrentSite: static
  # prerendering of public pages has no request headers, so the build must
  # know which site's metadata/layout to render for paths outside the
  # dynamic routes. Must be a valid slug from config/sites/ or the DB.
  NEXT_PUBLIC_DEFAULT_SITE: ${{ vars.NEXT_PUBLIC_DEFAULT_SITE }}
  # Required at build time by next.config.ts: `remotePatterns` pins the
  # Next image optimizer to the exact R2 public host derived from this URL.
  # It is also pushed as a runtime Worker secret below, but the build reads
  # it here — without it the R2 host is omitted from remotePatterns and the
  # optimizer rejects every R2-hosted image with "url parameter is not
  # allowed" (blank product/media thumbnails).
  R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # STAGE 1: Validate migrations on staging + validate secrets
  # ═══════════════════════════════════════════════════════════════════
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # A214: Lockfile integrity check prevents deploy of hallucinated packages
      # that were not properly resolved and committed in the lockfile.
      - name: Lockfile integrity check
        run: |
          set -euo pipefail
          npm ci --dry-run > /tmp/lockfile-check.log 2>&1 || {
            echo "::error::package-lock.json is out of sync with package.json."
            cat /tmp/lockfile-check.log
            exit 1
          }
      # AUDIT-FIX: Run npm audit before deploying to catch newly
      # disclosed vulnerabilities that CI may not have seen if the
      # last CI run was on a different day.
      - name: Security audit (deploy gate)
        run: npm audit --omit=dev --audit-level=high

      # F-01: Validate Cloudflare alert mechanisms are configured
      - name: Validate alert mechanisms (F-01)
        run: |
          set -euo pipefail
          echo "=== Validating Cloudflare alert mechanisms ==="
          TFVARS="terraform/cloudflare/alerts.auto.tfvars"
          TFVARS_EXAMPLE="terraform/cloudflare/alerts.tfvars.example"
          
          # Check if a real tfvars file exists
          if [ ! -f "$TFVARS" ]; then
            echo "::warning::F-01: $TFVARS not found. Alert mechanisms may not be configured."
            echo "::warning::Copy $TFVARS_EXAMPLE to $TFVARS and configure at least one destination."
            echo "::warning::Run scripts/fire-test-alert.sh quarterly to verify end-to-end delivery."
            exit 0
          fi

          # Check if at least one mechanism is configured
          if grep -q 'email = \[\]' "$TFVARS" && \
             grep -q 'pagerduty = \[\]' "$TFVARS" && \
             grep -q 'webhooks = \[\]' "$TFVARS"; then
            echo "::error::F-01: No alert mechanisms configured in $TFVARS"
            echo "::error::At least one of email, pagerduty, or webhooks must have a destination ID."
            echo "::error::See $TFVARS_EXAMPLE for examples."
            exit 1
          fi

          echo "✓ Alert mechanisms are configured"
          echo "Run scripts/fire-test-alert.sh quarterly to verify end-to-end delivery."

      # ── Validate Cloudflare Worker bindings (PRIORITY 0) ───────────
      # F-007: Production deploy must hard-fail if required Cloudflare
      # bindings are missing. Without these, the Worker will not start.
      - name: Validate Cloudflare Worker bindings
        run: |
          set -euo pipefail

          echo "=== Validating required Cloudflare Worker bindings ==="

          MISSING_BINDINGS=""

          # Check wrangler.jsonc contains required KV namespace bindings
          echo "Checking KV namespace bindings..."
          if ! grep -q '"binding".*"RATE_LIMIT_KV"' wrangler.jsonc; then
            MISSING_BINDINGS="$MISSING_BINDINGS RATE_LIMIT_KV"
          fi
          if ! grep -q '"binding".*"APP_CACHE_KV"' wrangler.jsonc; then
            MISSING_BINDINGS="$MISSING_BINDINGS APP_CACHE_KV"
          fi

          # APP_CACHE_KV is required for middleware/domain resolution
          # (already checked above and added to MISSING_BINDINGS if absent;
          # the aggregate report at the end of this step will surface it
          # alongside any other missing bindings).

          # Check Durable Object bindings
          echo "Checking Durable Object bindings..."
          if ! grep -q '"name".*"RATE_LIMITER_DO"' wrangler.jsonc; then
            MISSING_BINDINGS="$MISSING_BINDINGS RATE_LIMITER_DO"
          fi

          # Check Queue producer bindings
          echo "Checking Queue bindings..."
          if ! grep -q '"binding".*"CLICK_QUEUE"' wrangler.jsonc; then
            MISSING_BINDINGS="$MISSING_BINDINGS CLICK_QUEUE"
          fi

          # CLICK_QUEUE_DLQ is required when CLICK_QUEUE is configured
          if grep -q '"binding".*"CLICK_QUEUE"' wrangler.jsonc; then
            if ! grep -q 'click-tracking-dlq\|CLICK_QUEUE_DLQ' wrangler.jsonc; then
              echo "::warning::CLICK_QUEUE is configured but no dead-letter queue (dlq) found"
              echo "::warning::Consider adding a DLQ binding for failed message handling"
            fi
          fi

          # Check R2 bucket bindings
          echo "Checking R2 bucket bindings..."
          if ! grep -q '"binding".*"NEXT_INC_CACHE_R2_BUCKET"' wrangler.jsonc; then
            MISSING_BINDINGS="$MISSING_BINDINGS NEXT_INC_CACHE_R2_BUCKET"
          fi

          # Check KV namespace IDs are configured (not empty placeholders).
          # In wrangler.jsonc the `binding` and `id` fields live on
          # separate lines, so a single-line grep can never match.
          # Use awk to scan each binding block for an empty id.
          echo "Checking KV namespace IDs are configured..."
          check_kv_id_empty() {
            local name="$1"
            awk -v name="$name" '
              $0 ~ "\"binding\"[[:space:]]*:[[:space:]]*\""name"\"" { found=1; next }
              found && /"id"[[:space:]]*:[[:space:]]*"[[:space:]]*"/ { print "EMPTY"; exit }
              found && /"id"[[:space:]]*:/ { exit }
            ' wrangler.jsonc
          }
          if [ "$(check_kv_id_empty RATE_LIMIT_KV)" = "EMPTY" ]; then
            echo "::error::RATE_LIMIT_KV namespace ID is empty"
            echo "::error::Run: npx wrangler kv:namespace create RATE_LIMIT_KV"
            exit 1
          fi
          if [ "$(check_kv_id_empty APP_CACHE_KV)" = "EMPTY" ]; then
            echo "::error::APP_CACHE_KV namespace ID is empty"
            echo "::error::Run: npx wrangler kv:namespace create APP_CACHE_KV"
            exit 1
          fi

          if [ -n "$MISSING_BINDINGS" ]; then
            echo "::error::Missing required Cloudflare bindings:$MISSING_BINDINGS"
            echo "::error::Add missing bindings to wrangler.jsonc before deploying"
            exit 1
          fi

          echo "All required Cloudflare bindings are configured"

      # ── Validate required Cloudflare Worker secrets ────────────────
      - name: Validate required Cloudflare Worker secrets
        env:
          _NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          _NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          _SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          _SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          _CRON_SECRET: ${{ secrets.CRON_SECRET }}
          _JWT_SECRET: ${{ secrets.JWT_SECRET }}
          _SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          _CRON_HOST: ${{ vars.CRON_HOST }}
          _INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          _CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          _CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # NEW-001: Per-trigger cron secrets. Required in production —
          # `verifyCronAuth` rejects the shared CRON_SECRET fallback
          # unless CRON_ALLOW_SHARED_FALLBACK_IN_PROD=1 is set, and
          # `instrumentation.ts` throws on missing required env. Keep
          # this list in lockstep with `lib/cron-registry.ts -> cronJobs`;
          # `__tests__/cron-registry.test.ts` enforces that every
          # registered job's secret env var appears here.
          _CRON_PUBLISH_SECRET: ${{ secrets.CRON_PUBLISH_SECRET }}
          _CRON_STRIPE_SYNC_SECRET: ${{ secrets.CRON_STRIPE_SYNC_SECRET }}
          _CRON_AI_SECRET: ${{ secrets.CRON_AI_SECRET }}
          _CRON_SITEMAP_SECRET: ${{ secrets.CRON_SITEMAP_SECRET }}
          _CRON_RETENTION_SECRET: ${{ secrets.CRON_RETENTION_SECRET }}
          _CRON_COMMISSION_SECRET: ${{ secrets.CRON_COMMISSION_SECRET }}
          _CRON_EPC_SECRET: ${{ secrets.CRON_EPC_SECRET }}
          _CRON_PRICE_SECRET: ${{ secrets.CRON_PRICE_SECRET }}
          _CRON_DEALS_SECRET: ${{ secrets.CRON_DEALS_SECRET }}
          _CRON_CLICK_RECONCILE_SECRET: ${{ secrets.CRON_CLICK_RECONCILE_SECRET }}
          _CRON_ACCESS_REVIEW_SECRET: ${{ secrets.CRON_ACCESS_REVIEW_SECRET }}
          _CRON_HOMEPAGE_SYNTHETIC_SECRET: ${{ secrets.CRON_HOMEPAGE_SYNTHETIC_SECRET }}
        run: |
          set -euo pipefail
          MISSING=""

          REQUIRED=(
            _NEXT_PUBLIC_SUPABASE_URL
            _NEXT_PUBLIC_SUPABASE_ANON_KEY
            _SUPABASE_SERVICE_ROLE_KEY
            _SUPABASE_JWT_SECRET
            _CRON_SECRET
            _JWT_SECRET
            _CRON_HOST
            _INTERNAL_API_TOKEN
            _CLOUDFLARE_API_TOKEN
            _CLOUDFLARE_ACCOUNT_ID
            # NEW-001: per-trigger cron secrets (one per cronJobs entry)
            _CRON_PUBLISH_SECRET
            _CRON_STRIPE_SYNC_SECRET
            _CRON_AI_SECRET
            _CRON_SITEMAP_SECRET
            _CRON_RETENTION_SECRET
            _CRON_COMMISSION_SECRET
            _CRON_EPC_SECRET
            _CRON_PRICE_SECRET
            _CRON_DEALS_SECRET
            _CRON_CLICK_RECONCILE_SECRET
            _CRON_ACCESS_REVIEW_SECRET
            _CRON_HOMEPAGE_SYNTHETIC_SECRET
          )

          # Map env var names to their user-facing secret names
          declare -A SECRET_NAMES=(
            [_NEXT_PUBLIC_SUPABASE_URL]=NEXT_PUBLIC_SUPABASE_URL
            [_NEXT_PUBLIC_SUPABASE_ANON_KEY]=NEXT_PUBLIC_SUPABASE_ANON_KEY
            [_SUPABASE_SERVICE_ROLE_KEY]=SUPABASE_SERVICE_ROLE_KEY
            [_SUPABASE_JWT_SECRET]=SUPABASE_JWT_SECRET
            [_CRON_SECRET]=CRON_SECRET
            [_JWT_SECRET]=JWT_SECRET
            [_CRON_HOST]=CRON_HOST
            [_INTERNAL_API_TOKEN]=INTERNAL_API_TOKEN
            [_CLOUDFLARE_API_TOKEN]=CLOUDFLARE_API_TOKEN
            [_CLOUDFLARE_ACCOUNT_ID]=CLOUDFLARE_ACCOUNT_ID
            [_CRON_PUBLISH_SECRET]=CRON_PUBLISH_SECRET
            [_CRON_STRIPE_SYNC_SECRET]=CRON_STRIPE_SYNC_SECRET
            [_CRON_AI_SECRET]=CRON_AI_SECRET
            [_CRON_SITEMAP_SECRET]=CRON_SITEMAP_SECRET
            [_CRON_RETENTION_SECRET]=CRON_RETENTION_SECRET
            [_CRON_COMMISSION_SECRET]=CRON_COMMISSION_SECRET
            [_CRON_EPC_SECRET]=CRON_EPC_SECRET
            [_CRON_PRICE_SECRET]=CRON_PRICE_SECRET
            [_CRON_DEALS_SECRET]=CRON_DEALS_SECRET
            [_CRON_CLICK_RECONCILE_SECRET]=CRON_CLICK_RECONCILE_SECRET
            [_CRON_ACCESS_REVIEW_SECRET]=CRON_ACCESS_REVIEW_SECRET
            [_CRON_HOMEPAGE_SYNTHETIC_SECRET]=CRON_HOMEPAGE_SYNTHETIC_SECRET
          )

          for key in "${REQUIRED[@]}"; do
            if [ -z "${!key}" ]; then
              MISSING="$MISSING ${SECRET_NAMES[$key]}"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets/variables:$MISSING"
            echo "::error::Add them in GitHub → Settings → Secrets and variables → Actions"
            echo "::error::NOTE — check which TAB each item belongs in:"
            echo "::error::  VARIABLES tab (non-sensitive): CLOUDFLARE_ACCOUNT_ID, NEXT_PUBLIC_SUPABASE_URL,"
            echo "::error::    NEXT_PUBLIC_SUPABASE_ANON_KEY, CRON_HOST"
            echo "::error::  SECRETS tab (sensitive): everything else listed above"
            echo "::error::Putting a value in the wrong tab results in an empty value and this error."
            exit 1
          fi

          echo "All required secrets/variables are present"

      # ── RISK-OBS-01 (#586) + A40-03: Validate production alerting config ──
      # A40-03: Upgraded from warning to error for production deploys.
      # Alert mechanisms must be configured before shipping to production.
      - name: Validate alerting configuration
        run: |
          set -euo pipefail
          if npx tsx scripts/validate-alerting-config.ts; then
            echo "Alerting configuration validated"
          else
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::error::A40-03: Production alerting is not configured. Alert mechanisms must be set before deploying to production."
              echo "::error::See terraform/cloudflare/production.tfvars.example for required alert_mechanisms configuration."
              echo "::error::Set repo variable SKIP_ALERTING_CHECK=true for a temporary override (audit-logged)."
              if [ "${{ vars.SKIP_ALERTING_CHECK }}" != "true" ]; then
                exit 1
              fi
              echo "::warning::SKIP_ALERTING_CHECK=true — bypassing alerting validation (override by ${{ github.actor }})"
            else
              echo "::warning::Production alerting is not configured. See terraform/cloudflare/production.tfvars.example."
            fi
          fi

      # ── Require scoped API token (no Global API Key fallback) ──────
      - name: Require scoped CLOUDFLARE_API_TOKEN
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. This workflow requires a scoped API token."
            echo "::error::The Global API Key (CLOUDFLARE_API_KEY + CLOUDFLARE_EMAIL) is not supported — it grants full account access."
            echo "::error::Create a scoped token at https://dash.cloudflare.com/profile/api-tokens and add it as the CLOUDFLARE_API_TOKEN repo secret."
            exit 1
          fi

      # ── Install psql for DB validation ─────────────────────────────
      - name: Install psql
        run: |
          set -euo pipefail
          echo "Installing psql..."
          sudo apt-get update && sudo apt-get install -y postgresql-client 2>&1 | tail -5

      # ── Require staging DB for production deploys ──────────────────
      - name: Require staging DB smoke test
        if: github.ref == 'refs/heads/main'
        env:
          _STAGING_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          _SKIP_STAGING_SMOKE: ${{ vars.SKIP_STAGING_SMOKE }}
        run: |
          set -euo pipefail

          if [ "${_SKIP_STAGING_SMOKE:-}" = "true" ]; then
            echo "::warning::SKIP_STAGING_SMOKE=true — skipping staging DB smoke test (single-DB setup)"
            echo "To enable: provision a separate staging Supabase project and set STAGING_SUPABASE_DB_URL."
            exit 0
          fi

          if [ -z "$_STAGING_DB_URL" ]; then
            echo "::error::STAGING_SUPABASE_DB_URL is required for production deploy"
            echo "::error::Add a staging Supabase DB URL in GitHub → Settings → Secrets"
            echo "::error::Or set repo variable SKIP_STAGING_SMOKE=true if you only have one Supabase project."
            exit 1
          fi

          # T4-#5: Normalise both URLs before comparing. Supabase pooled URLs
          # commonly carry ?pgbouncer=true; comparing before stripping means a
          # staging URL of <prod>?pgbouncer=true != <prod> → guard passes →
          # DROP SCHEMA hits production. Strip query strings on BOTH sides first.
          _STAGING_DB_URL="${_STAGING_DB_URL%%\?*}"
          _PROD_DB_URL="${SUPABASE_DB_URL%%\?*}"

          # Guard: refuse to reset a database that matches any production URL
          if [ -n "$_PROD_DB_URL" ] && [ "$_STAGING_DB_URL" = "$_PROD_DB_URL" ]; then
            echo "::error::STAGING_SUPABASE_DB_URL must not equal SUPABASE_DB_URL — refusing to reset production database"
            exit 1
          fi

          echo "Running fresh staging DB migration apply..."

          # Drop and recreate the public schema (equivalent to supabase db reset).
          psql "$_STAGING_DB_URL" -v ON_ERROR_STOP=1 \
            -c "DROP SCHEMA IF EXISTS public CASCADE;" \
            -c "CREATE SCHEMA public;" \
            -c "GRANT ALL ON SCHEMA public TO postgres;" \
            -c "GRANT ALL ON SCHEMA public TO public;"

          echo "Staging database reset complete"

          # Apply all migrations in order
          echo "Applying migrations to clean database..."
          for file in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            filename=$(basename "$file")
            [[ "$filename" == *.sql ]] || continue

            echo "  -> $filename"
            if ! psql "$_STAGING_DB_URL" -v ON_ERROR_STOP=1 -f "$file" > /tmp/migration.log 2>&1; then
              echo "::error::Migration failed: $filename"
              cat /tmp/migration.log
              exit 1
            fi
          done

          echo "All migrations applied successfully on staging"

          # Verify critical tables exist
          echo "Verifying schema..."
          TABLES="sites categories products content affiliate_clicks admin_users newsletter_subscribers audit_log ad_placements ad_impressions ai_drafts affiliate_networks"
          for table in $TABLES; do
            if ! psql "$_STAGING_DB_URL" -t -A -c "SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='$table';" | grep -q 1; then
              echo "::error::Missing table: $table"
              exit 1
            fi
          done
          echo "All critical tables exist"

          # Verify critical columns
          echo "Verifying critical columns..."

          for col in actor entity_type ip; do
            if ! psql "$_STAGING_DB_URL" -t -A -c "SELECT 1 FROM information_schema.columns WHERE table_name='audit_log' AND column_name='$col';" | grep -q 1; then
              echo "::error::Missing audit_log.$col column"
              exit 1
            fi
          done

          if ! psql "$_STAGING_DB_URL" -t -A -c "SELECT 1 FROM information_schema.columns WHERE table_name='sites' AND column_name='is_active';" | grep -q 1; then
            echo "::error::Missing sites.is_active column"
            exit 1
          fi

          if ! psql "$_STAGING_DB_URL" -t -A -c "SELECT 1 FROM information_schema.columns WHERE table_name='newsletter_subscribers' AND column_name='unsubscribe_token';" | grep -q 1; then
            echo "::error::Missing newsletter_subscribers.unsubscribe_token column"
            exit 1
          fi

          echo "All critical columns exist"

          # Verify analytics RPCs
          echo "Verifying analytics RPC functions..."
          RPCS="get_top_products get_top_referrers get_top_content_slugs get_daily_clicks"
          for rpc in $RPCS; do
            if ! psql "$_STAGING_DB_URL" -t -A -c "SELECT 1 FROM pg_proc WHERE proname='$rpc';" | grep -q 1; then
              echo "::error::Missing RPC function: $rpc"
              exit 1
            fi
          done
          echo "All analytics RPCs exist"

          # ── Schema drift check ──────────────────────────────────────
          # Compare staging schema against production to detect drift.
          echo "Checking for schema drift..."
          STAGING_TABLES=$(psql "$_STAGING_DB_URL" -t -A -c \
            "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name;")

          if [ -n "$SUPABASE_DB_URL" ]; then
            PROD_TABLES=$(psql "$SUPABASE_DB_URL" -t -A -c \
              "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name;" 2>/dev/null || echo "")

            if [ -n "$PROD_TABLES" ]; then
              STAGING_ONLY=$(comm -23 <(echo "$STAGING_TABLES") <(echo "$PROD_TABLES") || true)
              if [ -n "$STAGING_ONLY" ]; then
                echo "New tables being added to production:"
                echo "$STAGING_ONLY" | sed 's/^/  + /'
              fi

              PROD_ONLY=$(comm -13 <(echo "$STAGING_TABLES") <(echo "$PROD_TABLES") || true)
              if [ -n "$PROD_ONLY" ]; then
                echo "::warning::Tables in production but not in migrations (potential drift):"
                echo "$PROD_ONLY" | sed 's/^/  - /'
              fi
            else
              echo "Could not connect to production DB for drift check (non-fatal)"
            fi
          fi

          # ── Rollback notes check ────────────────────────────────────
          # Each migration should contain a rollback comment.
          echo "Checking rollback notes in migrations..."
          MISSING_ROLLBACK=""
          for file in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            filename=$(basename "$file")
            [[ "$filename" == *.sql ]] || continue
            if ! grep -qi "rollback\|revert\|undo\|drop.*if.*exists" "$file"; then
              MISSING_ROLLBACK="$MISSING_ROLLBACK $filename"
            fi
          done
          if [ -n "$MISSING_ROLLBACK" ]; then
            echo "::error::Migrations without rollback notes:$MISSING_ROLLBACK"
            echo "::error::Every migration MUST include a -- ROLLBACK: <instructions> comment"
            echo "::error::describing how to revert the change (expand-contract, down migration, etc.)."
            echo "::error::See docs/rollback-strategy.md for guidance."
            exit 1
          fi

          echo "Database reset smoke test PASSED"

      # ── G-31: Staging Worker integration smoke (validate runtime drift) ──
      #
      # The DB smoke above only validates that migrations apply cleanly
      # against staging Postgres. It does not catch runtime drift in the
      # OpenNext + Cloudflare Workers bundling pipeline — e.g. a bumped
      # compatibility_date that no longer accepts a flag, an OpenNext
      # transform that rejects a new Next.js feature, a missing binding
      # in wrangler.jsonc, or a worker bundle that exceeds the size
      # limit. Those failures only surface during the production
      # `wrangler deploy` step, where a rollback is far more expensive.
      #
      # This step exercises the full bundle-and-validate path against a
      # staging-shaped wrangler config so any runtime drift fails fast,
      # before the migrate-production stage touches the production DB.
      # `wrangler deploy --dry-run` performs all server-side validation
      # (account, bindings, compatibility flags) without uploading the
      # bundle, so it is safe to run on every push without affecting
      # any live Worker.
      - name: Staging Worker integration smoke (opennextjs-cloudflare build + wrangler dry-run)
        if: github.ref == 'refs/heads/main'
        env:
          # Use staging Supabase values when available so the build does
          # not bake production URLs/keys into a smoke artefact. Falls
          # back to the production NEXT_PUBLIC_* (which are public anyway)
          # if staging isn't configured yet, so this step does not block
          # repos that haven't provisioned staging infra.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_DEFAULT_SITE: ${{ vars.NEXT_PUBLIC_DEFAULT_SITE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_WORKER_NAME: affilite-mix-staging-smoke
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Staging Worker smoke requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to be set."
            echo "::error::wrangler dry-run still talks to the Cloudflare API to validate bindings and the account."
            exit 1
          fi

          echo "── Generating staging-scoped wrangler config ──"
          # Reuse the preview wrangler generator: it strips production-only
          # bits (routes, custom_domains, triggers.crons, self-reference
          # service binding) so the dry-run is portable to a staging
          # worker name and does not collide with the live worker's
          # routes.
          node scripts/generate-preview-wrangler.cjs

          echo "── Inlining placeholder KV namespace ids for dry-run validation ──"
          # The committed wrangler.jsonc leaves KV namespace ids empty so
          # each environment can inject its own; the deploy job calls
          # `npx wrangler kv namespace create` to populate them. The
          # smoke does not need real namespaces — we just need the
          # config to parse and pass schema validation. Substitute a
          # documented dummy id (32 hex chars) so wrangler accepts it.
          DUMMY_KV_ID="00000000000000000000000000000000"
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('wrangler.preview.json', 'utf8'));
            for (const ns of cfg.kv_namespaces || []) {
              if (!ns.id || ns.id.trim() === '') ns.id = '${DUMMY_KV_ID}';
            }
            fs.writeFileSync('wrangler.preview.json', JSON.stringify(cfg, null, 2));
          "

          echo "── Building OpenNext bundle for staging smoke ──"
          npx @opennextjs/cloudflare build --config wrangler.preview.json

          echo "── Validating Worker bundle via wrangler deploy --dry-run ──"
          # --dry-run performs server-side validation (account, bindings,
          # compatibility flags, bundle size) but does not upload the
          # Worker. Output is written to /tmp/staging-smoke so the
          # generated bundle can be inspected from the runner logs on
          # failure. Tail consumers are not required for dry-run; the
          # production rollout reattaches them after the live Tail
          # Worker is provisioned.
          npx --yes wrangler@${WRANGLER_VERSION} deploy \
            --dry-run \
            --outdir /tmp/staging-smoke \
            --config wrangler.preview.json

          echo "Staging Worker integration smoke PASSED"

  # ═══════════════════════════════════════════════════════════════════
  # STAGE 2: Snapshot production DB + apply migrations
  # ═══════════════════════════════════════════════════════════════════
  migrate-production:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      migrations_applied: ${{ steps.migrate.outputs.migrations_applied }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ── Skip entire migrate-production stage if requested ──────────
      # A89/A98-68: SKIP_DB_MIGRATIONS is a production-impacting bypass.
      # It requires a ticket reference and expiry to prevent permanent
      # skipping that leads to schema/code drift.
      - name: Check skip flag
        id: skip-check
        env:
          _SKIP: ${{ vars.SKIP_DB_MIGRATIONS }}
          _SKIP_TICKET: ${{ vars.SKIP_DB_MIGRATIONS_TICKET }}
          _SKIP_EXPIRES: ${{ vars.SKIP_DB_MIGRATIONS_EXPIRES }}
        run: |
          if [ "${_SKIP:-}" = "true" ]; then
            # Require ticket reference for audit trail
            if [ -z "${_SKIP_TICKET:-}" ]; then
              echo "::error::SKIP_DB_MIGRATIONS=true requires SKIP_DB_MIGRATIONS_TICKET to be set."
              echo "::error::Set it to the incident or change ticket URL authorizing this override."
              exit 1
            fi
            # Require expiry timestamp
            if [ -z "${_SKIP_EXPIRES:-}" ]; then
              echo "::error::SKIP_DB_MIGRATIONS=true requires SKIP_DB_MIGRATIONS_EXPIRES to be set."
              echo "::error::Set it to an ISO 8601 UTC datetime after which the override is invalid."
              exit 1
            fi
            # Check if the override has expired
            EXPIRES_EPOCH=$(date -d "$_SKIP_EXPIRES" +%s 2>/dev/null || echo "0")
            NOW_EPOCH=$(date +%s)
            if [ "$EXPIRES_EPOCH" -le "$NOW_EPOCH" ]; then
              echo "::error::SKIP_DB_MIGRATIONS has expired (was: $_SKIP_EXPIRES)."
              echo "::error::Remove SKIP_DB_MIGRATIONS or set a new expiry after confirming migrations are safe."
              exit 1
            fi
            echo "::warning::SKIP_DB_MIGRATIONS=true — skipping DB migration stage"
            echo "::warning::Override ticket: $_SKIP_TICKET"
            echo "::warning::Override expires: $_SKIP_EXPIRES"
            echo "::notice title=DB Migration Skip Active::SKIP_DB_MIGRATIONS=true was used by ${{ github.actor }} in workflow run ${{ github.run_id }}. Ticket: $_SKIP_TICKET. Expires: $_SKIP_EXPIRES. Ensure migrations are applied promptly."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install psql
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y postgresql-client 2>&1 | tail -5

      # ── Snapshot production DB before migration ────────────────────
      - name: Snapshot production DB
        if: steps.skip-check.outputs.skip != 'true'
        env:
          _DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          _DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          set -euo pipefail
          DB_URL="${_DB_POOLER_URL:-$_DB_URL}"
          # Strip ?pgbouncer=true — psql does not understand this query param.
          DB_URL="${DB_URL%%\?*}"

          if [ -z "$DB_URL" ]; then
            echo "::warning::No DB URL set, skipping snapshot"
            exit 0
          fi

          echo "Creating pre-migration schema snapshot..."

          # Record table list and row counts before migration
          psql "$DB_URL" -v ON_ERROR_STOP=1 -t -A -c "
            SELECT table_name, pg_relation_size(quote_ident(table_name))
            FROM information_schema.tables
            WHERE table_schema = 'public'
            ORDER BY table_name;
          " > /tmp/pre_migration_snapshot.txt 2>/dev/null || true

          # Record current migration state
          psql "$DB_URL" -v ON_ERROR_STOP=1 -t -A -c "
            SELECT filename, applied_at
            FROM _migrations_applied
            ORDER BY applied_at;
          " > /tmp/pre_migration_ledger.txt 2>/dev/null || true

          echo "Pre-migration snapshot saved"
          echo "--- Tables and sizes ---"
          cat /tmp/pre_migration_snapshot.txt || true
          echo "--- Applied migrations ---"
          cat /tmp/pre_migration_ledger.txt || true

      # ── Apply production migrations ────────────────────────────────
      - name: Apply database migrations to production
        id: migrate
        if: steps.skip-check.outputs.skip != 'true'
        env:
          _DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          _DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          set -euo pipefail

          echo "Applying database migrations to production..."
          # Prefer the pooler URL if provided; fall back to the direct URL.
          DB_URL="${_DB_POOLER_URL:-$_DB_URL}"
          # Strip ?pgbouncer=true — psql does not understand this query param.
          DB_URL="${DB_URL%%\?*}"

          # Audit F-005: production migrations cannot silently skip when the
          # DB URL secret is missing. A green deploy without a corresponding
          # migration apply is exactly how schemas drift in production.
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_POOLER_URL or SUPABASE_DB_URL is required for production deploy"
            echo "::error::Add the Supabase session pooler URL to GitHub repo secrets before retrying."
            exit 1
          fi

          # IPv4 preflight: GitHub Actions runners cannot reach IPv6-only hosts.
          DB_HOST=$(printf '%s' "$DB_URL" | sed -E 's|^[a-zA-Z]+://[^@]+@([^:/?]+).*|\1|')
          if ! getent ahostsv4 "$DB_HOST" >/dev/null 2>&1; then
            echo "::error::SUPABASE_DB_URL host '$DB_HOST' has no IPv4 address, but GitHub Actions runners are IPv4-only."
            echo "::error::Switch SUPABASE_DB_URL (or add SUPABASE_DB_POOLER_URL) to the Supabase session pooler URL:"
            echo "::error::  postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres"
            echo "::error::Find it in Supabase Dashboard → Project Settings → Database → Connection pooling → Session mode."
            exit 1
          fi

          # Create a migrations ledger table to track applied migrations.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE IF NOT EXISTS _migrations_applied (
              filename  text PRIMARY KEY,
              applied_at timestamptz NOT NULL DEFAULT now()
            );
          "

          # H-5: Track newly applied migrations for automated rollback
          : > /tmp/applied-migrations.txt

          if [ -d "supabase/migrations" ]; then
            for file in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
              filename=$(basename "$file")
              [[ "$filename" == *.sql ]] || continue
              # Skip down-migration files — they are not forward migrations
              [[ "$filename" == *-down.sql ]] && continue

              # Check if this migration has already been applied
              applied=$(psql "$DB_URL" -t -A -c \
                "SELECT COUNT(*) FROM _migrations_applied WHERE filename = '$filename';")

              if [ "$applied" = "1" ]; then
                echo "Already applied: $filename"
                continue
              fi

              echo "Applying: $filename"
              if psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$file"; then
                psql "$DB_URL" -c \
                  "INSERT INTO _migrations_applied (filename) VALUES ('$filename') ON CONFLICT DO NOTHING;"
                echo "$filename" >> /tmp/applied-migrations.txt
                echo "Applied: $filename"
              else
                echo "::error::Failed: $filename"
                exit 1
              fi
            done
          fi

          APPLIED_COUNT=$(wc -l < /tmp/applied-migrations.txt)
          echo "migrations_applied=$APPLIED_COUNT" >> "$GITHUB_OUTPUT"
          echo "Database migrations complete ($APPLIED_COUNT newly applied)"

      # ── Verify schema after migration ──────────────────────────────
      - name: Verify production schema
        if: steps.skip-check.outputs.skip != 'true'
        env:
          _DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          _DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          set -euo pipefail
          DB_URL="${_DB_POOLER_URL:-$_DB_URL}"
          # Strip ?pgbouncer=true — psql does not understand this query param.
          DB_URL="${DB_URL%%\?*}"

          # Audit F-005: schema verification is only meaningful when it ran
          # against the same DB the migration step targeted. Missing URL
          # here means the previous step did the same skip; both must
          # fail closed instead of greenwashing the deploy.
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_POOLER_URL or SUPABASE_DB_URL is required for post-migration schema verification"
            exit 1
          fi

          echo "Verifying production schema after migration..."

          # Verify critical tables exist
          TABLES="sites categories products content affiliate_clicks admin_users newsletter_subscribers audit_log"
          for table in $TABLES; do
            if ! psql "$DB_URL" -t -A -c "SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='$table';" | grep -q 1; then
              echo "::error::Missing table after migration: $table"
              exit 1
            fi
          done

          # G-T-01: stripe_events must carry the columns referenced by the
          # webhook processor and the data-retention cron. Audit S-06 hit
          # the failure mode where `created_at` was missing in production
          # while code was already querying it.
          STRIPE_COLS="stripe_event_id event_type received_at created_at"
          for col in $STRIPE_COLS; do
            if ! psql "$DB_URL" -t -A -c "SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='stripe_events' AND column_name='$col';" | grep -q 1; then
              echo "::error::Missing column on stripe_events: $col (G-T-01 / audit S-06). Migration 00081 should add it; check the migrate-production stage."
              exit 1
            fi
          done

          echo "Post-migration schema verification passed"

      # ── G-MD-01: production migration ledger gate ──────────────────
      # Hard-fails the deploy if the production `_migrations_applied`
      # ledger is behind the newest migration file in the repo. Without
      # this gate, a bug that silently skipped the migrate-production
      # stage (e.g. an env-condition mistake) could ship code expecting
      # an unmigrated schema.
      - name: Migration ledger gate (G-MD-01)
        if: steps.skip-check.outputs.skip != 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          set -euo pipefail
          bash scripts/check-migration-ledger.sh

  # ═══════════════════════════════════════════════════════════════════
  # STAGE 3: Build and deploy application
  # ═══════════════════════════════════════════════════════════════════
  deploy:
    needs: [validate, migrate-production]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # ── Create R2 bucket if not exists ──────────────────────────────
      - name: Create R2 bucket (if not exists)
        run: |
          echo "Checking R2 bucket..."
          npx --yes wrangler@${WRANGLER_VERSION} r2 bucket create next-inc-cache 2>&1 || echo "Bucket may already exist, continuing..."

      # ── Create Queues if not exists (A44 / F-028) ────────────────────
      # Cloudflare Queues are not auto-created by wrangler deploy.
      # The click-tracking queue and its DLQ must exist before the
      # Worker can bind to them. `wrangler queues create` is idempotent
      # (returns 409 if the queue already exists), so we tolerate
      # non-zero exits to keep reruns safe.
      - name: Create Queues (if not exists)
        run: |
          set -euo pipefail
          echo "Checking Cloudflare Queues..."

          for q in click-tracking click-tracking-dlq; do
            echo "Creating queue $q (or skipping if already exists)..."
            npx --yes wrangler@${WRANGLER_VERSION} queues create "$q" 2>&1 \
              || echo "Queue $q may already exist, continuing..."
          done

          echo "Queue provisioning complete"

      # ── N-003 / Audit R-008: deploy the Tail Worker before the main Worker ──
      #
      # The log-shipper Tail Worker must already exist in the account
      # before the main Worker can reference it via `tail_consumers`,
      # otherwise wrangler rejects the deploy. This step:
      #   1. Idempotently creates the `affilite-mix-logs` R2 bucket
      #      that the shipper writes to.
      #   2. Deploys the shipper Worker from `workers/log-shipper/`.
      #   3. Rewrites `wrangler.jsonc` so the main Worker's
      #      `tail_consumers` references the now-deployed shipper.
      #
      # Gated on the `LOG_SHIPPER_ENABLED` repo variable so existing
      # accounts without the shipper provisioned keep deploying as
      # before. Operators flip the variable to `true` once they want
      # durable observability — no code change required.
      #
      # F-009: durable observability is mandatory for production. If
      # the deploy workflow is invoked against the production
      # environment but LOG_SHIPPER_ENABLED is unset/false, fail
      # closed before any Worker mutation happens. Set the variable
      # `LOG_SHIPPER_REQUIRED_OVERRIDE=true` for a one-off override
      # (logged, audited).
      # F-005: Hardened log-shipping override with expiry, ticket requirement,
      # and structured audit trail. The override is a break-glass mechanism
      # and must be time-bounded and traceable.
      - name: Enforce log shipping in production (F-005 / F-009)
        run: |
          set -euo pipefail
          ENABLED="${{ vars.LOG_SHIPPER_ENABLED }}"
          OVERRIDE="${{ vars.LOG_SHIPPER_REQUIRED_OVERRIDE }}"
          OVERRIDE_TICKET="${{ vars.LOG_SHIPPER_OVERRIDE_TICKET }}"
          OVERRIDE_EXPIRES="${{ vars.LOG_SHIPPER_OVERRIDE_EXPIRES }}"
          SKIP_CHECK="${{ vars.SKIP_LOG_SHIPPER_CHECK }}"

          # SKIP_LOG_SHIPPER_CHECK=true is a simple bypass for projects that
          # have not yet provisioned the log-shipper worker. Unlike
          # LOG_SHIPPER_REQUIRED_OVERRIDE, it does not require a ticket or
          # expiry — it is intended for early-stage / non-production setups.
          # Set SKIP_LOG_SHIPPER_CHECK=false (or remove it) once you are ready
          # to enforce durable observability.
          if [ "$SKIP_CHECK" = "true" ]; then
            echo "::warning::SKIP_LOG_SHIPPER_CHECK=true — skipping log-shipper enforcement (F-009)."
            echo "::warning::To enable durable observability: deploy workers/log-shipper and set LOG_SHIPPER_ENABLED=true."
            exit 0
          fi

          if [ "$ENABLED" != "true" ] && [ "$OVERRIDE" != "true" ]; then
            echo "::error::F-009: production deploy requires LOG_SHIPPER_ENABLED=true." >&2
            echo "::error::Provision the Tail Worker (workers/log-shipper) and set the repo" >&2
            echo "::error::variable LOG_SHIPPER_ENABLED=true. For a temporary, audited" >&2
            echo "::error::override, set LOG_SHIPPER_REQUIRED_OVERRIDE=true along with:" >&2
            echo "::error::  LOG_SHIPPER_OVERRIDE_TICKET=<incident/change ticket URL>" >&2
            echo "::error::  LOG_SHIPPER_OVERRIDE_EXPIRES=<ISO8601 UTC datetime>" >&2
            echo "::error::Or set SKIP_LOG_SHIPPER_CHECK=true (Variables tab) to bypass" >&2
            echo "::error::enforcement for projects not yet using the log-shipper." >&2
            exit 1
          fi

          if [ "$OVERRIDE" = "true" ] && [ "$ENABLED" != "true" ]; then
            # F-005: Require a linked ticket for audit trail
            if [ -z "$OVERRIDE_TICKET" ]; then
              echo "::error::F-005: LOG_SHIPPER_REQUIRED_OVERRIDE=true requires LOG_SHIPPER_OVERRIDE_TICKET to be set."
              echo "::error::Set it to the incident or change ticket URL authorizing this override."
              exit 1
            fi

            # F-005: Require an expiry timestamp and enforce it
            if [ -z "$OVERRIDE_EXPIRES" ]; then
              echo "::error::F-005: LOG_SHIPPER_REQUIRED_OVERRIDE=true requires LOG_SHIPPER_OVERRIDE_EXPIRES to be set."
              echo "::error::Set it to an ISO 8601 UTC datetime (e.g. 2025-01-15T12:00:00Z) after which the override is invalid."
              exit 1
            fi

            # Check if the override has expired
            EXPIRES_EPOCH=$(date -d "$OVERRIDE_EXPIRES" +%s 2>/dev/null || echo "0")
            NOW_EPOCH=$(date +%s)
            if [ "$EXPIRES_EPOCH" -le "$NOW_EPOCH" ]; then
              echo "::error::F-005: LOG_SHIPPER_REQUIRED_OVERRIDE has expired (was: $OVERRIDE_EXPIRES)."
              echo "::error::Either restore LOG_SHIPPER_ENABLED=true or set a new expiry."
              exit 1
            fi

            echo "::warning::F-005: LOG_SHIPPER_REQUIRED_OVERRIDE=true is bypassing the durable-log-shipping requirement."
            echo "::warning::Override used by: ${{ github.actor }} at $(date -u +%Y-%m-%dT%H:%M:%SZ) in run ${{ github.run_id }}"
            echo "::warning::Linked ticket: $OVERRIDE_TICKET"
            echo "::warning::Override expires: $OVERRIDE_EXPIRES"
            echo "::warning::Restore LOG_SHIPPER_ENABLED=true ASAP."
            # Surface override usage as a GitHub Actions annotation so it
            # appears in the PR / commit checks summary and is auditable.
            echo "::notice title=Log-Shipper Override Active::LOG_SHIPPER_REQUIRED_OVERRIDE=true was used by ${{ github.actor }} in workflow run ${{ github.run_id }}. Ticket: $OVERRIDE_TICKET. Expires: $OVERRIDE_EXPIRES. Ensure LOG_SHIPPER_ENABLED is restored promptly."
          fi

      - name: Deploy log-shipper Tail Worker
        if: vars.LOG_SHIPPER_ENABLED == 'true'
        run: |
          set -euo pipefail
          echo "LOG_SHIPPER_ENABLED=true — provisioning Tail Worker..."

          # 1. R2 bucket for durable log storage. `r2 bucket create` is
          # idempotent on Cloudflare's side but emits non-zero on conflict;
          # tolerate that so reruns don't fail.
          npx --yes wrangler@${WRANGLER_VERSION} r2 bucket create affilite-mix-logs 2>&1 \
            || echo "affilite-mix-logs bucket may already exist, continuing..."

          # 2. Deploy the Tail Worker.
          npx --yes wrangler@${WRANGLER_VERSION} deploy \
            --config workers/log-shipper/wrangler.jsonc

      - name: Wire tail_consumers in wrangler.jsonc
        if: vars.LOG_SHIPPER_ENABLED == 'true'
        run: |
          set -euo pipefail
          SHIPPER_SERVICE=affilite-mix-log-shipper \
            node scripts/inject-tail-consumers.mjs wrangler.jsonc
          echo "── tail_consumers after rewrite ─────────────────────"
          grep -n -B1 -A3 '"tail_consumers"' wrangler.jsonc | grep -v '//' || true

      # ── Create KV namespaces if not exists, then inline the ids ──────
      #
      # Audit F-007: APP_CACHE_KV is referenced by middleware for dynamic
      # domain resolution; it has the same lifecycle requirements as
      # RATE_LIMIT_KV and must be provisioned/inlined or the deploy will
      # ship with an unresolved binding placeholder.
      - name: Create KV namespaces (if not exist)
        run: |
          set -euo pipefail

          # Runs `wrangler kv namespace list`, strips the wrangler 4.x
          # stdout banner (non-JSON lines) so jq only sees the JSON array,
          # and surfaces auth / permission errors instead of an opaque
          # "jq: parse error" (AUD-02).
          wrangler_kv_list_json() {
            local raw_file
            raw_file=$(mktemp)
            local err_file
            err_file=$(mktemp)

            if ! npx --yes wrangler@${WRANGLER_VERSION} kv namespace list \
                 >"$raw_file" 2>"$err_file"; then
              echo "::error::wrangler kv namespace list failed. stderr:" >&2
              cat "$err_file" >&2
              echo "stdout was:" >&2
              cat "$raw_file" >&2
              rm -f "$raw_file" "$err_file"
              return 1
            fi
            rm -f "$err_file"
            # Strip non-JSON banner lines (e.g. "⛅️ wrangler …",
            # "Resource location: remote") that wrangler 4.x emits
            # before the JSON array.
            sed -n '/^\[/,$ p' "$raw_file"
            rm -f "$raw_file"
          }

          resolve_or_create_kv() {
            local name="$1"
            local id

            local list_json
            if ! list_json=$(wrangler_kv_list_json); then
              echo "::error::Unable to list KV namespaces. Check CLOUDFLARE_API_TOKEN has 'Workers KV Storage:Edit' permission." >&2
              exit 1
            fi

            id=$(echo "$list_json" \
              | jq -r --arg n "$name" --arg pn "affilite-mix-$name" \
                  '.[] | select(.title == $n or .title == $pn) | .id' \
              | head -n1 || true)

            if [ -z "$id" ]; then
              echo "No existing $name namespace found — creating one..." >&2
              local create_out
              create_out=$(npx --yes wrangler@${WRANGLER_VERSION} kv namespace create "$name" 2>&1 || true)
              echo "$create_out" >&2
              id=$(echo "$create_out" | grep -oE '"id"[[:space:]]*:[[:space:]]*"[^"]+"' | head -n1 | sed -E 's/.*"([^"]+)"$/\1/' || true)
              if [ -z "$id" ]; then
                if ! list_json=$(wrangler_kv_list_json); then
                  echo "::error::Unable to list KV namespaces after create attempt." >&2
                  exit 1
                fi
                id=$(echo "$list_json" \
                  | jq -r --arg n "$name" --arg pn "affilite-mix-$name" \
                      '.[] | select(.title == $n or .title == $pn) | .id' \
                  | head -n1 || true)
              fi
            fi

            if [ -z "$id" ]; then
              echo "::error::Unable to resolve $name namespace id. Check CLOUDFLARE_API_TOKEN has 'Workers KV Storage:Edit' permission." >&2
              exit 1
            fi
            echo "$id"
          }

          inline_kv_id() {
            local binding="$1"
            local id="$2"
            BINDING="$binding" KV_ID="$id" perl -i -0pe '
              s/("binding"\s*:\s*"$ENV{BINDING}"[^}]*?"id"\s*:\s*")[^"]*(")/$1$ENV{KV_ID}$2/s
            ' wrangler.jsonc
            if ! grep -q "\"id\": \"$id\"" wrangler.jsonc; then
              echo "::error::Failed to inline $binding namespace id into wrangler.jsonc"
              grep -n "$binding" wrangler.jsonc || true
              exit 1
            fi
          }

          for binding in RATE_LIMIT_KV APP_CACHE_KV; do
            echo "Resolving KV namespace id for $binding..."
            id=$(resolve_or_create_kv "$binding")
            echo "Using $binding namespace id: $id"
            inline_kv_id "$binding" "$id"
            echo "Inlined $binding namespace id into wrangler.jsonc"
          done

      # AUDIT-2026-06 (Finding #5): final placeholder gate. The KV
      # namespace IDs were just inlined into wrangler.jsonc by the perl
      # substitution above. If that step silently failed (e.g. a future
      # refactor renames a binding so the regex no longer matches),
      # Wrangler would happily ship the literal `${RATE_LIMIT_KV_NAMESPACE_ID}`
      # string as the namespace ID. Run the placeholder guard in
      # `--strict` mode so any unresolved `${...}` token blocks the
      # deploy with a useful diagnostic rather than a runtime "namespace
      # not found" error at the edge.
      - name: Verify wrangler placeholders fully resolved (post-inline)
        run: |
          node scripts/check-wrangler-placeholders.mjs --strict \
            wrangler.jsonc \
            wrangler.heavy-crons.jsonc

      # ── A10-01: Require Sentry DSN for production builds ────────────
      # Temporarily downgraded from hard-fail to warning. Re-tighten this
      # (swap ::warning:: back to ::error:: + exit 1) once a real Sentry DSN
      # is set in the NEXT_PUBLIC_SENTRY_DSN GitHub Actions secret.
      - name: Require NEXT_PUBLIC_SENTRY_DSN for production
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$NEXT_PUBLIC_SENTRY_DSN" ]; then
            echo "::warning::NEXT_PUBLIC_SENTRY_DSN is empty — client-side Sentry reports will be unavailable until a real DSN is set."
            echo "::warning::See https://sentry.io to create a project, then paste its DSN into the GitHub Actions secret NEXT_PUBLIC_SENTRY_DSN."
          fi

      # ── Build OpenNext bundle ─────────────────────────────────────────
      # opennextjs-cloudflare deploy
      - name: Build OpenNext bundle
        run: npx @opennextjs/cloudflare build

      # ── A34-05: Generate SBOM for supply-chain transparency ──────────
      - name: Generate SBOM (CycloneDX)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json --output-format json --omit dev
          echo "SBOM generated: $(jq '.components | length' sbom.cdx.json) components"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      # ── Set Worker secrets BEFORE deploy (audit R-004) ────────────────
      #
      # Cloudflare evaluates secrets at request time, so a deploy that
      # ships before the secret rotation completes will serve traffic
      # against stale or missing secrets — a partial outage masquerading
      # as a successful deploy. Synchronise secrets first; the deploy
      # below either picks them up immediately or never runs.
      - name: Set Worker secrets
        run: |
          set -euo pipefail

          # Validate that all required secrets are present before touching the worker.
          MISSING=""
          [ -z "$_CRON_SECRET" ]        && MISSING="$MISSING CRON_SECRET"
          [ -z "$_JWT_SECRET" ]         && MISSING="$MISSING JWT_SECRET"
          [ -z "$_SB_SERVICE_KEY" ]     && MISSING="$MISSING SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$_SB_JWT_SECRET" ]      && MISSING="$MISSING SUPABASE_JWT_SECRET"
          [ -z "$_SB_URL" ]             && MISSING="$MISSING NEXT_PUBLIC_SUPABASE_URL"
          [ -z "$_SB_ANON_KEY" ]        && MISSING="$MISSING NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -z "$_CRON_HOST" ]          && MISSING="$MISSING CRON_HOST"
          [ -z "$_INTERNAL_TOKEN" ]     && MISSING="$MISSING INTERNAL_API_TOKEN"
          # NEW-001: Per-trigger cron secrets are required in production —
          # `verifyCronAuth` rejects requests authed via the shared
          # CRON_SECRET fallback unless CRON_ALLOW_SHARED_FALLBACK_IN_PROD=1
          # is set, and `instrumentation.ts` throws on missing required env.
          # Keep this list aligned with `lib/cron-registry.ts -> cronJobs`.
          [ -z "$_CRON_PUBLISH" ]       && MISSING="$MISSING CRON_PUBLISH_SECRET"
          [ -z "$_CRON_STRIPE" ]        && MISSING="$MISSING CRON_STRIPE_SYNC_SECRET"
          [ -z "$_CRON_AI" ]            && MISSING="$MISSING CRON_AI_SECRET"
          [ -z "$_CRON_SITEMAP" ]       && MISSING="$MISSING CRON_SITEMAP_SECRET"
          [ -z "$_CRON_RETENTION" ]     && MISSING="$MISSING CRON_RETENTION_SECRET"
          [ -z "$_CRON_COMMISSION" ]    && MISSING="$MISSING CRON_COMMISSION_SECRET"
          [ -z "$_CRON_EPC" ]           && MISSING="$MISSING CRON_EPC_SECRET"
          [ -z "$_CRON_PRICE" ]         && MISSING="$MISSING CRON_PRICE_SECRET"
          [ -z "$_CRON_DEALS" ]         && MISSING="$MISSING CRON_DEALS_SECRET"
          [ -z "$_CRON_CLICK_RECONCILE" ] && MISSING="$MISSING CRON_CLICK_RECONCILE_SECRET"
          [ -z "$_CRON_ACCESS_REVIEW" ]   && MISSING="$MISSING CRON_ACCESS_REVIEW_SECRET"
          [ -z "$_CRON_HOMEPAGE_SYNTHETIC" ] && MISSING="$MISSING CRON_HOMEPAGE_SYNTHETIC_SECRET"

          if [ -n "$MISSING" ]; then
            echo "::error::Required secrets are missing:$MISSING"
            exit 1
          fi

          echo "Setting required Worker secrets..."
          echo "$_CRON_SECRET"        | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_SECRET --name affilite-mix > /dev/null 2>&1
          echo "$_JWT_SECRET"         | npx --yes wrangler@${WRANGLER_VERSION} secret put JWT_SECRET --name affilite-mix > /dev/null 2>&1
          echo "$_SB_SERVICE_KEY"     | npx --yes wrangler@${WRANGLER_VERSION} secret put SUPABASE_SERVICE_ROLE_KEY --name affilite-mix > /dev/null 2>&1
          echo "$_SB_JWT_SECRET"      | npx --yes wrangler@${WRANGLER_VERSION} secret put SUPABASE_JWT_SECRET --name affilite-mix > /dev/null 2>&1
          echo "$_SB_URL"             | npx --yes wrangler@${WRANGLER_VERSION} secret put NEXT_PUBLIC_SUPABASE_URL --name affilite-mix > /dev/null 2>&1
          echo "$_SB_ANON_KEY"        | npx --yes wrangler@${WRANGLER_VERSION} secret put NEXT_PUBLIC_SUPABASE_ANON_KEY --name affilite-mix > /dev/null 2>&1
          echo "$_CRON_HOST"          | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_HOST --name affilite-mix > /dev/null 2>&1
          echo "$_INTERNAL_TOKEN"     | npx --yes wrangler@${WRANGLER_VERSION} secret put INTERNAL_API_TOKEN --name affilite-mix > /dev/null 2>&1

          # C1 / F-18: production requires the per-purpose internal tokens.
          # getInternalTokenFor() throws in production when these are unset,
          # which 500s /api/queue/clicks (breaking click ingestion + the DLQ)
          # and every getInternalTokenFor("internal") caller. Default each to
          # the monolithic INTERNAL_API_TOKEN when a dedicated per-purpose
          # GitHub secret is not configured, so blast-radius reduction is
          # opt-in (set the dedicated secret to rotate independently) without
          # breaking existing deployments. The queue worker signs with the
          # click-queue token via resolveClickQueueToken() in custom-worker.ts.
          echo "${_INTERNAL_TOKEN_CLICK_QUEUE:-$_INTERNAL_TOKEN}" | npx --yes wrangler@${WRANGLER_VERSION} secret put INTERNAL_API_TOKEN_CLICK_QUEUE --name affilite-mix > /dev/null 2>&1
          echo "${_INTERNAL_TOKEN_CRON:-$_INTERNAL_TOKEN}"        | npx --yes wrangler@${WRANGLER_VERSION} secret put INTERNAL_API_TOKEN_CRON --name affilite-mix > /dev/null 2>&1
          echo "${_INTERNAL_TOKEN_INTERNAL:-$_INTERNAL_TOKEN}"    | npx --yes wrangler@${WRANGLER_VERSION} secret put INTERNAL_API_TOKEN_INTERNAL --name affilite-mix > /dev/null 2>&1

          # INCIDENT 2026-06-10: AFFILIATE_DOMAIN_ENFORCEMENT is hard-required
          # at startup in production (lib/server-env.ts, R-01) but was only
          # ever set manually on the Worker — it was wiped between deploys and
          # the next cold start threw in instrumentation.ts, returning 500 for
          # every request on every tenant for ~7 hours. Push it on every deploy
          # so the Worker can never boot without it. Not sensitive: the only
          # valid production value is the literal "strict".
          echo "strict"               | npx --yes wrangler@${WRANGLER_VERSION} secret put AFFILIATE_DOMAIN_ENFORCEMENT --name affilite-mix > /dev/null 2>&1

          # NEW-001: Per-trigger cron secrets. One per cronJobs entry in
          # `lib/cron-registry.ts`. The registry test asserts that every
          # job's secretEnvVar appears here as a `wrangler secret put`
          # line so adding a new cron without wiring its secret fails CI.
          echo "Setting per-trigger cron secrets on main worker (NEW-001)..."
          echo "$_CRON_PUBLISH"       | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_PUBLISH_SECRET --name affilite-mix > /dev/null 2>&1
          echo "$_CRON_STRIPE"        | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_STRIPE_SYNC_SECRET --name affilite-mix > /dev/null 2>&1
          echo "$_CRON_AI"            | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_AI_SECRET --name affilite-mix > /dev/null 2>&1
          echo "$_CRON_SITEMAP"       | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_SITEMAP_SECRET --name affilite-mix > /dev/null 2>&1
          echo "$_CRON_RETENTION"     | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_RETENTION_SECRET --name affilite-mix > /dev/null 2>&1
          echo "$_CRON_COMMISSION"    | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_COMMISSION_SECRET --name affilite-mix > /dev/null 2>&1
          echo "$_CRON_EPC"           | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_EPC_SECRET --name affilite-mix > /dev/null 2>&1
          echo "$_CRON_PRICE"         | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_PRICE_SECRET --name affilite-mix > /dev/null 2>&1
          echo "$_CRON_DEALS"         | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_DEALS_SECRET --name affilite-mix > /dev/null 2>&1
          echo "$_CRON_CLICK_RECONCILE" | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_CLICK_RECONCILE_SECRET --name affilite-mix > /dev/null 2>&1
          echo "$_CRON_ACCESS_REVIEW" | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_ACCESS_REVIEW_SECRET --name affilite-mix > /dev/null 2>&1
          echo "$_CRON_HOMEPAGE_SYNTHETIC" | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_HOMEPAGE_SYNTHETIC_SECRET --name affilite-mix > /dev/null 2>&1

          echo "Setting optional Worker secrets (skipped if not configured)..."
          [ -n "$_RESEND_KEY" ]       && echo "$_RESEND_KEY"       | npx --yes wrangler@${WRANGLER_VERSION} secret put RESEND_API_KEY --name affilite-mix > /dev/null 2>&1       || true
          [ -n "$_SENTRY_DSN" ]       && echo "$_SENTRY_DSN"       | npx --yes wrangler@${WRANGLER_VERSION} secret put SENTRY_DSN --name affilite-mix > /dev/null 2>&1           || true
          [ -n "$_TURNSTILE_KEY" ]    && echo "$_TURNSTILE_KEY"    | npx --yes wrangler@${WRANGLER_VERSION} secret put TURNSTILE_SECRET_KEY --name affilite-mix > /dev/null 2>&1 || true
          [ -n "$_TURNSTILE_SITE_KEY" ] && echo "$_TURNSTILE_SITE_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put NEXT_PUBLIC_TURNSTILE_SITE_KEY --name affilite-mix > /dev/null 2>&1 || true
          [ -n "$_NL_FROM" ]          && echo "$_NL_FROM"          | npx --yes wrangler@${WRANGLER_VERSION} secret put NEWSLETTER_FROM_EMAIL --name affilite-mix > /dev/null 2>&1 || true

          echo "Setting optional AI provider secrets..."
          [ -n "$_CF_AI_TOKEN" ]      && echo "$_CF_AI_TOKEN"      | npx --yes wrangler@${WRANGLER_VERSION} secret put CLOUDFLARE_AI_API_TOKEN --name affilite-mix > /dev/null 2>&1 || true
          [ -n "$_GEMINI_KEY" ]       && echo "$_GEMINI_KEY"       | npx --yes wrangler@${WRANGLER_VERSION} secret put GEMINI_API_KEY --name affilite-mix > /dev/null 2>&1         || true
          [ -n "$_GROQ_KEY" ]         && echo "$_GROQ_KEY"         | npx --yes wrangler@${WRANGLER_VERSION} secret put GROQ_API_KEY --name affilite-mix > /dev/null 2>&1           || true
          [ -n "$_COHERE_KEY" ]       && echo "$_COHERE_KEY"       | npx --yes wrangler@${WRANGLER_VERSION} secret put COHERE_API_KEY --name affilite-mix > /dev/null 2>&1         || true

          echo "Setting optional affiliate network secrets..."
          [ -n "$_CJ_KEY" ]           && echo "$_CJ_KEY"           | npx --yes wrangler@${WRANGLER_VERSION} secret put CJ_API_KEY --name affilite-mix > /dev/null 2>&1             || true
          [ -n "$_CJ_PUB" ]           && echo "$_CJ_PUB"           | npx --yes wrangler@${WRANGLER_VERSION} secret put CJ_PUBLISHER_ID --name affilite-mix > /dev/null 2>&1       || true
          [ -n "$_PSTACK_KEY" ]       && echo "$_PSTACK_KEY"       | npx --yes wrangler@${WRANGLER_VERSION} secret put PARTNERSTACK_API_KEY --name affilite-mix > /dev/null 2>&1   || true
          [ -n "$_ADMITAD_KEY" ]      && echo "$_ADMITAD_KEY"      | npx --yes wrangler@${WRANGLER_VERSION} secret put ADMITAD_API_KEY --name affilite-mix > /dev/null 2>&1        || true
          [ -n "$_ADMITAD_PUB" ]      && echo "$_ADMITAD_PUB"      | npx --yes wrangler@${WRANGLER_VERSION} secret put ADMITAD_PUBLISHER_ID --name affilite-mix > /dev/null 2>&1   || true

          echo "Setting optional Stripe secrets (LIVE-17)..."
          [ -n "$_STRIPE_KEY" ]       && echo "$_STRIPE_KEY"       | npx --yes wrangler@${WRANGLER_VERSION} secret put STRIPE_SECRET_KEY --name affilite-mix > /dev/null 2>&1        || true
          [ -n "$_STRIPE_WH" ]        && echo "$_STRIPE_WH"        | npx --yes wrangler@${WRANGLER_VERSION} secret put STRIPE_WEBHOOK_SECRET --name affilite-mix > /dev/null 2>&1   || true
          [ -n "$_STRIPE_INSIDER" ]   && echo "$_STRIPE_INSIDER"   | npx --yes wrangler@${WRANGLER_VERSION} secret put STRIPE_PRICE_ID_INSIDER --name affilite-mix > /dev/null 2>&1 || true
          [ -n "$_STRIPE_PRO" ]       && echo "$_STRIPE_PRO"       | npx --yes wrangler@${WRANGLER_VERSION} secret put STRIPE_PRICE_ID_PRO --name affilite-mix > /dev/null 2>&1     || true
          # CRON_STRIPE_SYNC_SECRET is now uploaded unconditionally above as
          # part of the NEW-001 per-trigger cron secret rollout.

          echo "Setting optional R2 image storage secrets..."
          [ -n "$_R2_ACCOUNT" ]       && echo "$_R2_ACCOUNT"       | npx --yes wrangler@${WRANGLER_VERSION} secret put R2_ACCOUNT_ID --name affilite-mix > /dev/null 2>&1          || true
          [ -n "$_R2_KEY_ID" ]        && echo "$_R2_KEY_ID"        | npx --yes wrangler@${WRANGLER_VERSION} secret put R2_ACCESS_KEY_ID --name affilite-mix > /dev/null 2>&1       || true
          [ -n "$_R2_SECRET" ]        && echo "$_R2_SECRET"        | npx --yes wrangler@${WRANGLER_VERSION} secret put R2_SECRET_ACCESS_KEY --name affilite-mix > /dev/null 2>&1   || true
          [ -n "$_R2_BUCKET" ]        && echo "$_R2_BUCKET"        | npx --yes wrangler@${WRANGLER_VERSION} secret put R2_BUCKET_NAME --name affilite-mix > /dev/null 2>&1         || true
          [ -n "$_R2_URL" ]           && echo "$_R2_URL"           | npx --yes wrangler@${WRANGLER_VERSION} secret put R2_PUBLIC_URL --name affilite-mix > /dev/null 2>&1          || true
          [ -n "$_R2_PRIVATE_BUCKET" ] && echo "$_R2_PRIVATE_BUCKET" | npx --yes wrangler@${WRANGLER_VERSION} secret put R2_PRIVATE_BUCKET --name affilite-mix > /dev/null 2>&1 || true
          [ -n "$_R2_PUBLIC_BUCKET" ]  && echo "$_R2_PUBLIC_BUCKET"  | npx --yes wrangler@${WRANGLER_VERSION} secret put R2_PUBLIC_BUCKET --name affilite-mix > /dev/null 2>&1 || true

          echo "Worker secrets configured"
        env:
          _CRON_SECRET: ${{ secrets.CRON_SECRET }}
          _JWT_SECRET: ${{ secrets.JWT_SECRET }}
          _SB_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          _SB_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          _SB_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          _SB_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          _RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
          _SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          _INTERNAL_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          # C1 / F-18: optional per-purpose internal tokens. When unset the
          # deploy step defaults them to INTERNAL_API_TOKEN (see the run block).
          _INTERNAL_TOKEN_CLICK_QUEUE: ${{ secrets.INTERNAL_API_TOKEN_CLICK_QUEUE }}
          _INTERNAL_TOKEN_CRON: ${{ secrets.INTERNAL_API_TOKEN_CRON }}
          _INTERNAL_TOKEN_INTERNAL: ${{ secrets.INTERNAL_API_TOKEN_INTERNAL }}
          _CRON_HOST: ${{ vars.CRON_HOST }}
          _TURNSTILE_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          _TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          _NL_FROM: ${{ secrets.NEWSLETTER_FROM_EMAIL }}
          _CF_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          _GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          _GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          _COHERE_KEY: ${{ secrets.COHERE_API_KEY }}
          _CJ_KEY: ${{ secrets.CJ_API_KEY }}
          _CJ_PUB: ${{ secrets.CJ_PUBLISHER_ID }}
          _PSTACK_KEY: ${{ secrets.PARTNERSTACK_API_KEY }}
          _ADMITAD_KEY: ${{ secrets.ADMITAD_API_KEY }}
          _ADMITAD_PUB: ${{ secrets.ADMITAD_PUBLISHER_ID }}
          _STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          _STRIPE_WH: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          _STRIPE_INSIDER: ${{ secrets.STRIPE_PRICE_ID_INSIDER }}
          _STRIPE_PRO: ${{ secrets.STRIPE_PRICE_ID_PRO }}
          # NEW-001: Per-trigger cron secrets, one per `cronJobs` entry in
          # `lib/cron-registry.ts`. Required in production; the validate
          # step above and `__tests__/cron-registry.test.ts` enforce that
          # this list stays in sync with the registry.
          _CRON_PUBLISH: ${{ secrets.CRON_PUBLISH_SECRET }}
          _CRON_STRIPE: ${{ secrets.CRON_STRIPE_SYNC_SECRET }}
          _CRON_AI: ${{ secrets.CRON_AI_SECRET }}
          _CRON_SITEMAP: ${{ secrets.CRON_SITEMAP_SECRET }}
          _CRON_RETENTION: ${{ secrets.CRON_RETENTION_SECRET }}
          _CRON_COMMISSION: ${{ secrets.CRON_COMMISSION_SECRET }}
          _CRON_EPC: ${{ secrets.CRON_EPC_SECRET }}
          _CRON_PRICE: ${{ secrets.CRON_PRICE_SECRET }}
          _CRON_DEALS: ${{ secrets.CRON_DEALS_SECRET }}
          _CRON_CLICK_RECONCILE: ${{ secrets.CRON_CLICK_RECONCILE_SECRET }}
          _CRON_ACCESS_REVIEW: ${{ secrets.CRON_ACCESS_REVIEW_SECRET }}
          _CRON_HOMEPAGE_SYNTHETIC: ${{ secrets.CRON_HOMEPAGE_SYNTHETIC_SECRET }}
          _R2_ACCOUNT: ${{ vars.R2_ACCOUNT_ID }}
          _R2_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          _R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          _R2_BUCKET: ${{ vars.R2_BUCKET_NAME }}
          _R2_URL: ${{ vars.R2_PUBLIC_URL }}
          _R2_PRIVATE_BUCKET: ${{ vars.R2_PRIVATE_BUCKET }}
          _R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}

      # ── Deploy to Cloudflare (after secrets are synced) ────────────────
      #
      # Audit R-004: this step runs AFTER `Set Worker secrets` so traffic
      # never hits the new Worker bundle while the secret store is still
      # mid-rotation. The post-deploy health-check stage below verifies
      # the live Worker reports `status=ok` for every required secret.
      #
      # A-025 / Finding-10: Use wrangler versions upload + deployments create
      # for a safe gradual rollout (10% → 50% → 100% via health gates)
      # instead of an all-at-once `wrangler deploy`. This gives instant
      # rollback capability at each traffic split threshold.
      #
      # GRADUAL_ROLLOUT_ENABLED (repo variable):
      #   true  → upload a new version, promote 10% of traffic, verify health,
      #            then promote to 100%. Requires Workers Paid plan.
      #   false → fall back to direct `wrangler deploy` (safe for staging /
      #           accounts that do not yet have the Versions API enabled).
      - name: Deploy to Cloudflare (gradual rollout)
        id: cloudflare-deploy
        env:
          GRADUAL_ROLLOUT_ENABLED: ${{ vars.GRADUAL_ROLLOUT_ENABLED }}
          CRON_HOST: ${{ vars.CRON_HOST }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ "${GRADUAL_ROLLOUT_ENABLED:-false}" = "true" ]; then
            echo "── Gradual rollout: uploading new Worker version ──"
            npx --yes wrangler@${WRANGLER_VERSION} versions upload \
              2>&1 | tee /tmp/version-upload.txt || {
                echo "::error::wrangler versions upload failed"
                exit 1
              }

            VERSION_ID=$(grep -oE 'Worker Version ID: [a-f0-9-]+' /tmp/version-upload.txt | awk '{print $NF}' | head -1 || true)
            if [ -z "$VERSION_ID" ]; then
              echo "::error::Could not extract version id from versions upload output"
              cat /tmp/version-upload.txt
              exit 1
            fi
            echo "Uploaded version: $VERSION_ID"
            echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

            echo "── Promoting 10% of traffic to new version ──"
            npx --yes wrangler@${WRANGLER_VERSION} versions deploy \
              --version-id "$VERSION_ID" --version-percentage 10 \
              2>&1 | tee /tmp/deploy-10.txt || {
                echo "::error::Failed to create 10% deployment"
                exit 1
              }
            echo "10% deployment created — running health check..."

            sleep 15
            HTTP_STATUS=$(curl -s -o /tmp/canary-health.json -w "%{http_code}" \
              --max-time 20 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$CRON_HOST/api/health")
            echo "Canary health (HTTP $HTTP_STATUS):"; cat /tmp/canary-health.json || true
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "::error::Canary health check failed at 10% — rolling back to previous version"
              npx --yes wrangler@${WRANGLER_VERSION} rollback || exit 0
              exit 1
            fi

            echo "── Promoting 100% of traffic to new version ──"
            npx --yes wrangler@${WRANGLER_VERSION} versions deploy \
              --version-id "$VERSION_ID" --version-percentage 100 \
              2>&1 | tee /tmp/deploy-100.txt || {
                echo "::error::Failed to create 100% deployment"
                exit 1
              }
            echo "deployment_url=https://wristnerd.xyz" >> "$GITHUB_OUTPUT"
            echo "Gradual rollout complete — 100% on version $VERSION_ID"
          else
            echo "── Direct deploy (GRADUAL_ROLLOUT_ENABLED not set) ──"
            npx --yes wrangler@${WRANGLER_VERSION} deploy \
              2>&1 | tee /tmp/deploy-output.txt || {
                echo "::error::wrangler deploy failed"
                exit 1
              }

            # wrangler v4 removed --json; extract version id from text output
            VERSION_ID=$(grep -oE 'Current Version ID: [a-f0-9-]+' /tmp/deploy-output.txt | awk '{print $NF}' || true)
            if [ -z "$VERSION_ID" ]; then
              VERSION_ID="deployed-$(date +%s)"
            fi
            echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
            echo "deployment_url=https://wristnerd.xyz" >> "$GITHUB_OUTPUT"
            echo "Deployed version $VERSION_ID"
          fi


      # NEW-001 / least-privilege: the heavy-crons dispatcher only fires
      # jobs flagged `heavy: true` in lib/cron-registry.ts — currently
      # ai-generate (02:00), commission-ingest (05:00) and price-scrape
      # (07:00). At trigger time it reads CRON_HOST plus the per-trigger
      # secret for the job that fired, so it needs only those four secrets.
      # We intentionally do NOT push the main worker's other cron secrets
      # here: heavy-crons never reads them, and keeping them off this
      # worker minimises blast radius if it is ever compromised. If a new
      # job is later flagged `heavy: true`, add its per-trigger secret
      # below in the same change that sets the flag.
      - name: Set heavy-crons Worker secrets
        env:
          _CRON_HOST: ${{ vars.CRON_HOST }}
          _CRON_AI: ${{ secrets.CRON_AI_SECRET }}
          _CRON_COMMISSION: ${{ secrets.CRON_COMMISSION_SECRET }}
          _CRON_PRICE: ${{ secrets.CRON_PRICE_SECRET }}
          _SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          set -euo pipefail

          # CRON_HOST tells the dispatcher where to POST; the three
          # per-trigger secrets authenticate the heavy jobs it dispatches.
          echo "$_CRON_HOST"       | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_HOST              --config wrangler.heavy-crons.jsonc --name affilite-mix-heavy-crons > /dev/null 2>&1
          echo "$_CRON_AI"         | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_AI_SECRET         --config wrangler.heavy-crons.jsonc --name affilite-mix-heavy-crons > /dev/null 2>&1
          echo "$_CRON_COMMISSION" | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_COMMISSION_SECRET --config wrangler.heavy-crons.jsonc --name affilite-mix-heavy-crons > /dev/null 2>&1
          echo "$_CRON_PRICE"      | npx --yes wrangler@${WRANGLER_VERSION} secret put CRON_PRICE_SECRET      --config wrangler.heavy-crons.jsonc --name affilite-mix-heavy-crons > /dev/null 2>&1

          # H2: SENTRY_DSN lets the heavy-crons worker's withSentry wrapper emit
          # captureException events for dispatch/misconfig failures. Optional —
          # skip cleanly when not configured.
          [ -n "$_SENTRY_DSN" ] && echo "$_SENTRY_DSN" | npx --yes wrangler@${WRANGLER_VERSION} secret put SENTRY_DSN --config wrangler.heavy-crons.jsonc --name affilite-mix-heavy-crons > /dev/null 2>&1 || true

          echo "heavy-crons worker secrets configured"

      # A-018: Deploy the dedicated heavy-crons worker so long-running cron
      # jobs (ai-generate, commission-ingest, price-scrape) do not share
      # CPU/memory budget with user-facing request handling.
      - name: Deploy heavy-crons worker
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.heavy-crons.jsonc

  # ═══════════════════════════════════════════════════════════════════
  # STAGE 4: Health check + verify deployment
  # ═══════════════════════════════════════════════════════════════════
  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Post-deploy health gate
        env:
          # Interim, documented escape hatch for the Cloudflare-challenge case
          # only. Defaults to unset (fail closed). See docs/rollback-strategy.md.
          ALLOW_HEALTH_CHALLENGE_BYPASS: ${{ vars.ALLOW_HEALTH_CHALLENGE_BYPASS }}
        run: |
          set -euo pipefail
          CRON_HOST="${{ vars.CRON_HOST }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          if [ -z "$CRON_HOST" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_HOST or CRON_SECRET not set — cannot run post-deploy health gate"
            echo "Both are required secrets. Add them in GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo "Waiting 20 s for deploy to propagate..."
          sleep 20

          # Retry up to 3 times — Cloudflare Bot Fight Mode may serve a
          # JS challenge (403) to the first request from a new IP. Subsequent
          # requests from the same runner typically pass. We also set a
          # realistic User-Agent to avoid being classified as a bot.
          for attempt in 1 2 3; do
            HTTP_STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" \
              --max-time 30 \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "User-Agent: GitHub-Actions-HealthCheck/1.0" \
              "$CRON_HOST/api/health")

            echo "Attempt $attempt: Health response (HTTP $HTTP_STATUS)"

            # 403 with Cloudflare challenge page — retry after backoff
            if [ "$HTTP_STATUS" = "403" ] && grep -q "challenges.cloudflare.com" /tmp/health.json 2>/dev/null; then
              echo "Cloudflare challenge detected — retrying after backoff..."
              sleep $((attempt * 10))
              continue
            fi
            break
          done

          echo "Final health response (HTTP $HTTP_STATUS):"
          cat /tmp/health.json || true

          # P1-4: a persistent Cloudflare challenge means the post-deploy health
          # gate never actually reached the application — it verified nothing.
          # Fail closed by default so an unreachable health endpoint cannot be
          # reported as a healthy deploy. The correct fix is a WAF skip rule for
          # /api/health or a CF Service Auth token so the probe reaches the app.
          # A deliberate, documented bypass is available for the interim via
          # ALLOW_HEALTH_CHALLENGE_BYPASS=true (see docs/rollback-strategy.md);
          # it is intentionally NOT the default and is logged when used.
          if [ "$HTTP_STATUS" = "403" ] && grep -q "challenges.cloudflare.com" /tmp/health.json 2>/dev/null; then
            if [ "${ALLOW_HEALTH_CHALLENGE_BYPASS:-}" = "true" ]; then
              echo "::warning::Health check blocked by Cloudflare Bot Fight Mode (HTTP 403). ALLOW_HEALTH_CHALLENGE_BYPASS=true — treating as non-fatal. The health endpoint was NOT verified; add a WAF skip rule or CF Service Auth token."
              exit 0
            fi
            echo "::error::Health check blocked by Cloudflare challenge (HTTP 403) — the probe never reached the application, so health is UNVERIFIED."
            echo "::error::Add a WAF skip rule for /api/health or use a CF Service Auth token so the gate can reach the app."
            echo "::error::To deploy anyway (interim only), set ALLOW_HEALTH_CHALLENGE_BYPASS=true. See docs/rollback-strategy.md."
            exit 1
          fi

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Health check returned HTTP $HTTP_STATUS — deployment may be broken"
            exit 1
          fi

          # Fail if any check is in error state
          DEGRADED=$(cat /tmp/health.json | grep -o '"status":"degraded"' | head -1 || true)
          if [ -n "$DEGRADED" ]; then
            echo "::error::Worker reports degraded health — check KV binding, env vars, and DB connectivity"
            exit 1
          fi

          echo "Deployment healthy"

      # F-19 / compareai.site follow-up: one hostname with stale or conflicting
      # DNS must not fail the entire deploy after the Worker itself is healthy.
      # Probe every statically configured site host and surface failures as a
      # warning-only summary so operators can fix the affected domain without
      # blocking the rest of the fleet.
      - name: Per-site hostname reachability audit (warning-only)
        run: |
          set -euo pipefail

          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const { execFileSync } = require("node:child_process");

          const sitesDir = path.join(process.cwd(), "config", "sites");
          const files = fs.readdirSync(sitesDir).filter((name) => name.endsWith(".ts") && name !== "index.ts");
          const domains = [];

          for (const file of files) {
            const source = fs.readFileSync(path.join(sitesDir, file), "utf8");
            const match = source.match(/\bdomain:\s*"([^"]+)"/);
            if (match) domains.push(match[1]);
          }

          const uniqueDomains = [...new Set(domains)].sort();
          if (uniqueDomains.length === 0) {
            console.log("::warning::No site domains discovered from config/sites; skipping hostname audit.");
            process.exit(0);
          }

          const failures = [];
          for (const domain of uniqueDomains) {
            try {
              const httpCode = execFileSync(
                "curl",
                [
                  "-sS",
                  "-L",
                  "-o",
                  "/dev/null",
                  "-w",
                  "%{http_code}",
                  "--max-time",
                  "20",
                  `https://${domain}/`,
                ],
                { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] },
              ).trim();

              console.log(`${domain} -> HTTP ${httpCode}`);
              if (!/^2\d\d$|^3\d\d$/.test(httpCode)) {
                failures.push({ domain, detail: `HTTP ${httpCode}` });
              }
            } catch (error) {
              const detail = error && typeof error.message === "string" ? error.message.split("\n")[0] : "curl failed";
              console.log(`${domain} -> ${detail}`);
              failures.push({ domain, detail });
            }
          }

          if (failures.length === 0) {
            console.log("All configured site hostnames responded successfully.");
            process.exit(0);
          }

          console.log(`::warning::${failures.length} configured site host(s) failed reachability audit; deployment remains green for healthy domains.`);
          const lines = [
            "### Warning: per-site hostname audit failures",
            "",
            "The Worker deployed successfully, but one or more configured site domains did not respond cleanly:",
            ...failures.map(({ domain, detail }) => `- ${domain}: ${detail}`),
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          EOF

      # A-021: Post-deploy RLS policy drift check.
      # Compares the current pg_policies against a known baseline and
      # alerts if any critical tenant-isolation policies are missing.
      - name: Verify RLS policy baseline
        run: |
          set -euo pipefail
          # Prefer pooler URL (IPv4-reachable); fall back to direct URL.
          DB_URL="${{ secrets.SUPABASE_DB_POOLER_URL }}"
          if [ -z "$DB_URL" ]; then
            DB_URL="${{ secrets.SUPABASE_DB_URL }}"
          fi
          if [ -z "$DB_URL" ]; then
            echo "::warning::SUPABASE_DB_POOLER_URL and SUPABASE_DB_URL not set — skipping RLS policy baseline check"
            exit 0
          fi
          # Strip ?pgbouncer=true — psql does not understand this query param.
          # Same pattern as the four other psql call-sites in this workflow.
          DB_URL="${DB_URL%%\?*}"

          MISSING=$(psql "$DB_URL" -t -A -c "
            SELECT policyname
            FROM pg_policies
            WHERE schemaname = 'public'
              AND tablename IN (
                'sites','products','content','pages','ad_placements',
                'categories','modules','quizzes','scheduled_jobs',
                'affiliate_clicks','commissions','click_failures',
                'affiliate_tracking_keys'
              )
              AND policyname LIKE 'tenant_isolation_auth_%'
            ORDER BY policyname;
          " | wc -l)

          if [ "$MISSING" -lt 9 ]; then
            echo "::error::Only $MISSING tenant_isolation_auth_* policies found in pg_policies. Expected >= 9. Check migration drift."
            exit 1
          fi

          echo "RLS baseline check passed ($MISSING tenant isolation policies)"

      - name: Verify deployment
        run: |
          echo "Deployment complete!"
          echo "Testing site reachability..."
          sleep 5
          CRON_HOST="${{ vars.CRON_HOST }}"
          if [ -n "$CRON_HOST" ]; then
            curl -s -o /dev/null -w "HTTP %{http_code}" --max-time 10 "$CRON_HOST/" || echo "Site may need DNS propagation"
          else
            echo "::warning::CRON_HOST not set — skipping site reachability check"
          fi

      # G-11: runtime drift gates. Migration drift is already enforced
      # above (the Verify production schema step). These three checks
      # compare the live Worker's bindings, secrets, and cron schedules
      # against what `wrangler.jsonc` declares, so a hand-rolled
      # `wrangler` invocation that bypasses CI cannot silently leave
      # production in a different state from the checked-in config.
      #
      # P1-3 / F-005: this binding gate is BLOCKING because security-critical
      # routes (login/admin/checkout) rely on RATE_LIMITER_DO or RATE_LIMIT_KV.
      # A green deploy with missing live bindings silently downgrades rate
      # limiting to per-isolate memory or immediate fail-closed behaviour.
      - name: Runtime drift — Worker bindings
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required for the live Worker binding drift gate"
            exit 1
          fi
          WRANGLER_JSON=$(sed -E 's@^[[:space:]]*//.*$@@; s@[[:space:]]+//[^"]*$@@' wrangler.jsonc \
            | python3 -c 'import re,sys; sys.stdout.write(re.sub(r",(\s*[}\]])", r"\1", sys.stdin.read()))')
          # NOTE: use postfix `[].binding` (tight precedence) rather than
          # `[] | .binding`. Inside a `[ a, b, ... ]` constructor jq binds
          # `|` looser than `,`, so `[] | .binding` leaks the pipe across the
          # commas and applies `.binding` to the previous array's name
          # strings ("Cannot index string with \"binding\""). Postfix form
          # keeps each extraction self-contained.
          DECL=$(echo "$WRANGLER_JSON" | jq -r '
            [
              (.kv_namespaces // [])[].binding,
              (.r2_buckets // [])[].binding,
              (.queues.producers // [])[].binding,
              (.durable_objects.bindings // [])[].name
            ] | map(select(. != null and . != "")) | sort | unique | .[]
          ')
          # Read the live bindings with retry + success validation. A single
          # flaky API response (or an in-flight gradual rollout) must NOT make
          # every binding look "missing" and hard-fail an otherwise-good deploy.
          LIVE=""
          GOOD_READ=""
          for attempt in 1 2 3 4; do
            RESP=$(curl -sS --max-time 30 -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/affilite-mix/bindings" || true)
            # The API must report success AND return a non-empty result before
            # we trust the comparison. Anything else is treated as a flaky read.
            if [ -n "$RESP" ] && [ "$(echo "$RESP" | jq -r '.success // false')" = "true" ]; then
              # Filter to object-typed elements BEFORE indexing. The previous
              # expression `.name? // .binding?` crashed with
              # "Cannot index string with string" (jq exit 5) whenever the
              # bindings array contained a non-object element, hard-failing an
              # otherwise-healthy deploy. `objects` makes the extraction total; the
              # trailing select also drops null/non-string name|binding
              # values, folding in main's type-guard hardening.
              LIVE=$(echo "$RESP" | jq -r '(.result // [])[] | objects | (.name // .binding) | select(type == "string" and length > 0)' | sort -u)
              if [ -n "$LIVE" ]; then GOOD_READ=1; break; fi
            fi
            echo "Bindings read attempt $attempt did not return a trusted result — retrying after backoff..."
            sleep $((attempt * 5))
          done

          if [ -z "$GOOD_READ" ]; then
            # The deploy itself already succeeded; we just couldn't get a
            # trustworthy live-bindings read. Warn instead of blocking.
            echo "::warning::Could not obtain a trusted live-bindings read from the Cloudflare API after 4 attempts. Skipping the binding drift gate (deploy already succeeded). Verify manually with: wrangler deployments list"
            exit 0
          fi

          MISSING=$(comm -23 <(echo "$DECL") <(echo "$LIVE"))
          if [ -n "$MISSING" ]; then
            echo "::error::Bindings declared in wrangler.jsonc but missing from live Worker:"
            echo "$MISSING" | sed 's/^/  - /'
            exit 1
          fi
          echo "All declared Worker bindings present on the live Worker."

      # P1-4: a missing production secret silently breaks auth, DB access, or
      # cron dispatch — it must BLOCK the deploy, not warn-and-continue. This
      # gate is therefore blocking (no continue-on-error) and treats an
      # unavailable Cloudflare API read as a hard failure, matching the
      # blocking Worker-bindings gate above.
      - name: Runtime drift — Worker secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required for the live Worker secret drift gate"
            exit 1
          fi
          # Canonical list of production secrets. Keep in sync with
          # wrangler.jsonc / scripts/validate-cloudflare-bindings.sh.
          # NOTE: APP_URL is intentionally NOT listed here. It is a plaintext
          # `var` in wrangler.jsonc (deployed with the Worker and asserted by
          # __tests__/wrangler-binding-drift.test.ts), not a Worker secret, so
          # it never appears in `wrangler secret list` — including it here made
          # this gate fail on every production deploy.
          REQUIRED_SECRETS=(
            SUPABASE_SERVICE_ROLE_KEY
            SUPABASE_JWT_SECRET
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            JWT_SECRET
            CRON_SECRET
            INTERNAL_API_TOKEN
          )
          # Retry + success validation so a single flaky API response does not
          # either hard-fail a good deploy or (worse) return an empty list that
          # looks like "all secrets missing". Only a trusted read is compared.
          LIVE_SECRETS=""
          GOOD_READ=""
          for attempt in 1 2 3 4; do
            RESP=$(curl -sS --max-time 30 -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/affilite-mix/secrets" || true)
            if [ -n "$RESP" ] && [ "$(echo "$RESP" | jq -r '.success // false')" = "true" ]; then
              LIVE_SECRETS=$(echo "$RESP" | jq -r '(.result // [])[].name' | sort -u)
              GOOD_READ=1
              break
            fi
            echo "Secret read attempt $attempt did not return a trusted result — retrying after backoff..."
            sleep $((attempt * 5))
          done
          if [ -z "$GOOD_READ" ]; then
            echo "::error::Could not obtain a trusted live-secrets read from the Cloudflare API after 4 attempts — cannot verify the secret drift gate. Retry the deploy or verify manually with: wrangler secret list"
            exit 1
          fi
          MISSING=""
          for s in "${REQUIRED_SECRETS[@]}"; do
            if ! echo "$LIVE_SECRETS" | grep -qx "$s"; then
              MISSING="${MISSING}${s} "
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Required Worker secrets missing on the live Worker: $MISSING"
            echo "Set them with: wrangler secret put <NAME>"
            exit 1
          fi
          echo "All canonical Worker secrets present on the live Worker."

      # P1-4: a cron schedule declared in wrangler.jsonc but missing on the live
      # Worker means that scheduled job never runs — a silent liveness gap that
      # must BLOCK the deploy rather than warn-and-continue.
      - name: Runtime drift — Cron schedules
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required for the live cron schedule drift gate"
            exit 1
          fi
          WRANGLER_JSON=$(sed -E 's@^[[:space:]]*//.*$@@; s@[[:space:]]+//[^"]*$@@' wrangler.jsonc \
            | python3 -c 'import re,sys; sys.stdout.write(re.sub(r",(\s*[}\]])", r"\1", sys.stdin.read()))')
          DECL=$(echo "$WRANGLER_JSON" | jq -r '(.triggers.crons // [])[]' | sort -u)
          # NOTE: the schedules endpoint returns the list under
          # `.result.schedules`, not `.schedules`. Reading the wrong path made
          # this gate see zero live crons and (warning-only) report every
          # declared cron as missing. Fall back to the legacy path for safety.
          # Retry + success validation so a flaky read is not mistaken for
          # "every cron missing" now that this gate is blocking.
          LIVE=""
          GOOD_READ=""
          for attempt in 1 2 3 4; do
            RESP=$(curl -sS --max-time 30 -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/affilite-mix/schedules" || true)
            if [ -n "$RESP" ] && [ "$(echo "$RESP" | jq -r '.success // false')" = "true" ]; then
              LIVE=$(echo "$RESP" | jq -r '((.result.schedules // .schedules) // [])[].cron' | sort -u)
              GOOD_READ=1
              break
            fi
            echo "Cron schedule read attempt $attempt did not return a trusted result — retrying after backoff..."
            sleep $((attempt * 5))
          done
          if [ -z "$GOOD_READ" ]; then
            echo "::error::Could not obtain a trusted live cron-schedule read from the Cloudflare API after 4 attempts — cannot verify the cron drift gate. Retry the deploy or verify manually with: wrangler deployments list"
            exit 1
          fi
          MISSING=$(comm -23 <(echo "$DECL") <(echo "$LIVE"))
          EXTRA=$(comm -13 <(echo "$DECL") <(echo "$LIVE"))
          if [ -n "$MISSING" ] || [ -n "$EXTRA" ]; then
            if [ -n "$MISSING" ]; then
              echo "::error::Cron schedules declared in wrangler.jsonc but not live:"
              echo "$MISSING" | sed 's/^/  - /'
            fi
            if [ -n "$EXTRA" ]; then
              echo "::warning::Cron schedules live but not declared in wrangler.jsonc:"
              echo "$EXTRA" | sed 's/^/  - /'
            fi
            if [ -n "$MISSING" ]; then exit 1; fi
          fi
          echo "Live cron schedules match wrangler.jsonc."

      - name: Traffic promotion note
        run: |
          echo "### Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy completed. Traffic is live." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "For gradual rollouts, use the **Deploy (gradual rollout)** workflow instead." >> "$GITHUB_STEP_SUMMARY"
          echo "See: \`.github/workflows/deploy-gradual.yml\`" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════
  # RISK-06 (étap-3): Post-deploy E2E smoke tests
  #
  # Runs a subset of Playwright E2E specs against the live deployment
  # URL after health checks pass. Failures are warnings (continue-on-error)
  # to avoid blocking deploys on flaky E2E tests during rollout.
  # ═══════════════════════════════════════════════════════════════════
  e2e-smoke:
    needs: [deploy, health-check]
    if: success()
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://wristnerd.xyz' }}
        run: |
          set -euo pipefail
          if [ -z "$E2E_BASE_URL" ]; then
            echo "::warning::E2E_BASE_URL not set — skipping post-deploy E2E tests"
            exit 0
          fi
          echo "Running E2E smoke tests against $E2E_BASE_URL..."
          npx playwright test e2e/public-content.spec.ts e2e/public-search.spec.ts \
            --reporter=list --timeout=30000 || {
              echo "::warning::E2E smoke tests failed — review results before merging next deploy"
              exit 0
            }

  # ═══════════════════════════════════════════════════════════════════
  # H-5: Automated migration rollback on deploy/health failure
  #
  # When the Worker deploy or post-deploy health check fails after
  # migrations were applied, this job runs the corresponding down-
  # migration files in reverse order to restore the production schema
  # to its pre-deploy state.
  #
  # P1-3: automatic DB rollback is only attempted for migrations whose
  # down file is classified `auto` by scripts/classify-migration-rollback.sh.
  # Placeholder (`-- NO DOWN`), forward-only, or data-loss down files are
  # classified `manual`; the job then HALTS with a clear error instead of
  # executing a no-op file and falsely reporting a successful rollback.
  # ═══════════════════════════════════════════════════════════════════
  rollback-migrations:
    if: failure() && needs.migrate-production.outputs.migrations_applied > 0
    needs: [migrate-production, deploy, health-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client 2>&1 | tail -5

      - name: Run down-migrations (reverse order)
        env:
          _DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          _DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          set -euo pipefail
          DB_URL="${_DB_POOLER_URL:-$_DB_URL}"
          DB_URL="${DB_URL%%\?*}"

          if [ -z "$DB_URL" ]; then
            echo "::error::No DB URL available for rollback"
            exit 1
          fi

          echo "::warning::H-5: Deploy failed after migrations. Evaluating automated rollback..."

          # Get the list of migrations applied in this run from the ledger.
          # We identify "this run's" migrations as the N most recently applied,
          # where N = migrations_applied output from the migrate step.
          ROLLBACK_COUNT=${{ needs.migrate-production.outputs.migrations_applied }}
          echo "Migrations to roll back: $ROLLBACK_COUNT"

          # Fetch the most recently applied migrations (reverse order)
          RECENT_MIGRATIONS=$(psql "$DB_URL" -t -A -c "
            SELECT filename FROM _migrations_applied
            ORDER BY applied_at DESC
            LIMIT $ROLLBACK_COUNT;
          ")

          # P1-3: an automated down-migration must NEVER produce a silent false
          # success. Two failure modes are guarded here:
          #   1. A comment-only / placeholder down file (`-- NO DOWN: ...`)
          #      executes cleanly through psql and would otherwise be reported
          #      as a successful rollback while the schema was never reverted.
          #   2. An irreversible / data-loss down file (e.g. a type-narrowing
          #      revert) must not be applied automatically at the worst possible
          #      time. Classify every target BEFORE touching the database and
          #      refuse the automated path — halting for the manual DR runbook —
          #      the moment any target is not auto-rollback-safe.
          ROLLBACK_FAILED=0
          for migration in $RECENT_MIGRATIONS; do
            # Derive the down-migration filename
            down_file="supabase/migrations-down/${migration%.sql}-down.sql"
            if [ ! -f "$down_file" ]; then
              echo "::error::Down-migration not found: $down_file"
              ROLLBACK_FAILED=1
              break
            fi

            CLASSIFICATION=$(bash scripts/classify-migration-rollback.sh "$down_file" || true)
            if ! bash scripts/classify-migration-rollback.sh "$down_file" >/dev/null 2>&1; then
              echo "::error::Refusing automatic rollback of $migration — $CLASSIFICATION"
              echo "::error::This migration is not auto-rollback-safe (irreversible, data-loss, or placeholder down file)."
              echo "::error::Automatic DB rollback is DISABLED for it to avoid a silent false success."
              echo "::error::Prefer application rollback / roll-forward; if a DB revert is truly required,"
              echo "::error::follow the manual procedure in docs/DR-RUNBOOK.md."
              ROLLBACK_FAILED=1
              break
            fi

            echo "Rolling back: $migration (using $down_file) — $CLASSIFICATION"
            if psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$down_file"; then
              # Remove from ledger
              psql "$DB_URL" -c \
                "DELETE FROM _migrations_applied WHERE filename = '$migration';"
              echo "Rolled back: $migration"
            else
              echo "::error::Rollback failed for: $migration"
              ROLLBACK_FAILED=1
              break
            fi
          done

          if [ "$ROLLBACK_FAILED" = "1" ]; then
            echo "::error::Automated rollback halted — manual intervention required."
            echo "::error::See docs/DR-RUNBOOK.md for manual rollback procedures."
            exit 1
          fi

          echo "::notice::H-5: Automated rollback complete. $ROLLBACK_COUNT migration(s) reverted."

  # ═══════════════════════════════════════════════════════════════════
  # STAGE 5: Notify on deploy failure (AUD-03 / AUD-11)
  # ═══════════════════════════════════════════════════════════════════
  notify-failure:
    if: failure()
    needs: [deploy, health-check, rollback-migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notify deploy failure
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::notice::SLACK_DEPLOY_WEBHOOK_URL not configured — skipping failure notification. Add it in repo secrets to enable deploy alerts."
            exit 0
          fi
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \":rotating_light: *Deploy failed* for \`${{ github.repository }}\`\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \":rotating_light: *Deploy to Cloudflare failed*\n*Repo:* \`${{ github.repository }}\`\n*Branch:* \`${{ github.ref_name }}\`\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>\"
                  }
                }
              ]
            }" || echo "::warning::Failed to send Slack notification"
