name: Deploy
on:
  push:
    branches:
      - main

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required Cloudflare Worker secrets
        run: |
          REQUIRED=(
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            CRON_PUBLISH_SECRET
            CRON_AI_SECRET
            CRON_SITEMAP_SECRET
            ADMIN_JWT_SECRET
            SENTRY_DSN
          )

          for key in "${REQUIRED[@]}"; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              exit 1
            fi
          done
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_PUBLISH_SECRET: ${{ secrets.CRON_PUBLISH_SECRET }}
          CRON_AI_SECRET: ${{ secrets.CRON_AI_SECRET }}
          CRON_SITEMAP_SECRET: ${{ secrets.CRON_SITEMAP_SECRET }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  deploy:
    needs: validate-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require staging DB smoke test
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "${{ secrets.STAGING_SUPABASE_DB_URL }}" ]; then
            echo "STAGING_SUPABASE_DB_URL is required for production deploy"
            exit 1
          fi

      - name: Stage 1 - Validate migrations on staging
        run: echo "Validating on staging..."

      - name: Stage 2 - Snapshot production DB
        run: echo "Snapshotting production DB..."

      - name: Stage 3 - Apply production migrations
        run: echo "Applying migrations..."

      - name: Stage 4 - Verify schema
        run: echo "Verifying schema..."

      - name: Stage 5 - Deploy app
        run: echo "Deploying app..."

      - name: Stage 6 - Health check
        run: echo "Health checking..."

      - name: Stage 7 - Promote traffic
        run: echo "Promoting traffic..."

      # Note: Admin bootstrap steps have been explicitly removed.
      # Use a separate break-glass workflow for admin creation.
