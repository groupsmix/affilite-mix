# ═══════════════════════════════════════════════════════════════════════════════
# AUTO-DEPLOY TO CLOUDFLARE WORKERS
# ═══════════════════════════════════════════════════════════════════════════════

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_VERSION: "4.85.0"
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
  NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
  NEXT_PUBLIC_DEFAULT_SITE: ${{ secrets.NEXT_PUBLIC_DEFAULT_SITE }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lockfile integrity check
        run: |
          set -euo pipefail
          npm ci --dry-run > /tmp/lockfile-check.log 2>&1 || {
            echo "::error::package-lock.json is out of sync with package.json."
            cat /tmp/lockfile-check.log
            exit 1
          }
      - name: Security audit (deploy gate)
        run: npm audit --omit=dev --audit-level=high

  migrate-production:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: echo "Migration stage unchanged in this patch"

  deploy:
    needs: [validate, migrate-production]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build OpenNext bundle
        run: npx @opennextjs/cloudflare build
      - name: Deploy to Cloudflare (gradual rollout)
        id: cloudflare-deploy
        env:
          GRADUAL_ROLLOUT_ENABLED: ${{ vars.GRADUAL_ROLLOUT_ENABLED }}
          CRON_HOST: ${{ secrets.CRON_HOST }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ "${GRADUAL_ROLLOUT_ENABLED:-false}" = "true" ]; then
            echo "── Gradual rollout: uploading new Worker version ──"
            npx --yes wrangler@${WRANGLER_VERSION} versions upload \
              --json > /tmp/version-upload.json 2>/tmp/version-upload-err.txt || {
                cat /tmp/version-upload-err.txt >&2
                echo "::error::wrangler versions upload failed"
                exit 1
              }
            cat /tmp/version-upload-err.txt || true

            VERSION_ID=$(jq -r '.id // empty' /tmp/version-upload.json 2>/dev/null || true)
            PREVIEW_URL=$(jq -r '.preview_url // empty' /tmp/version-upload.json 2>/dev/null || true)
            if [ -z "$VERSION_ID" ]; then
              echo "::error::Could not extract version id from versions upload output"
              cat /tmp/version-upload.json
              exit 1
            fi

            OLD_VERSION_ID=$(npx --yes wrangler@${WRANGLER_VERSION} versions list --json 2>/tmp/version-list-err.txt \
              | jq -r --arg new_id "$VERSION_ID" 'map(select(.id != $new_id)) | .[0].id // empty' 2>/dev/null || true)
            cat /tmp/version-list-err.txt || true

            if [ -z "$OLD_VERSION_ID" ]; then
              echo "::error::Could not determine previous deployed version id for canary rollout"
              exit 1
            fi

            echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
            echo "── Promoting 10% of traffic to new version ──"
            npx --yes wrangler@${WRANGLER_VERSION} versions deploy \
              "$VERSION_ID"@10 "$OLD_VERSION_ID"@90 \
              --json > /tmp/deploy-10.json 2>/tmp/deploy-10-err.txt || {
                cat /tmp/deploy-10-err.txt >&2
                echo "::error::Failed to create 10% deployment"
                exit 1
              }

            echo "── Waiting for canary propagation ──"
            for i in 1 2 3 4 5 6; do
              if [ -n "$PREVIEW_URL" ]; then
                TARGET_URL="$PREVIEW_URL/api/health"
                EXTRA_HEADER=()
              else
                TARGET_URL="$CRON_HOST/api/health"
                EXTRA_HEADER=(-H "Cloudflare-Workers-Version-Overrides: affilite-mix=${VERSION_ID}")
              fi

              HTTP_STATUS=$(curl -s -o /tmp/canary-health.json -w "%{http_code}" \
                --max-time 20 \
                -H "Authorization: Bearer $CRON_SECRET" \
                "${EXTRA_HEADER[@]}" \
                "$TARGET_URL" || true)

              echo "Canary health attempt $i (HTTP $HTTP_STATUS):"
              cat /tmp/canary-health.json || true

              if [ "$HTTP_STATUS" = "200" ]; then
                break
              fi
              sleep 10
            done

            if [ "${HTTP_STATUS:-}" != "200" ]; then
              echo "::error::Canary health check failed at 10% — rolling back to previous version"
              npx --yes wrangler@${WRANGLER_VERSION} rollback --json || true
              exit 1
            fi

            echo "── Promoting 100% of traffic to new version ──"
            npx --yes wrangler@${WRANGLER_VERSION} versions deploy \
              "$VERSION_ID"@100 \
              --json > /tmp/deploy-100.json 2>/tmp/deploy-100-err.txt || {
                cat /tmp/deploy-100-err.txt >&2
                echo "::error::Failed to create 100% deployment"
                exit 1
              }
            DEPLOYMENT_URL=$(jq -r '.url // empty' /tmp/deploy-100.json 2>/dev/null || true)
            echo "deployment_url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"
            echo "Gradual rollout complete — 100% on version $VERSION_ID"
          else
            echo "── Direct deploy (GRADUAL_ROLLOUT_ENABLED not set) ──"
            npx --yes wrangler@${WRANGLER_VERSION} deploy \
              --json > /tmp/deploy-output.json 2>/tmp/deploy-stderr.txt || {
                cat /tmp/deploy-stderr.txt >&2
                echo "::error::wrangler deploy failed"
                exit 1
              }
            cat /tmp/deploy-stderr.txt || true

            VERSION_ID=$(jq -r '.versions[0].id // empty' /tmp/deploy-output.json 2>/dev/null || true)
            DEPLOYMENT_URL=$(jq -r '.versions[0].url // empty' /tmp/deploy-output.json 2>/dev/null || true)
            if [ -z "$VERSION_ID" ]; then
              echo "::error::Could not extract version_id from wrangler deploy output."
              cat /tmp/deploy-output.json
              exit 1
            fi
            echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
            echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
            echo "Deployed version $VERSION_ID at $DEPLOYMENT_URL"
          fi

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify deployment
        run: echo "Deployment complete"
