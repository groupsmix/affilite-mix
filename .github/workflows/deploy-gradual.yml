name: Gradual Deploy

on:
  workflow_dispatch:
    inputs:
      smoke_host:
        description: "Host to run smoke tests against"
        required: true
        type: string
      percentage:
        description: "Traffic percentage for canary"
        required: false
        default: "10"
        type: string

jobs:
  deploy-gradual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy canary
        env:
          PERCENTAGE: ${{ inputs.percentage }}
        run: |
          echo "Deploying canary at ${PERCENTAGE}%"
      - name: Post-deploy smoke tests
        env:
          SMOKE_HOST: ${{ inputs.smoke_host }}
        run: |
          curl -sf "https://${SMOKE_HOST}/" > /dev/null
          curl -sf "https://${SMOKE_HOST}/api/health" > /dev/null
          curl -sf "https://${SMOKE_HOST}/sitemap.xml" > /dev/null
          curl -sf "https://${SMOKE_HOST}/robots.txt" > /dev/null
          curl -sf "https://${SMOKE_HOST}/admin/login" > /dev/null
          echo "All smoke tests passed"
