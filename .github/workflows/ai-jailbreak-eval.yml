name: AI Jailbreak Eval (A115)

on:
  pull_request:
    paths:
      - "lib/ai/**"
      - "__tests__/ai/**"
      - ".github/workflows/ai-jailbreak-eval.yml"
  push:
    branches: [main]
    paths:
      - "lib/ai/**"
      - "__tests__/ai/**"
  schedule:
    # Weekly regression so model / dep changes upstream don't silently
    # raise the jailbreak success rate.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  jailbreak-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Run A115 jailbreak eval harness
        run: npx vitest run __tests__/ai/jailbreak-eval.test.ts --reporter=verbose
