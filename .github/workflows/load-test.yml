name: Nightly k6 Load Test

on:
  schedule:
    - cron: "0 3 * * *" # 3 AM nightly
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to test against (overrides LOAD_TEST_URL secret)"
        required: false
        default: ""

# Load tester only hits an external URL — no GitHub writes needed.
permissions:
  contents: read

jobs:
  k6-load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve target URL
        id: target
        env:
          INPUT_URL: ${{ github.event.inputs.target_url }}
          SECRET_URL: ${{ secrets.LOAD_TEST_URL }}
          CRON_HOST: ${{ secrets.CRON_HOST }}
        run: |
          # Priority: manual input > LOAD_TEST_URL secret > CRON_HOST secret
          URL="${INPUT_URL:-${SECRET_URL:-${CRON_HOST:-}}}"
          if [ -z "$URL" ]; then
            echo "::warning::No target URL available. Set LOAD_TEST_URL or CRON_HOST secret, or provide a URL via workflow_dispatch."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Load test target: $URL"

      - name: Setup k6
        if: steps.target.outputs.skip != 'true'
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run load test
        if: steps.target.outputs.skip != 'true'
        run: k6 run load-test.js
        env:
          BASE_URL: ${{ steps.target.outputs.url }}

      - name: Upload Results
        if: always() && steps.target.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-report
          path: |
            *.html
            *.json
