name: Load Test

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL for load testing"
        required: true
        type: string
      duration:
        description: "Test duration (e.g. 30s, 1m)"
        required: false
        default: "30s"
        type: string
  # E2-020: Allow the deploy workflow to call load tests as a post-deploy gate.
  workflow_call:
    inputs:
      target_url:
        description: "Target URL for load testing"
        required: true
        type: string
      duration:
        description: "Test duration (e.g. 30s, 1m)"
        required: false
        default: "15s"
        type: string
  # RISK-14 (étap-3): Nightly load test to catch performance regressions
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run load test
        # AUDIT-2026-06: workflow previously referenced
        # `scripts/load-test.sh` which has never been committed.
        # The actual script is `scripts/load-test.mjs` and consumes
        # SITE_URL / --duration. Without this fix every scheduled run
        # (RISK-14) silently failed with "no such file or directory".
        run: node scripts/load-test.mjs --duration="$DURATION_SEC"
        env:
          # RISK-14: For scheduled runs, fall back to production URL
          SITE_URL: ${{ inputs.target_url || 'https://wristnerd.xyz' }}
          # Strip the trailing unit so we can pass an integer second
          # count to the node script. Default 15.
          DURATION_SEC: ${{ inputs.duration && (inputs.duration == '30s' && '30' || (inputs.duration == '1m' && '60' || '15')) || '15' }}
