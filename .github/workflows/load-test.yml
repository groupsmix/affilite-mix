name: Load Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL for load testing"
        required: true
        type: string
      duration:
        description: "Test duration (e.g. 30s, 1m)"
        required: false
        default: "30s"
        type: string
  # E2-020: Allow the deploy workflow to call load tests as a post-deploy gate.
  workflow_call:
    inputs:
      target_url:
        description: "Target URL for load testing"
        required: true
        type: string
      duration:
        description: "Test duration (e.g. 30s, 1m)"
        required: false
        default: "15s"
        type: string
  # RISK-14 (étap-3): Nightly load test to catch performance regressions
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run load test
        run: bash scripts/load-test.sh
        env:
          # RISK-14: For scheduled runs, fall back to production URL
          TARGET_URL: ${{ inputs.target_url || 'https://wristnerd.xyz' }}
          DURATION: ${{ inputs.duration || '15s' }}
