# ═══════════════════════════════════════════════════════════════════════════════
# SBOM Generation & Artifact Signing
#
# Generates a Software Bill of Materials (SPDX + CycloneDX) on every release
# and PR merge. Artifacts are signed with cosign (keyless / GitHub OIDC) and
# uploaded as workflow artifacts + release assets.
#
# Addresses audit finding: "No SBOM pipeline evidenced."
# ═══════════════════════════════════════════════════════════════════════════════
name: SBOM & Artifact Signing

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write
  id-token: write # Required for cosign keyless signing via GitHub OIDC
  attestations: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - run: npm install

      # ── Generate CycloneDX SBOM ──────────────────────────────────────
      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json --output-format json
        continue-on-error: false

      # ── Generate SPDX SBOM ──────────────────────────────────────────
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-spdx

      # ── Install cosign ──────────────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      # ── Sign SBOMs (keyless — uses GitHub OIDC identity) ────────────
      - name: Sign CycloneDX SBOM
        run: cosign sign-blob --yes --bundle sbom.cdx.json.bundle sbom.cdx.json
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Sign SPDX SBOM
        run: cosign sign-blob --yes --bundle sbom.spdx.json.bundle sbom.spdx.json
        env:
          COSIGN_EXPERIMENTAL: "1"

      # ── Upload artifacts ────────────────────────────────────────────
      # Retention bumped to GitHub's 400-day maximum so post-release
      # vulnerability triage can pull the original SBOM without going
      # to the long-term R2 archive (G-41).
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-artifacts
          retention-days: 400
          path: |
            sbom.cdx.json
            sbom.cdx.json.bundle
            sbom.spdx.json
            sbom.spdx.json.bundle

      # ── Long-term R2 archive (≥3-year retention, G-41) ─────────────
      # Mirrors every SBOM bundle to a Cloudflare R2 bucket keyed by
      # commit SHA so artifacts outlive GitHub Actions retention. The
      # step is skipped when R2 secrets are not configured so forks /
      # PRs from external contributors do not fail. See
      # docs/sbom-retention.md for the retention SLA and restore steps.
      - name: Archive SBOMs to R2 (long-term retention)
        if: ${{ env.SBOM_R2_ACCESS_KEY_ID != '' && env.SBOM_R2_SECRET_ACCESS_KEY != '' && env.SBOM_R2_ACCOUNT_ID != '' && env.SBOM_R2_BUCKET != '' }}
        env:
          SBOM_R2_ACCOUNT_ID: ${{ secrets.SBOM_R2_ACCOUNT_ID }}
          SBOM_R2_BUCKET: ${{ secrets.SBOM_R2_BUCKET }}
          SBOM_R2_ACCESS_KEY_ID: ${{ secrets.SBOM_R2_ACCESS_KEY_ID }}
          SBOM_R2_SECRET_ACCESS_KEY: ${{ secrets.SBOM_R2_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SBOM_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SBOM_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          endpoint="https://${SBOM_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="sbom/${GITHUB_SHA}"
          # Inline metadata so the archive is self-describing without
          # needing the workflow run to still exist.
          cat > sbom.manifest.json <<EOF
          {
            "commit_sha": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "files": [
              "sbom.cdx.json",
              "sbom.cdx.json.bundle",
              "sbom.spdx.json",
              "sbom.spdx.json.bundle"
            ]
          }
          EOF
          for f in sbom.cdx.json sbom.cdx.json.bundle sbom.spdx.json sbom.spdx.json.bundle sbom.manifest.json; do
            aws s3 cp "$f" "s3://${SBOM_R2_BUCKET}/${prefix}/$f" \
              --endpoint-url "$endpoint" \
              --no-progress
          done
          echo "::notice title=SBOM archived::Long-term copy at s3://${SBOM_R2_BUCKET}/${prefix}/ (R2)"

      - name: Warn when R2 archive secrets are missing
        if: ${{ env.SBOM_R2_ACCESS_KEY_ID == '' || env.SBOM_R2_SECRET_ACCESS_KEY == '' || env.SBOM_R2_ACCOUNT_ID == '' || env.SBOM_R2_BUCKET == '' }}
        env:
          SBOM_R2_ACCOUNT_ID: ${{ secrets.SBOM_R2_ACCOUNT_ID }}
          SBOM_R2_BUCKET: ${{ secrets.SBOM_R2_BUCKET }}
          SBOM_R2_ACCESS_KEY_ID: ${{ secrets.SBOM_R2_ACCESS_KEY_ID }}
          SBOM_R2_SECRET_ACCESS_KEY: ${{ secrets.SBOM_R2_SECRET_ACCESS_KEY }}
        run: |
          echo "::warning title=SBOM long-term retention disabled::SBOM_R2_* secrets not configured; this run is only retained for 400 days via actions/upload-artifact. Configure long-term R2 storage per docs/sbom-retention.md to satisfy G-41."

      # ── Attach to GitHub Release (if triggered by release) ─────────
      - name: Upload SBOMs to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: |
            sbom.cdx.json
            sbom.cdx.json.bundle
            sbom.spdx.json
            sbom.spdx.json.bundle

      # ── GitHub Artifact Attestation (supply-chain provenance) ──────
      - name: Attest CycloneDX SBOM
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: sbom.cdx.json

      - name: Attest SPDX SBOM
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: sbom.spdx.json
