name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      site_slug:
        description: "Site slug to test (watch-tools, crypto-tools, arabic-tools, ai-compared)"
        required: false
        default: "watch-tools"
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_SLUG: ${{ github.event.inputs.site_slug || 'watch-tools' }}

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup Supabase CLI
        # `npm install -g supabase` is explicitly unsupported by Supabase CLI;
        # use the official setup action instead.
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (local)
        # `supabase start` boots the local stack AND applies every migration
        # in `supabase/migrations/*.sql` followed by `supabase/seed.sql`, so
        # explicit "apply migrations" / "seed" steps would be redundant
        # (and would fail: `supabase db execute --file` and `db seed --file`
        # aren't valid commands in the current CLI).
        #
        # Use `supabase status -o env` (stable, machine-readable) instead of
        # scraping the pretty output — the pretty table now uses box-drawing
        # characters and labels keys as "Publishable"/"Secret", so the old
        # `grep 'anon key' | awk '{print $4}'` produced empty strings on
        # recent CLI versions. Sourcing the dotenv output strips godotenv's
        # quoting before we hand plain values to $GITHUB_ENV.
        run: |
          set -euo pipefail
          supabase start
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            > supabase_status.env
          set -a
          # shellcheck disable=SC1091
          . ./supabase_status.env
          set +a
          rm -f supabase_status.env
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" && test -n "$SUPABASE_SERVICE_ROLE_KEY"

      # Types are maintained by hand in `types/database.ts` (row-level helpers)
      # and `types/supabase.ts` (Supabase-generated schema). The previous
      # `supabase gen types ... > types/database.ts` step clobbered the
      # handwritten file with auto-generated content and broke the build, so
      # regenerate them locally via a dedicated script instead of in CI.

      - name: Setup environment
        run: |
          cat > .env << EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET=ci-test-secret-jwt-at-least-32-chars-long
          NEXT_PUBLIC_DEFAULT_SITE=${{ env.SITE_SLUG }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=""
          TURNSTILE_SECRET_KEY=""
          CRON_SECRET=ci-cron-secret
          EOF

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install wait-on
        run: npm install -g wait-on

      - name: Start application (dev mode)
        # Use `next dev` (not `next start`) for E2E. The app's site resolution
        # treats `localhost` as an unknown domain under NODE_ENV=production and
        # responds with a 404 "Niche Not Found" page; in development mode the
        # middleware falls back to NEXT_PUBLIC_DEFAULT_SITE so the Playwright
        # suite (which hits `http://localhost:3000`) gets a real app. This also
        # avoids the production-only RATE_LIMIT_KV fail-closed path and keeps
        # the CI job ~30s shorter by skipping the separate production build.
        run: |
          echo "Starting Next.js dev server..."
          npm run dev > server.log 2>&1 &
          echo $! > server.pid
          echo "Server PID: $(cat server.pid)"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ci-test-secret-jwt-at-least-32-chars-long
          NEXT_PUBLIC_DEFAULT_SITE: ${{ env.SITE_SLUG }}
          PORT: 3000
          HOSTNAME: 0.0.0.0

      - name: Wait for application to be ready
        # TCP-only check: `next dev` compiles routes on demand, so HEAD / may
        # briefly 404 or 500 before the page is compiled; we just need the
        # server to be listening. Playwright tests then drive the real HTTP
        # checks (with their own retry logic).
        run: |
          echo "Waiting for server to bind to :3000..."
          wait-on tcp:127.0.0.1:3000 --timeout 120000 || (echo "Server failed to start"; cat server.log; exit 1)
          echo "Server is listening. Warming up the homepage..."
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep -qE '^(2|3)'; then
              echo "Server is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "Server never returned a 2xx/3xx on /"
          cat server.log
          exit 1

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_DEFAULT_SITE: ${{ env.SITE_SLUG }}

      - name: Stop Supabase
        if: always()
        run: supabase stop || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.SITE_SLUG }}
          path: playwright-report/
          retention-days: 7
