name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo — it never needs to write back, comment on PRs,
# or use OIDC. Restrict the default GITHUB_TOKEN accordingly.
permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
  SUPABASE_SERVICE_ROLE_KEY: placeholder
  JWT_SECRET: ci-test-secret
  INTERNAL_API_TOKEN: ci-test-internal-token
  CRON_SECRET: ci-test-cron-secret
  SUPABASE_JWT_SECRET: ci-test-supabase-jwt-secret
  APP_URL: http://localhost:3000
  SENTRY_DSN: https://placeholder@placeholder.ingest.sentry.io/0
  AFFILIATE_DOMAIN_ENFORCEMENT: strict
  TOTP_ENCRYPTION_KEY: ci-test-totp-encryption-key-0123456789ab
  INTERNAL_HMAC_MIGRATION_MODE: strict
  CLICK_CACHE_HMAC_KEY: ci-test-click-cache-hmac-key
  GDPR_HASH_SECRET: ci-test-gdpr-hash-secret
  CRON_PUBLISH_SECRET: ci-test-cron-publish
  CRON_STRIPE_SYNC_SECRET: ci-test-cron-stripe-sync
  CRON_AI_SECRET: ci-test-cron-ai
  CRON_SITEMAP_SECRET: ci-test-cron-sitemap
  CRON_RETENTION_SECRET: ci-test-cron-retention
  CRON_COMMISSION_SECRET: ci-test-cron-commission
  CRON_EPC_SECRET: ci-test-cron-epc
  CRON_PRICE_SECRET: ci-test-cron-price
  CRON_DEALS_SECRET: ci-test-cron-deals
  CRON_CLICK_RECONCILE_SECRET: ci-test-cron-click-reconcile
  CRON_ACCESS_REVIEW_SECRET: ci-test-cron-access-review
  CRON_HOMEPAGE_SYNTHETIC_SECRET: ci-test-cron-homepage-synthetic
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
  TURNSTILE_SECRET_KEY: ""
  NEXT_PUBLIC_DEFAULT_SITE: ai-compared

jobs:
  check:
    runs-on: ubuntu-latest
    # F-009: Removed OIDC/attestation permissions per security audit.
    # These are now scoped to a separate attest job to prevent supply chain attacks via postinstall scripts.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prettier format check (FR-0004)
        run: npm run format:check
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Migration policy lint (E-2)
        run: bash scripts/check-migrations.sh
      - name: Env-var documentation guard (G-13)
        run: bash scripts/check-env-docs.sh
      - run: npm run lint
      - name: "F-22: Lint worker code explicitly"
        run: npm run lint:worker
      - run: npm test
      - name: Vitest coverage threshold (G-37)
        run: npm run test:coverage
      - run: npm run typecheck:all
      - run: npm run build
        env:
          NEXT_PUBLIC_DEFAULT_SITE: ai-compared
          NEXT_PUBLIC_SUPABASE_URL: https://xyz.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          # C-4: Clear the localhost fallback during production-equivalent build
          # so Next.js static analysis does not capture it into the bundle.
          ALLOW_LOCALHOST_FALLBACK_IN_PROD: ""

      # F-17 / A34: Generate the SBOM and publish the build-provenance inputs
      # from the job that actually produces them. `npm run build` (above)
      # creates `.next/BUILD_ID`; cyclonedx generates `sbom.json`. The
      # dedicated `attest` job (needs: check) downloads both and signs the
      # SLSA provenance. Producing them here removes the previous race where
      # these artifacts were uploaded by `migration-replay` in parallel.
      - name: "F-17: Generate SBOM (mandatory)"
        run: |
          # SBOM generation is a release blocker. Fail the build on generation failure.
          npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json --spec-version 1.5
          if [ ! -f sbom.json ] || [ ! -s sbom.json ]; then
            echo "::error::SBOM generation produced empty or missing file — build blocked."
            exit 1
          fi
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error
      - name: Upload BUILD_ID artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-id
          path: .next/BUILD_ID
          if-no-files-found: error

      - name: Dead code analysis (knip)
        run: npx knip
        env:
          E2E_BASE_URL: http://localhost:3000
      - name: Bundle size check
        run: npx size-limit
      - name: Markdown internal link check (FR-012)
        run: |
          # FR-012: Validate that internal cross-references in docs/ and
          # top-level markdown files are not broken. Only checks relative
          # file links — skips external URLs, anchors-only, code references
          # (file:line), and HTML fragments to avoid false positives.
          set -uo pipefail
          rm -f /tmp/broken-links.txt
          for f in $(find docs/ -name '*.md' -type f) README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md; do
            [ -f "$f" ] || continue
            DIR=$(dirname "$f")
            # Extract markdown links: [text](path) — skip URLs, anchors, mailto
            # Use || true to prevent pipefail from aborting when grep finds no matches
            LINKS=$(grep -oP '\]\(\K[^)]+' "$f" 2>/dev/null \
              | grep -vE '^(https?://|mailto:|#|<)' \
              | grep -vE ':[0-9]+$' \
              | grep -vE '^\s*$' || true)
            [ -z "$LINKS" ] && continue
            echo "$LINKS" | while read -r link; do
              # Strip anchor suffix and leading/trailing whitespace
              TARGET="${link%%#*}"
              TARGET="${TARGET%% *}"
              [ -z "$TARGET" ] && continue
              # Skip if it looks like a code reference (contains : but isn't ./)
              case "$TARGET" in *:*) continue ;; esac
              # Resolve relative to the file's directory
              if [ ! -e "$DIR/$TARGET" ]; then
                echo "::warning file=$f::Broken link: $link (target $DIR/$TARGET not found)"
                echo "$f: $link" >> /tmp/broken-links.txt
              fi
            done
          done
          if [ -f /tmp/broken-links.txt ]; then
            COUNT=$(wc -l < /tmp/broken-links.txt)
            echo "::warning::Found $COUNT broken internal link(s) in docs — see annotations above."
          fi
          echo "Internal link check complete."
      - name: Verify no dev fallback secrets in production (F-018, F-021)
        run: |
          # Ensure wrangler.jsonc production vars don't contain dev fallback tokens.
          # The dev fallback token is defined in lib/internal-auth.ts as
          # DEV_FALLBACK_INTERNAL_TOKEN = "__dev_only_change_me__"
          # NEW-007: previously this check used the wrong string; now matches source.
          DEV_TOKEN="__dev_only_change_me__"
          if grep -q "$DEV_TOKEN" wrangler.jsonc; then
            echo "::error::Dev fallback INTERNAL_API_TOKEN found in wrangler.jsonc — remove it before deploying to production."
            exit 1
          fi
          echo "No dev fallback tokens found in wrangler.jsonc."

      - name: ALLOW_LOCALHOST_FALLBACK_IN_PROD deploy guard (audit-etap1 #9)
        run: |
          # audit-etap1 #9: this flag is intended for local + CI loop-back use
          # only (Lighthouse / Playwright against http://localhost:3000). Any
          # non-empty assignment in a workflow that has a deploy responsibility
          # (deploy.yml, deploy-gradual.yml, rollback.yml, security.yml, etc.)
          # is a foot-gun. We allow-list workflows that legitimately need it
          # against a real loopback target. Anything else fails CI.
          set -euo pipefail
          ALLOWED_REGEX='^\.github/workflows/(ci|preview|lighthouse|load-test|dr-drill|mutation)\.yml$'
          VIOLATIONS=""
          for f in .github/workflows/*.yml; do
            if [[ "$f" =~ $ALLOWED_REGEX ]]; then continue; fi
            if grep -nE '^\s*ALLOW_LOCALHOST_FALLBACK_IN_PROD\s*:\s*("?)[^"\s]+("?)' "$f" \
               | grep -vE 'ALLOW_LOCALHOST_FALLBACK_IN_PROD\s*:\s*""' > /dev/null; then
              VIOLATIONS="$VIOLATIONS $f"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::ALLOW_LOCALHOST_FALLBACK_IN_PROD set to a non-empty value in a workflow that is NOT on the local-loopback allow-list:$VIOLATIONS"
            echo "::error::Allow-list: ci.yml, preview.yml, lighthouse.yml, load-test.yml, dr-drill.yml, mutation.yml"
            exit 1
          fi
          echo "ALLOW_LOCALHOST_FALLBACK_IN_PROD usage stays inside the local-loopback allow-list."

      - name: Admin route authz enforcement (F-01)
        run: |
          # F-01: Every app/api/admin/**/route.ts MUST import requireAdmin,
          # withAuthz, or withAuthzDynamic. A route that imports DAL
          # without an authz wrapper is a cross-tenant data exposure risk.
          set -euo pipefail
          VIOLATIONS=""
          for file in $(find app/api/admin -name 'route.ts' -o -name 'route.tsx'); do
            if ! grep -qE 'requireAdmin|withAuthz|withAuthzDynamic' "$file"; then
              VIOLATIONS="$VIOLATIONS $file"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Admin routes missing authz import (requireAdmin/withAuthz/withAuthzDynamic):$VIOLATIONS"
            exit 1
          fi
          echo "All admin routes import an approved authz wrapper."

      - name: Admin route DAL usage audit (PRIORITY 1)
        run: |
          # P1-11: Fail closed when scripts/tools are missing — never skip
          # security-critical checks silently.
          set -euo pipefail
          if [ ! -f "scripts/check-admin-authz.sh" ]; then
            echo "::error::scripts/check-admin-authz.sh is missing — admin authz audit cannot run. This is a required check."
            exit 1
          fi
          bash scripts/check-admin-authz.sh || exit 1

      - name: DAL site_id scoping audit (AUDIT-FIX)
        run: |
          set -euo pipefail
          if [ ! -f "scripts/check-dal-site-scoping.sh" ]; then
            echo "::error::scripts/check-dal-site-scoping.sh is missing — DAL site scoping audit cannot run."
            exit 1
          fi
          bash scripts/check-dal-site-scoping.sh || exit 1

      - name: CORS security tests (PRIORITY 2)
        run: |
          # P1-11: Fail closed when test files are missing.
          set -euo pipefail
          if [ ! -f "__tests__/cors-security.test.ts" ]; then
            echo "::error::__tests__/cors-security.test.ts is missing — CORS security tests cannot run. This is a required check."
            exit 1
          fi
          echo "Running CORS security tests..."
          npm test -- __tests__/cors-security.test.ts

      - name: Internal API routes auth enforcement (P1-7)
        run: |
          set -euo pipefail
          echo "Scanning app/api/internal/**/route.ts for auth mechanisms..."
          VIOLATIONS=""
          for file in $(find app/api/internal -name 'route.ts' -o -name 'route.tsx' 2>/dev/null); do
            if ! grep -qE 'requireInternalAuth|getInternalToken|verifyInternalHmac|INTERNAL_HEADER|getInternalTokenFor' "$file"; then
              VIOLATIONS="$VIOLATIONS $file"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Internal API routes missing auth (requireInternalAuth/getInternalToken/verifyInternalHmac/INTERNAL_HEADER):$VIOLATIONS"
            exit 1
          fi
          echo "All internal API routes import an approved auth mechanism."

      - name: Service-role import scan (P1-6)
        run: |
          set -euo pipefail
          # Scan non-exempt API routes for privileged client imports.
          # Allowed: cron, internal, membership/webhook, admin, auth routes.
          VIOLATIONS=""
          for file in $(find app/api -name 'route.ts' -o -name 'route.tsx' | grep -v 'app/api/cron/' | grep -v 'app/api/internal/' | grep -v 'app/api/membership/webhook/' | grep -v 'app/api/admin/' | grep -v 'app/api/auth/' | grep -v 'app/api/queue/' | grep -v 'app/api/health/'); do
            if grep -qE 'getPrivilegedSupabaseClient|getServiceClient|service-role' "$file"; then
              VIOLATIONS="$VIOLATIONS $file"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Non-exempt API routes importing service-role client (bypasses RLS):$VIOLATIONS"
            exit 1
          fi
          echo "No unauthorized service-role imports in public API routes."

      - name: R2 bucket isolation validation (G-09)
        run: |
          # G-09: inspect the actual Worker config (`wrangler.jsonc`),
          # not `.env.example`. The latter ships with empty values by
          # design, so grep-ing it was always a no-op. This check fails
          # if the public and private R2 bucket bindings point at the
          # same `bucket_name`, which would make unvalidated uploads
          # publicly reachable.
          set -euo pipefail
          if [ ! -f wrangler.jsonc ]; then
            echo "wrangler.jsonc not found, skipping R2 isolation check"
            exit 0
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required for R2 isolation check but is not installed"
            exit 1
          fi
          # Strip JSONC line comments and trailing commas so `jq` can parse the file.
          WRANGLER_JSON=$(sed -E 's@^[[:space:]]*//.*$@@; s@[[:space:]]+//[^"]*$@@' wrangler.jsonc \
            | python3 -c 'import re,sys; sys.stdout.write(re.sub(r",(\s*[}\]])", r"\1", sys.stdin.read()))')
          R2_PUBLIC=$(echo "$WRANGLER_JSON" | jq -r '
            [ (.env.production.r2_buckets // .r2_buckets // [])[]
              | select(.binding == "R2_PUBLIC_BUCKET" or .binding == "NEXT_INC_CACHE_R2_BUCKET")
              | .bucket_name ]
            | .[0] // ""
          ')
          R2_PRIVATE=$(echo "$WRANGLER_JSON" | jq -r '
            [ (.env.production.r2_buckets // .r2_buckets // [])[]
              | select(.binding == "R2_PRIVATE_BUCKET")
              | .bucket_name ]
            | .[0] // ""
          ')
          echo "R2_PUBLIC_BUCKET=$R2_PUBLIC"
          echo "R2_PRIVATE_BUCKET=$R2_PRIVATE"
          if [ -n "$R2_PUBLIC" ] && [ -n "$R2_PRIVATE" ] && [ "$R2_PUBLIC" = "$R2_PRIVATE" ]; then
            echo "::error::R2_PUBLIC_BUCKET and R2_PRIVATE_BUCKET point at the same bucket ('$R2_PUBLIC')."
            echo "::error::Production must isolate public and private buckets so unvalidated uploads are not publicly reachable."
            exit 1
          fi

      - name: Fail-closed rate limiting on security routes (F-006)
        run: |
          # F-006: Security-critical routes (auth, admin mutations) must use
          # failPolicy: "closed" so rate limiting is never silently skipped
          # when the distributed limiter (KV/DO) is unavailable.
          set -euo pipefail
          VIOLATIONS=""
          SECURITY_ROUTES=(
            "app/api/auth/login/route.ts"
            "app/api/auth/forgot-password/route.ts"
            "app/api/auth/reset-password/route.ts"
            "app/api/auth/refresh/route.ts"
            "app/api/auth/me/route.ts"
          )
          for route in "${SECURITY_ROUTES[@]}"; do
            if [ -f "$route" ]; then
              if grep -q "checkRateLimit" "$route" && ! grep -q 'failPolicy.*"closed"' "$route"; then
                VIOLATIONS="$VIOLATIONS $route"
              fi
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Security routes missing failPolicy: \"closed\":$VIOLATIONS"
            echo "::error::All auth/admin rate-limited routes must use failPolicy: \"closed\" to prevent abuse during KV/DO outages."
            exit 1
          fi
          echo "All security-critical routes use fail-closed rate limiting."

      - name: Raw IP header parsing check (Risk-6)
        run: |
          # Risk-6: All API routes must use getClientIp() for IP extraction.
          # Raw x-forwarded-for parsing is inconsistent and misses
          # CF-Connecting-IP. Exempt lib/get-client-ip.ts itself.
          set -euo pipefail
          VIOLATIONS=""
          for file in $(find app/api -name '*.ts' -o -name '*.tsx' | grep -v node_modules); do
            if grep -q 'x-forwarded-for' "$file" && ! grep -q 'getClientIp' "$file"; then
              VIOLATIONS="$VIOLATIONS $file"
            fi
          done
          # Also check for direct header access in route files
          for file in $(find app/api -name 'route.ts' -o -name 'route.tsx'); do
            if grep -qE "headers\.get\(['\"]x-forwarded-for" "$file" 2>/dev/null; then
              if ! grep -q 'getClientIp' "$file"; then
                VIOLATIONS="$VIOLATIONS $file"
              fi
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::API routes using raw IP header parsing instead of getClientIp():$VIOLATIONS"
            echo "::error::Use getClientIp(request) from @/lib/get-client-ip for consistent, safe IP extraction."
            exit 1
          fi
          echo "All API routes use centralized IP extraction."

      - name: Verify Stripe uses Restricted API Keys (F-033, R-18)
        run: |
          # FIX-15 (F-033) + R-18: Stripe legacy sk_live_ / sk_test_ keys grant full
          # account access. Restricted API Keys (rk_live_ / rk_test_) limit permissions
          # to only the operations this app needs. This check ensures config files
          # reference only restricted keys. Now fails (not just warns).
          VIOLATIONS=""
          if grep -qE 'sk_live_|sk_test_' .env.example 2>/dev/null; then
            VIOLATIONS="$VIOLATIONS .env.example"
          fi
          if grep -qE 'sk_live_|sk_test_' wrangler.jsonc 2>/dev/null; then
            VIOLATIONS="$VIOLATIONS wrangler.jsonc"
          fi
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Legacy Stripe key prefix (sk_live_/sk_test_) found in:$VIOLATIONS — migrate to Restricted API Keys (rk_live_/rk_test_)."
            exit 1
          fi
          echo "Stripe API key prefix check passed."

      - name: Lockfile integrity check (P2-7)
        run: |
          # P2-7: Ensure package-lock.json is in sync with package.json.
          # npm ci already validates this, but an explicit check gives a
          # clearer error message when the lockfile has drifted.
          # Note: avoid piping npm ci output through head with pipefail,
          # as head closing the pipe early triggers SIGPIPE failures.
          set -euo pipefail
          npm ci --dry-run > /tmp/lockfile-check.log 2>&1 || {
            echo "::error::package-lock.json is out of sync with package.json. Run 'npm install' and commit the lockfile."
            cat /tmp/lockfile-check.log
            exit 1
          }
          echo "Lockfile integrity verified."

      - name: "F-06: TODO/FIXME/HACK/XXX audit"
        run: |
          # F-06: Fail on new TODO/FIXME/HACK/XXX unless linked to an issue with expiry.
          # Pattern: TODO(#123, 2025-06-01) or FIXME(#456, 2025-12-31)
          set -euo pipefail
          VIOLATIONS=$(grep -rn --include='*.ts' --include='*.tsx' -E '\b(TODO|FIXME|HACK|XXX)\b' lib/ app/ \
            | grep -vE '\b(TODO|FIXME|HACK|XXX)\(#[0-9]+,\s*[0-9]{4}-[0-9]{2}-[0-9]{2}\)' \
            | grep -v 'node_modules' \
            | grep -v '.test.' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Unlinked TODO/FIXME/HACK/XXX found. Each must reference an issue and expiry date: TODO(#123, 2025-12-31)"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "All TODO/FIXME/HACK/XXX markers are properly linked."

      - name: "F-19: Validate domain exclusions tracking"
        run: |
          # F-19: Ensure domains mentioned in wrangler.jsonc comments are tracked
          # in terraform/cloudflare/domain-exclusions.tf to prevent configuration drift.
          set -euo pipefail
          if [ ! -f "terraform/cloudflare/domain-exclusions.tf" ]; then
            echo "::warning::F-19: domain-exclusions.tf not found. Create it to track excluded domains."
            exit 0
          fi
          echo "Domain exclusions tracking file exists."
          # Extract domains from wrangler.jsonc comments and verify they're tracked
          EXCLUDED_DOMAINS=$(grep -oE 'compareai\.site' wrangler.jsonc || true)
          if [ -n "$EXCLUDED_DOMAINS" ]; then
            echo "Found excluded domain in wrangler.jsonc: $EXCLUDED_DOMAINS"
            echo "Verify it's tracked in terraform/cloudflare/domain-exclusions.tf"
          fi

      - name: "S1-A8.5: fail-open criticality tags in security paths"
        run: |
          # S1-A8.5: Every `fail-open` comment in security-critical paths must
          # include a [criticality:xxx] tag (non-critical, defence-in-depth,
          # monitoring, telemetry). Untagged fail-open sites hide silent
          # security degradation.
          set -euo pipefail
          SECURITY_PATHS="lib/auth.ts lib/csrf.ts lib/sanitize-html.ts lib/password.ts lib/jwt-secret.ts lib/safe-redirect.ts lib/internal-hmac.ts lib/jwt-binding.ts lib/jwt-revocation.ts lib/hmac-key.ts lib/get-client-ip.ts lib/audit-log.ts lib/security/"
          VIOLATIONS=""
          for f in $SECURITY_PATHS; do
            if [ -e "$f" ]; then
              FOUND=$(grep -rn 'fail-open' "$f" | grep -v '\[criticality:' 2>/dev/null || true)
              if [ -n "$FOUND" ]; then
                VIOLATIONS="${VIOLATIONS}${FOUND}\n"
              fi
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Untagged fail-open comments in security paths. Add [criticality:non-critical|defence-in-depth|monitoring|telemetry]:"
            echo -e "$VIOLATIONS"
            exit 1
          fi
          echo "All fail-open sites in security paths are tagged with criticality."

      - name: "S4-A89.1: Security-path TODO/FIXME gate"
        run: |
          # S4-A89.1: Fail if any TODO/FIXME/HACK/XXX exists in security-critical
          # paths (including test files). These paths must never contain deferred work.
          set -euo pipefail
          SECURITY_PATHS="lib/auth.ts lib/csrf.ts lib/sanitize-html.ts lib/password.ts lib/jwt-secret.ts lib/safe-redirect.ts lib/internal-hmac.ts lib/jwt-binding.ts lib/jwt-revocation.ts lib/hmac-key.ts lib/get-client-ip.ts lib/audit-log.ts lib/security/"
          VIOLATIONS=""
          for f in $SECURITY_PATHS; do
            if [ -e "$f" ]; then
              FOUND=$(grep -rn -E '\b(TODO|FIXME|HACK|XXX)\b' "$f" 2>/dev/null || true)
              if [ -n "$FOUND" ]; then
                VIOLATIONS="${VIOLATIONS}${FOUND}\n"
              fi
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::TODO/FIXME/HACK/XXX found in security-critical paths:"
            echo -e "$VIOLATIONS"
            exit 1
          fi
          echo "No deferred work markers in security-critical paths."

      - name: "S4-A87.2: Ban .only in test files"
        run: |
          # S4-A87.2: Prevent it.only / describe.only / test.only from reaching main.
          # These isolate tests to a subset, masking regressions.
          # Note: .skip is allowed for conditional DB-dependent tests (ternary pattern).
          set -euo pipefail
          VIOLATIONS=$(grep -rn --include='*.test.ts' --include='*.test.tsx' -E '\b(describe|it|test)\.only\b' __tests__/ app/ lib/ 2>/dev/null || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::.only found in test files — remove before merging:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No .only found in test files."

      - name: "Q2-3: Style interpolation gate"
        run: |
          # Q2-3: Deny style={...variable} patterns where the variable could
          # contain caller-supplied data. CSS exfiltration via background:url()
          # is possible when untrusted data flows into inline style attrs.
          # Safe patterns: style={{ constants }}, style={staticObj}
          set -euo pipefail
          VIOLATIONS=$(grep -rn --include='*.tsx' --include='*.ts' -E 'style=\{[^}]*\b(props|params|query|body|input|data|user)\b' app/ lib/ 2>/dev/null || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Potential caller-supplied data in inline style attributes (Q2-3, CWE-79):"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No unsafe style interpolation patterns found."

      - name: "H-8: unsafeNoSiteFilter call-site count gate"
        run: |
          # H-8: Guard against scope creep of tenant-isolation overrides.
          # Each unsafeNoSiteFilter() call bypasses RLS site_id scoping.
          # New call sites require a code comment with audit-ticket reference.
          set -euo pipefail
          # Baseline raised from 33 → 67 in PR-A: F-API-01 cron proxy
          # unbreak, then 67 → 73 in NEW-03: extend F-API-01 guard to
          # .rpc() calls (+6 opt-outs for cross-tenant/user-scoped RPCs),
          # then 73 → 74: health liveness probe (getTenantClient() breaks
          # with asymmetric-only Supabase JWT keys; global DB ping has no
          # then 74 → 75 → 77: upsertConfigSite() in lib/dal/sites.ts
          # provisions a `sites` registry row from static config (global
          # control-plane write, no site_id to scope by — same rationale as
          # createSite()); +2 because the grep also counts the documentation
          # reference in lib/dal/site-resolver.ts.
          # then 77 → 79: lib/supabase-server.ts adds the no-op opt-out shim
          # to the RLS-enforced tenant / anon clients (the privileged client
          # already exposed it). +2 = the method-name check plus one doc
          # reference; these are NOT new RLS bypasses — the tenant/anon
          # clients stay RLS-scoped and the shim only stops a TypeError crash
          # when a global-table DAL helper calls the opt-out on them.
          # Every new opt-out is annotated with an `F-API-01` or `NEW-03`
          # audit-ticket comment in lib/ or app/ documenting why the
          # site_id filter does not apply (global/cross-tenant tables,
          # lookup queries that *resolve* site_id, or cross-tenant
          # rollups). The cron-proxy-guard test asserts each chain.
          # then 79 -> 81 (M2 audit fix): lib/dal/admin-site-memberships.ts adds
          # listAllAdminSiteMembershipsWithSlugs(), which reads
          # admin_site_memberships across ALL sites (a service_role-only table;
          # migrations 00036 / 00040 / 00067) to render the super_admin Users
          # page "Sites access" column. Reached only from the
          # requireAdminSession()-gated Users page and mirrors
          # lib/dal/admin-users.ts. +2 = the .unsafeNoSiteFilter() call plus its
          # audited doc reference.
          # then 81 -> 85 (PR #900): admin platform-config pages read global,
          # service_role-only tables that have no `site_id` to scope by. The
          # DAL adds +4 opt-outs: lib/dal/permissions.ts listRoles() +
          # getRoleByName() + listPermissions() on the global `roles` /
          # `permissions` RBAC tables (+3), and lib/dal/integrations.ts
          # listIntegrationProviders() on the global `integration_providers`
          # registry (+1). Each call is annotated with a `// SAFE:` comment
          # explaining the table is global (no tenant column), so the opt-out
          # is a no-op on tenant scoping rather than an RLS bypass. These
          # reads were locked to service_role by 00033 / 00040 and were the
          # root cause of the five blank admin pages this PR fixes.
          # then 85 -> 87 (PR #932): the audit_log writer fix. recordAuditEvent()
          # in lib/audit-log.ts switches from the RLS-scoped tenant client to the
          # privileged service_role client and adds the cross-tenant opt-out on
          # both the direct insert and its single retry. `audit_log` INSERT is
          # granted to service_role only (migration 2026050103
          # `audit_log_service_insert`; UPDATE/DELETE are revoked from every
          # role), and the ledger spans every site plus global / auth events
          # (site_id = NULL), so there is no site_id to scope by; the F-API-01
          # guard is satisfied with the explicit opt-out, not an .eq('site_id').
          # Reached only from server-side admin/auth handlers that have already
          # gated the caller. Without this the writes were RLS-denied (and
          # degraded to anon on a SUPABASE_JWT_SECRET mismatch) and silently
          # dropped, so the Audit Log grid was always empty. The grep count is
          # now 87: +3 matches = the insert call, the retry call, and the
          # audited doc reference in lib/security/service-role-allowlist.ts.
          # then 87 -> 89 (Issue-7 cursor-batching fix): the audit_log retention
          # block is reworked from a single .limit(10000) fetch to cursor-based
          # batching matching the affiliate_clicks block. The two extra opt-outs
          # are: (1) the cron_state checkpoint SELECT before the batch loop
          # and (2) the cron_state checkpoint UPSERT that clears the cursor
          # after the final batch. Both are on the global `cron_state` table
          # (no site_id column) — the same rationale as the affiliate_clicks
          # checkpoint calls already included in the baseline. These are NOT
          # new RLS bypasses; `cron_state` has no tenant column and is
          # service_role-only by policy.
          # then 89 -> 93 (PR #950 security-audit fixes): +4 audited opt-outs,
          # each annotated with an F-API-01 / NEW-03 / SAFE audit-ticket
          # comment at the call site:
          #   (1) lib/dal/admin-users.ts verifyAndSetTotpStep() — the Bug-8
          #   TOTP replay fix. The compare-and-set runs via the
          #   verify_and_set_totp_step RPC against `admin_users`, which is
          #   global admin auth state (service_role-only), not site data, so
          #   there is no site_id to scope by. +1 = the .unsafeNoSiteFilter()
          #   on the RPC chain.
          #   (2)-(3) app/api/cron/stripe-sync/route.ts reverse-reconciliation
          #   pass (gated behind STRIPE_REVERSE_RECONCILE_ENABLED, default
          #   off): the SELECT of DB-active memberships and the terminal-sub
          #   deactivation UPDATE. Like the Phase-2 forward reconciliation
          #   already in the baseline, this is a cross-tenant billing-integrity
          #   sweep keyed on the globally-unique stripe_subscription_id /
          #   membership id — a cancelled sub in any site is an entitlement
          #   leak, so it must consider every tenant. +2 calls.
          #   (4) +1 = the audited doc-reference comment in the same file.
          # then 93 -> 95 (PR #979 / authz 503 fix): +2 audited opt-outs,
          # both gated by requireAdmin() / requireAdminSession() and annotated
          # with a `// SAFE:` comment at the call site:
          #   (1) lib/authz.ts authorizeResource() — resolves a resource's real
          #   site_id before enforcing the expected-site check; the privileged-client
          #   query has no site_id to scope by until after the lookup.
          #   (2) lib/dal/permissions.ts getRolePermissionCheck() — joins the
          #   global `permissions` and `role_permissions` RBAC tables (no site_id
          #   column) to decide feature-level access. The DAL already uses the
          #   privileged client for these service_role-only tables.
          # then 95 -> 96 (PR #979 / dashboard cross-site cards): +1 audited opt-out
          # in lib/dal/niche-health.ts getNicheHealthStats(). The RPC aggregates
          # products, content, clicks and newsletter subscribers across every active
          # site; it has no p_site_id parameter and is reached only from the
          # super_admin-gated Niche Health card. Annotated with a `// SAFE:` comment.
          # then 96 -> 101 (PR #988 / admin API token fix): +5 audited opt-outs in
          # lib/dal/admin-api-tokens.ts. The `admin_api_tokens` table is global and
          # cross-tenant; all create/list/get/delete/touch queries need the privileged
          # client without a site_id filter. Each call is annotated with a `// SAFE:`
          # comment and the module is on the SERVICE_ROLE_IMPORT_ALLOWLIST.
          # then 101 -> 107 (automation control plane, PR #1045): +6 audited opt-outs
          # in the machine-to-machine automation DALs. These tables are reached only
          # after Bearer auth resolves a site-bound service account; the queries key on
          # a globally-unique/primary-key column rather than site_id:
          #   (1) lib/dal/automation-tokens.ts createAutomationToken() — INSERT returns
          #       the row; automation_tokens has no site_id (binding is on the account).
          #   (2) lib/dal/automation-tokens.ts getAutomationTokenByHash() — auth lookup
          #       by globally-unique token_hash (site is derived from the account).
          #   (3) lib/dal/automation-tokens.ts touchAutomationToken() — last_used_at
          #       bump by primary key; no site_id column exists.
          #   (4) lib/dal/automation-actions.ts getActionByIdempotencyKey() — unique
          #       (service_account_id, idempotency_key); the account is site-bound.
          #   (5) lib/dal/automation-runs.ts countActionsSince() — quota aggregate
          #       scoped by service_account_id, which is itself site-bound.
          #   (6) lib/dal/automation-service-accounts.ts get/set by id — PK lookups from
          #       the auth resolver and the super_admin kill switch (cross-site by role).
          # Each call is annotated with a `// SAFE:` comment; lib/automation/db.ts is the
          # single sanctioned importer on the SERVICE_ROLE_IMPORT_ALLOWLIST.
          BASELINE=107
          COUNT=$(grep -rn --include='*.ts' --include='*.tsx' 'unsafeNoSiteFilter' lib/ app/ 2>/dev/null | grep -v node_modules | grep -v __tests__ | wc -l | tr -d ' ')
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::unsafeNoSiteFilter() call-site count grew from $BASELINE to $COUNT. Each new call must be justified with an audit-ticket comment."
            grep -rn --include='*.ts' --include='*.tsx' 'unsafeNoSiteFilter' lib/ app/ | grep -v node_modules | grep -v __tests__
            exit 1
          fi
          echo "unsafeNoSiteFilter() call-site count: $COUNT (baseline: $BASELINE)"

  # F-14: Migration up/down replay on throwaway Postgres
  # This job verifies that migrations can be cleanly applied and rolled back,
  # ensuring no data loss or schema corruption during migration replay.
  attest:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom

      - name: Download BUILD_ID artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-id
          # Restore into .next/ so the attestation subject path
          # `.next/BUILD_ID` resolves exactly as built in `check`.
          path: .next

      - name: Generate SLSA provenance attestation (A34)
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            sbom.json
            .next/BUILD_ID

      - name: Sign SBOM with cosign (A34)
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Cosign sign SBOM (A34)
        if: github.ref == 'refs/heads/main'
        run: |
          cosign sign-blob --yes \
            --bundle sbom.json.cosign.bundle \
            sbom.json

      - name: Upload SBOM signature bundle (A34)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-signature
          path: sbom.json.cosign.bundle

  migration-replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: affilite_mix_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # Use the repo-pinned Node version (.nvmrc → 22.22.2) like every
          # other CI job. package.json engines require >=22.22.2 and the
          # Wrangler dry-run step below needs Node >=22, so hardcoding "20"
          # here broke the F-035 check.
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        # F-011: pin the Supabase CLI version so a breaking upstream
        # release cannot change migration behaviour without a deliberate
        # code change. Bump deliberately via Renovate / Dependabot.
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v1
        with:
          version: 2.45.5

      - name: Run migrations up
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/affilite_mix_test?sslmode=disable
          PGSSLMODE: disable
        run: |
          # F-14: Apply all up-migrations to a fresh database using psql directly.
          #
          # WHY NOT supabase db reset/push:
          # Supabase CLI v2.45.5 scans supabase/migrations/ and picks up ALL .sql
          # files — including *-down.sql files. Both 00000_baseline_repair.sql and
          # 00000_baseline_repair-down.sql resolve to the same version key (00000)
          # in supabase_migrations.schema_migrations, so CLI fails with:
          #   ERROR: duplicate key value violates unique constraint
          #   "schema_migrations_pkey" — Key (version)=(00000) already exists.
          #
          # Using psql lets us apply only the canonical up-migrations in order,
          # bypassing the CLI's migration-tracking entirely. For CI purposes
          # (verifying the SQL is valid on a fresh Postgres schema) this is correct.

          DB_URL="${DATABASE_URL}"

          # Bootstrap: replicate the Supabase platform environment that migrations
          # assume on a hosted instance.
          #
          # 1. Roles: Supabase pre-creates anon / authenticated / service_role on
          #    every project. Plain postgres:15 has none of these; GRANT TO anon
          #    in CREATE POLICY fails with "role does not exist".
          #
          # 2. auth schema + functions: auth.role() / auth.uid() / auth.jwt() are
          #    referenced in RLS USING / WITH CHECK clauses. They must exist for
          #    CREATE POLICY DDL to parse even though they are never called during
          #    migration execution.
          psql "$DB_URL" <<'SQL'
            -- Supabase platform roles
            DO $$ BEGIN
              CREATE ROLE anon          NOLOGIN NOINHERIT;
              EXCEPTION WHEN duplicate_object THEN NULL;
            END $$;
            DO $$ BEGIN
              CREATE ROLE authenticated NOLOGIN NOINHERIT;
              EXCEPTION WHEN duplicate_object THEN NULL;
            END $$;
            DO $$ BEGIN
              CREATE ROLE service_role  NOLOGIN NOINHERIT BYPASSRLS;
              EXCEPTION WHEN duplicate_object THEN NULL;
            END $$;

            -- pages table: created manually on the production DB before the
            -- migration chain was established; it is never in any up-migration
            -- file. Migrations 00026/00031/00035/00060/00074/00092 reference it,
            -- so it must exist before those migrations run.
            -- NOTE: FK to sites omitted here — sites is created by 00001, which
            -- runs AFTER this bootstrap block. CI only needs the table for DDL
            -- parsing (CREATE POLICY, CREATE INDEX, REVOKE); FK is not required.
            CREATE TABLE IF NOT EXISTS public.pages (
              id          uuid        PRIMARY KEY DEFAULT gen_random_uuid(),
              site_id     uuid        NOT NULL,
              slug        text        NOT NULL,
              title       text        NOT NULL DEFAULT '',
              body        text        NOT NULL DEFAULT '',
              is_published boolean    NOT NULL DEFAULT false,
              sort_order  integer     NOT NULL DEFAULT 0,
              created_at  timestamptz NOT NULL DEFAULT now(),
              updated_at  timestamptz NOT NULL DEFAULT now(),
              UNIQUE (site_id, slug)
            );
            ALTER TABLE public.pages ENABLE ROW LEVEL SECURITY;

            -- scheduled_jobs table: used in 00068_enforce_scheduled_jobs_rls.sql
            -- but only created in 00071_create_scheduled_jobs.sql (out of order).
            -- Migration 00071 itself documents this gap: "Earlier migrations
            -- (00003, 00020, 00024, 00068) reference the scheduled_jobs table
            -- for RLS policies and indexes, but no migration in the chain
            -- actually creates it." FK to sites omitted — sites is created by
            -- 00001, which runs after this bootstrap block.
            CREATE TABLE IF NOT EXISTS public.scheduled_jobs (
              id            uuid        PRIMARY KEY DEFAULT gen_random_uuid(),
              site_id       uuid        NOT NULL,
              job_type      text        NOT NULL,
              target_id     uuid        NOT NULL,
              scheduled_for timestamptz NOT NULL,
              status        text        NOT NULL DEFAULT 'pending',
              payload       jsonb       DEFAULT '{}',
              executed_at   timestamptz,
              error         text,
              created_at    timestamptz DEFAULT now(),
              updated_at    timestamptz DEFAULT now()
            );
            ALTER TABLE public.scheduled_jobs ENABLE ROW LEVEL SECURITY;

            -- audit_events table: indexed by 2026052302_security_audit_hardening.sql
            -- but never created in any migration (it pre-dates the migration chain
            -- on production). CREATE INDEX fails on a non-existent table even with
            -- IF NOT EXISTS, so the table must exist before that migration runs.
            CREATE TABLE IF NOT EXISTS public.audit_events (
              id          bigserial   PRIMARY KEY,
              site_id     uuid        NOT NULL,
              actor       text        NOT NULL,
              actor_user_id uuid,
              action      text        NOT NULL,
              entity_type text        NOT NULL DEFAULT '',
              entity_id   text        NOT NULL DEFAULT '',
              details     jsonb,
              ip          text,
              failure_type text,
              created_at  timestamptz NOT NULL DEFAULT now()
            );

            -- auth schema stubs
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE OR REPLACE FUNCTION auth.role()
              RETURNS text LANGUAGE sql STABLE
              AS $$ SELECT COALESCE(
                   NULLIF(current_setting('request.jwt.claims', true), '')::jsonb->>'role',
                   current_user
                 ) $$;
            CREATE OR REPLACE FUNCTION auth.uid()
              RETURNS uuid LANGUAGE sql STABLE
              AS $$ SELECT (NULLIF(current_setting('request.jwt.claims', true), '')::jsonb->>'sub')::uuid $$;
            CREATE OR REPLACE FUNCTION auth.jwt()
              RETURNS jsonb LANGUAGE sql STABLE
              AS $$ SELECT NULLIF(current_setting('request.jwt.claims', true), '')::jsonb $$;
          SQL

          # Apply only up-migrations in lexicographic order, skipping down files.
          find supabase/migrations -maxdepth 1 -name '*.sql' \
            ! -name '*-down.sql' | sort | while read -r f; do
            echo "Applying $f ..."
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verify migrations applied
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/affilite_mix_test?sslmode=disable
          PGSSLMODE: disable
        run: |
          # Verify the schema is not empty
          TABLE_COUNT=$(psql "$DATABASE_URL" -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';")
          echo "Tables created: $TABLE_COUNT"
          if [ "$TABLE_COUNT" -eq 0 ]; then
            echo "::error::No tables created after migrations"
            exit 1
          fi

      - name: Run migrations down (if supported)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/affilite_mix_test
        run: |
          # F-14: Note: Supabase CLI does not support automatic down migration
          # This step documents the limitation and recommends manual testing
          echo "F-14: Supabase CLI does not support automatic down migration"
          echo "Manual rollback testing required for production migrations"
          echo "See docs/adr/0013-migration-squashing.md for migration strategy"

      - name: "INF-02: Terraform alerts configuration check"
        run: |
          # INF-02: Verify that committed terraform alerts config has alerting enabled.
          # If alerts_enabled is false in committed tfvars, SLO burn-rate alerting
          # is affirmatively disabled in production — this is a P0 finding.
          set -euo pipefail
          TFVARS="terraform/cloudflare/alerts.auto.tfvars"
          if [ -f "$TFVARS" ]; then
            if grep -q 'alerts_enabled\s*=\s*false' "$TFVARS"; then
              echo "::warning::INF-02: alerts_enabled = false in $TFVARS. Production alerting is disabled. Set to true and add PagerDuty/email destinations."
            fi
          fi

      # NOTE: SBOM generation + SLSA provenance attestation + cosign signing
      # were previously duplicated here. They have been removed: the SBOM and
      # BUILD_ID are now produced by the `check` job and the signed provenance
      # is generated by the dedicated `attest` job (which holds the required
      # `id-token: write` / `attestations: write` permissions). This job has
      # only `contents: read`, so attestation here could never succeed.

      - name: Wrangler dry-run check (F-035)
        # `wrangler.jsonc` references `.open-next/assets` and
        # `workers/custom-worker.ts` imports the generated
        # `../.open-next/worker.js` — both are normally produced by
        # `opennextjs-cloudflare build`. For a CI *config* validation we
        # don't need a real OpenNext build; stub the assets directory and
        # worker entrypoint so wrangler can resolve all paths and validate
        # bindings/syntax. The full OpenNext build is exercised by
        # `preview.yml` / `deploy.yml`.
        run: |
          mkdir -p .open-next/assets
          cat > .open-next/worker.js <<'EOF'
          // CI stub generated by ci.yml. Replaced at deploy time by
          // `opennextjs-cloudflare build`. Existence is sufficient for
          // `wrangler deploy --dry-run` to validate wrangler.jsonc.
          export default { fetch: () => new Response("stub") };
          EOF
          npx wrangler deploy --dry-run

  # ── RLS / anon-grant audit against staging DB (E-6) ────────────────
  # Runs the queries from docs/public-rls-inventory.md against the
  # staging database. Fails the build if any unexpected policies or
  # grants have drifted onto the public schema.
  #
  # Gating policy (N-005):
  #   - Trusted contexts (main pushes, PRs from this repo) set
  #     REQUIRE_STAGING_DB=true so a missing STAGING_SUPABASE_DB_URL
  #     hard-fails the job instead of silently passing.
  #   - Fork PRs cannot read the secret and run in skip-green mode so
  #     external contributors are not blocked. This is enforced by
  #     scripts/db-audit.sh based on REQUIRE_STAGING_DB.
  # F-10: db-audit and db-types jobs now surface an explicit skip
  # status so branch protection can distinguish between "passed"
  # and "skipped due to missing secrets". The job name includes the
  # outcome — configure branch protection to require the *:passed
  # variant, not the generic job name.
  db-audit:
    name: RLS audit (E-6)
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.audit-result.outputs.status }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply pending security hardening migrations to staging
        # A31-A44: PR adds REVOKE migrations that must be applied to staging
        # before the audit runs. The deploy workflow only runs on main push,
        # so CI must apply them here to keep the audit gate meaningful on PRs.
        # All migrations in this step are idempotent (DO blocks, REVOKE is
        # a no-op if the grant doesn't exist).
        env:
          STAGING_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_POOLER_URL || secrets.STAGING_SUPABASE_DB_URL }}
        run: |
          if [ -z "${STAGING_SUPABASE_DB_URL:-}" ]; then
            echo "No staging DB URL — skipping pre-audit migration apply."
            exit 0
          fi
          # Strip ?pgbouncer=true — psql doesn't understand it.
          DB_URL="${STAGING_SUPABASE_DB_URL%%\?*}"
          # Test connectivity first — skip silently if staging is unreachable.
          if ! psql "$DB_URL" -c "SELECT 1" -t -A -X >/dev/null 2>&1; then
            echo "::warning::Staging DB unreachable — skipping pre-audit migration apply."
            exit 0
          fi
          echo "Applying pending security hardening migrations to staging…"
          for f in supabase/migrations/2026052601_revoke_anon_grants_fix_rls.sql; do
            if [ -f "$f" ]; then
              echo "  → $f"
              psql "$DB_URL" -v ON_ERROR_STOP=1 -X -f "$f"
            fi
          done
          echo "Done."
      - name: Run db-audit
        id: audit-result
        env:
          # Prefer the transaction-pooler URL when it's set as a secret
          # because Supabase direct hostnames (db.<ref>.supabase.co) only
          # resolve over IPv6, and GitHub-hosted runners are IPv4-only.
          # Fall back to the direct URL for setups that don't use the
          # pooler. db-audit.sh treats whatever lands here as the primary
          # URL (its own STAGING > POOLER > DATABASE_URL ordering remains
          # in place for local invocations that set both).
          STAGING_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_POOLER_URL || secrets.STAGING_SUPABASE_DB_URL }}
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
          # Hard-fail on missing secret for trusted runs (main push or
          # non-fork PRs); fork PRs fall through to skip-green.
          REQUIRE_STAGING_DB: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && 'true' || 'false' }}
        run: |
          if bash scripts/db-audit.sh; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            # If the script exited non-zero because the DB URL was missing
            # (fork PR), mark as skipped rather than failed so the required
            # check gate can distinguish the two.
            if [ -z "${STAGING_SUPABASE_DB_URL:-}" ] && [ "${REQUIRE_STAGING_DB}" != "true" ]; then
              echo "status=skipped" >> "$GITHUB_OUTPUT"
              echo "::warning::F-10: db-audit skipped — no staging DB URL available (fork PR)"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

      - name: Report audit status
        if: always()
        run: |
          echo "### RLS audit: ${{ steps.audit-result.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"

  # ── DB type drift check (E-5) ─────────────────────────────────────
  # Regenerates types/supabase.ts from the staging DB via
  # `supabase gen types` and fails if the checked-in file has drifted.
  #
  # Gating policy (N-005): same as db-audit above — trusted contexts
  # set REQUIRE_STAGING_DB=true so missing secrets fail loudly; fork
  # PRs run in skip-green mode.
  db-types:
    name: DB type drift (E-5)
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.types-result.outputs.status }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
      - name: Install Supabase CLI
        # F-011: pin the Supabase CLI version so a breaking upstream
        # release cannot change `supabase gen types` output without a
        # deliberate code change. Bump deliberately via Renovate /
        # Dependabot; do NOT switch back to `version: latest`.
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v1
        with:
          version: 2.45.5
      - name: Check DB types drift
        id: types-result
        env:
          # See db-audit job above for the IPv6/pooler rationale.
          STAGING_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_POOLER_URL || secrets.STAGING_SUPABASE_DB_URL }}
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
          # N-005: same gating as db-audit — hard-fail on trusted contexts.
          REQUIRE_STAGING_DB: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && 'true' || 'false' }}
        run: |
          if bash scripts/check-db-types.sh; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            if [ -z "${STAGING_SUPABASE_DB_URL:-}" ] && [ "${REQUIRE_STAGING_DB}" != "true" ]; then
              echo "status=skipped" >> "$GITHUB_OUTPUT"
              echo "::warning::F-10: db-types skipped — no staging DB URL available (fork PR)"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

      - name: Report types status
        if: always()
        run: |
          echo "### DB type drift: ${{ steps.types-result.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"

  # ── Terraform IaC validation (F-01) ───────────────────────────────
  # Catches syntax/type errors in terraform/cloudflare/*.tf so the
  # checked-in policy-as-code is guaranteed to be applyable. We run
  # `terraform init -backend=false` (no remote state needed for
  # syntactic validation) followed by `fmt -check` and `validate`.
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform -chdir=terraform/cloudflare fmt -check -recursive
      - name: terraform init (no backend)
        # Retry to absorb transient 502/timeout errors when the provider
        # registry / GitHub releases CDN flakes during plugin download.
        # Pure infra flake — code is unchanged on retry.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if terraform -chdir=terraform/cloudflare init -backend=false -input=false; then
              exit 0
            fi
            echo "terraform init failed (attempt ${attempt}); retrying after backoff..." >&2
            sleep $((attempt * 15))
          done
          echo "terraform init failed after 3 attempts" >&2
          exit 1
      - name: terraform validate
        run: terraform -chdir=terraform/cloudflare validate

  # ── Integration test gate (A86) ───────────────────────────────────
  # F-11: Integration tests are required to pass before merge.
  # They exercise DB + KV interactions that unit tests mock.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run integration tests (fail-closed execution gate)
        # scripts/ci/integration-gate.sh runs the real Supabase integration/RLS
        # suite when staging secrets are present and enforces an executed-count
        # floor + mandatory RLS execution. When secrets are absent it fails
        # closed in trusted contexts (push / same-repo PR) and skips green on
        # fork PRs where secrets are unavailable. See docs/test-gate-integrity.md.
        run: bash scripts/ci/integration-gate.sh
        env:
          # Isolated staging Supabase project — never production. Configure
          # these as repo secrets to make the gate execute real DB/RLS tests.
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          # Trusted context (push / same-repo non-dependabot PR) => missing
          # secrets fail loudly. Fork PRs cannot read secrets, so they skip
          # green. Mirrors the db-audit / db-types gating policy (N-005).
          REQUIRE_STAGING_SUPABASE: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && 'true' || 'false' }}
          INTEGRATION_MIN_EXECUTED: "40"
          JWT_SECRET: ci-test-secret
          INTERNAL_API_TOKEN: ci-test-internal-token
          CRON_SECRET: ci-test-cron-secret

  # ── E2E test gate (A86) ────────────────────────────────────────────
  # Playwright E2E tests across Chromium, Firefox, and WebKit.
  # A87: Do not rely on retries to mask flake — each test must pass cleanly.
  # playwright.config.ts requires E2E_BASE_URL when CI=true; we build the
  # Next.js app and start it locally so the tests have a live server.
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build Next.js for E2E
        run: npm run build
        env:
          NEXT_PUBLIC_DEFAULT_SITE: ai-compared
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
      - name: Start Next.js server
        run: npm run start &
        env:
          PORT: 3000
          NEXT_PUBLIC_DEFAULT_SITE: ai-compared
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          JWT_SECRET: ci-test-secret
          INTERNAL_API_TOKEN: ci-test-internal-token
          CRON_SECRET: ci-test-cron-secret
          SUPABASE_JWT_SECRET: ci-test-supabase-jwt-secret
          APP_URL: http://localhost:3000
          SENTRY_DSN: https://placeholder@placeholder.ingest.sentry.io/0
          AFFILIATE_DOMAIN_ENFORCEMENT: strict
          TOTP_ENCRYPTION_KEY: ci-test-totp-encryption-key-0123456789ab
          INTERNAL_HMAC_MIGRATION_MODE: strict
          CLICK_CACHE_HMAC_KEY: ci-test-click-cache-hmac-key
          GDPR_HASH_SECRET: ci-test-gdpr-hash-secret
          CRON_PUBLISH_SECRET: ci-test-cron-publish
          CRON_STRIPE_SYNC_SECRET: ci-test-cron-stripe-sync
          CRON_AI_SECRET: ci-test-cron-ai
          CRON_SITEMAP_SECRET: ci-test-cron-sitemap
          CRON_RETENTION_SECRET: ci-test-cron-retention
          CRON_COMMISSION_SECRET: ci-test-cron-commission
          CRON_EPC_SECRET: ci-test-cron-epc
          CRON_PRICE_SECRET: ci-test-cron-price
          CRON_DEALS_SECRET: ci-test-cron-deals
          CRON_CLICK_RECONCILE_SECRET: ci-test-cron-click-reconcile
          CRON_ACCESS_REVIEW_SECRET: ci-test-cron-access-review
          CRON_HOMEPAGE_SYNTHETIC_SECRET: ci-test-cron-homepage-synthetic
          STRIPE_WEBHOOK_SECRET: whsec_ci_test_placeholder
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          # F-18: production mode requires purpose-specific tokens; the legacy
          # INTERNAL_API_TOKEN fallback is not accepted. The revalidate route
          # calls getInternalTokenFor("internal") which looks for this var.
          INTERNAL_API_TOKEN_INTERNAL: ci-test-internal-token-internal
          INTERNAL_API_TOKEN_CRON: ci-test-internal-token-cron
          INTERNAL_API_TOKEN_CLICK_QUEUE: ci-test-internal-token-click-queue
          # E2E-LOCALHOST: middleware's localhost bypass is disabled in
          # NODE_ENV=production (next start always forces production mode).
          # Without this flag, every request to localhost gets rewritten to
          # the /not-found page — meaning Playwright sees pages without
          # <title>, without html[lang], without navigation or skip links,
          # and all a11y/keyboard tests fail. APP_URL=http://localhost:3000
          # satisfies the F-05 guard that refuses to boot with this flag on
          # a public host.
          ALLOW_LOCALHOST_FALLBACK_IN_PROD: "1"
      - name: Wait for server to be ready
        # Use TCP check — verifies the port is bound without making an HTTP
        # request. Avoiding HTTP because the first request may be slow to
        # initialize and cause a brief non-2xx before settling.
        run: npx wait-on tcp:localhost:3000 --timeout 60000
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run E2E tests (Chromium only for PR speed)
        run: npm run test:e2e
        env:
          CI: true
          E2E_BASE_URL: http://localhost:3000
          # A87: Zero retries in CI — flake must be fixed, not retried
          PLAYWRIGHT_RETRIES: "0"
      - name: Enforce E2E execution & skip honesty
        # Fail if too few E2E tests executed (hollow green) or if any test
        # skipped for a reason not on the reviewed allow-list. Authenticated
        # admin journeys are allowed to skip only while E2E_ADMIN_AUTH_PROVISIONED
        # is unset; provision a staging admin storage state to make them
        # non-skippable (see docs/test-gate-integrity.md).
        if: always()
        run: bash scripts/ci/e2e-gate.sh

  # ── Load test gate (A86) ───────────────────────────────────────────
  # k6 load tests to validate critical paths under 100x traffic.
  # A87: Assertions must verify correct behavior, not just "not 500".
  load:
    name: Load tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build Next.js for load tests
        run: npm run build
        env:
          NEXT_PUBLIC_DEFAULT_SITE: ai-compared
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
      - name: Start Next.js server
        run: npm run start &
        env:
          PORT: 3000
          NEXT_PUBLIC_DEFAULT_SITE: ai-compared
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          JWT_SECRET: ci-test-secret
          INTERNAL_API_TOKEN: ci-test-internal-token
          CRON_SECRET: ci-test-cron-secret
          SUPABASE_JWT_SECRET: ci-test-supabase-jwt-secret
          APP_URL: http://localhost:3000
          SENTRY_DSN: https://placeholder@placeholder.ingest.sentry.io/0
          AFFILIATE_DOMAIN_ENFORCEMENT: strict
          TOTP_ENCRYPTION_KEY: ci-test-totp-encryption-key-0123456789ab
          INTERNAL_HMAC_MIGRATION_MODE: strict
          CLICK_CACHE_HMAC_KEY: ci-test-click-cache-hmac-key
          GDPR_HASH_SECRET: ci-test-gdpr-hash-secret
          CRON_PUBLISH_SECRET: ci-test-cron-publish
          CRON_STRIPE_SYNC_SECRET: ci-test-cron-stripe-sync
          CRON_AI_SECRET: ci-test-cron-ai
          CRON_SITEMAP_SECRET: ci-test-cron-sitemap
          CRON_RETENTION_SECRET: ci-test-cron-retention
          CRON_COMMISSION_SECRET: ci-test-cron-commission
          CRON_EPC_SECRET: ci-test-cron-epc
          CRON_PRICE_SECRET: ci-test-cron-price
          CRON_DEALS_SECRET: ci-test-cron-deals
          CRON_CLICK_RECONCILE_SECRET: ci-test-cron-click-reconcile
          CRON_ACCESS_REVIEW_SECRET: ci-test-cron-access-review
          CRON_HOMEPAGE_SYNTHETIC_SECRET: ci-test-cron-homepage-synthetic
      - name: Wait for server to be ready
        # Use TCP check — verifies the port is bound without making an HTTP
        # request. HTTP checks fail because `next start` runs in production
        # mode; the middleware rejects localhost as an unknown domain and
        # returns a non-2xx, causing wait-on to retry until timeout.
        run: npx wait-on tcp:localhost:3000 --timeout 60000
      - name: Install k6
        # Use direct binary download instead of apt repo — the GPG key fetch
        # + apt-get update can hang indefinitely on flaky GitHub runners.
        # Pin to a specific version for reproducibility.
        run: |
          K6_VERSION="v0.54.0"
          curl --max-time 60 -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            -o /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv /tmp/k6-${K6_VERSION}-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - name: Run k6 load tests
        # AUDIT-2026-06 (Finding #20): load test script relocated from
        # repo root to tests/load/ so it cannot be confused with app
        # source and so accidental `node load-test.js` from the root
        # surfaces a clear "file not found" instead of running it.
        run: k6 run tests/load/load-test.js
        env:
          CI: "true"
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_NO_THRESHOLDS: "false"

  # ── Chaos test gate (A86) ──────────────────────────────────────────
  # Simulates AZ loss, KV outage, and partial cache failures.
  chaos:
    name: Chaos tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run chaos tests
        run: npm run test:chaos
        env:
          CHAOS_TEST_ENABLED: "true"

  # ── Mutation tests moved to .github/workflows/mutation.yml ─────────
  # Stryker runs weekly (Sunday 03:00 UTC) + on-demand via workflow_dispatch.
  # Removed from PR CI to cut ~30 min of wall time per push.

  # ── Cross-workflow required gates ──────────────────────────────────
  # Branch protection should require ALL of the following check names
  # (context name = job display name; keep in sync with CONTRIBUTING.md):
  #
  #   1. "Required checks"    (this workflow — lint/test/typecheck/build)
  #   2. "Integration tests"  (integration job above)
  #   3. "E2E tests"          (e2e job above)
  #   4. "Load tests"         (load job above)
  #   5. "Chaos tests"        (chaos job above)
  #   6. "Preview E2E gate"   (preview.yml  — deploy + Playwright E2E)
  #   7. "npm audit (moderate+)"  (security.yml)
  #   8. "License compliance"     (security.yml)
  #   9. "Dependency review"      (security.yml, PRs only)
  #
  # GitHub Actions `needs` cannot cross workflow boundaries, so each
  # workflow exposes its own gate job with a stable name.  Configure
  # all nine names as required status checks in repo Settings →
  # Branches → Branch protection rules → Require status checks.
  #
  # NOTE ON EXECUTION QUALITY (audit P1-2): a "success" job result is not, by
  # itself, proof that meaningful tests ran. Execution quality is enforced
  # INSIDE each tier — the integration job (scripts/ci/integration-gate.sh) and
  # the e2e job (scripts/ci/e2e-gate.sh) both fail on a hollow/all-skipped run.
  # This aggregation therefore only needs to confirm every required job
  # actually reached "success" (a "skipped" or "failure" result fails here).

  required-checks:
    name: Required checks
    needs: [check, integration, e2e, load, chaos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          LOAD_RESULT: ${{ needs.load.result }}
          CHAOS_RESULT: ${{ needs.chaos.result }}
        run: |
          set -euo pipefail
          echo "check: $CHECK_RESULT"
          echo "integration: $INTEGRATION_RESULT"
          echo "e2e: $E2E_RESULT"
          echo "load: $LOAD_RESULT"
          echo "chaos: $CHAOS_RESULT"
          if [ "$CHECK_RESULT" != "success" ]; then
            echo "::error::Required 'check' job did not succeed"
            exit 1
          fi
          if [ "$INTEGRATION_RESULT" != "success" ]; then
            echo "::error::Required 'integration' job did not succeed"
            exit 1
          fi
          if [ "$E2E_RESULT" != "success" ]; then
            echo "::error::Required 'e2e' job did not succeed"
            exit 1
          fi
          if [ "$LOAD_RESULT" != "success" ]; then
            echo "::error::Required 'load' job did not succeed"
            exit 1
          fi
          if [ "$CHAOS_RESULT" != "success" ]; then
            echo "::error::Required 'chaos' job did not succeed"
            exit 1
          fi
