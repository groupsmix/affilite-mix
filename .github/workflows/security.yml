# ═══════════════════════════════════════════════════════════════════════════
# SECURITY & COMPLIANCE CHECKS
#
# Runs on every push and PR, and weekly on a schedule so we catch newly
# disclosed advisories on dependencies we have not otherwise touched.
#
# Checks:
#   1. npm audit — fail on new high / critical vulnerabilities.
#   2. License compliance — fail if a new dependency adopts a restrictive
#      license (GPL/AGPL/SSPL).  The allowlist below is kept intentionally
#      narrow so any unexpected license shows up as a review item.
#   3. Dependency review (PRs only) — GitHub native check that flags
#      known-vulnerable or license-incompatible dep changes in the diff.
# ═══════════════════════════════════════════════════════════════════════════

name: 🔐 Security & Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly 02:15 UTC — asserts temporary production bypasses were removed.
    - cron: "15 2 * * *"
    # Every Monday 06:00 UTC — catches advisories published over the weekend.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  migration-skip-override-absent:
    name: Migration skip override absent
    # A89/A98-68 / PR #812 follow-up: this bypass must not linger in repo
    # Actions variables after an incident. Nightly failure is the alert.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Assert SKIP_DB_MIGRATIONS is unset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FOUND_VARS=()
          for VAR_NAME in \
            SKIP_DB_MIGRATIONS \
            SKIP_DB_MIGRATIONS_TICKET \
            SKIP_DB_MIGRATIONS_EXPIRES; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/variables/${VAR_NAME}" >/tmp/"${VAR_NAME}".json 2>/dev/null; then
              FOUND_VARS+=("${VAR_NAME}")
            fi
          done

          if [ "${#FOUND_VARS[@]}" -gt 0 ]; then
            echo "::error::Temporary migration-skip Actions variables are still present."
            echo "::error::Delete SKIP_DB_MIGRATIONS, SKIP_DB_MIGRATIONS_TICKET, and SKIP_DB_MIGRATIONS_EXPIRES after production migrations are confirmed applied."
            {
              echo "### SKIP_DB_MIGRATIONS override still present"
              echo ""
              echo "Temporary migration-skip repo variables still exist and must be removed:"
              for VAR_NAME in "${FOUND_VARS[@]}"; do
                echo "- \`${VAR_NAME}\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"

            for VAR_NAME in "${FOUND_VARS[@]}"; do
              cat /tmp/"${VAR_NAME}".json
            done
            exit 1
          fi

          echo "Temporary migration-skip Actions variables are not configured."

  audit:
    name: npm audit (moderate+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # AUD-10: Fail on moderate and above (previously high-only).
      # 0 moderate vulns as of 2026-05-28; lowered to catch Prototype
      # Pollution / ReDoS / SSRF in transitive deps early.
      - name: Run npm audit (production deps)
        run: npm audit --omit=dev --audit-level=moderate

      # RISK-24: devDependency audit — informational, non-blocking.
      # Dev deps run in CI with access to secrets and deploy tokens.
      # A compromised dev dep (eslint plugin, vitest, etc.) could
      # exfiltrate secrets. Alert on critical to catch the worst cases.
      - name: Run npm audit (devDependencies — informational)
        run: npm audit --audit-level=critical || echo "::warning::Critical devDependency vulnerabilities found — review npm audit output above."
        continue-on-error: true

  licenses:
    name: License compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install license-checker
        run: npm install --no-save --no-audit --no-fund license-checker@25

      # Fail if a dep reports a license outside the allowlist.  The list
      # deliberately excludes strong copyleft licenses (GPL, AGPL, SSPL)
      # so a new copyleft dep trips the check instead of shipping silently.
      #
      # Excluded packages:
      #   - @img/sharp-libvips-*: prebuilt libvips binaries shipped by the
      #     `sharp` image-processing library. libvips itself is LGPL-3.0,
      #     used dynamically (not statically linked into our distributable),
      #     which is permitted by LGPL-3.0 §4. Reviewed and accepted.
      - name: Verify license allowlist
        run: |
          npx license-checker --production --excludePrivatePackages \
            --excludePackages "$(grep -v '^#' .github/license-exclusions.txt | grep -v '^$' | tr '\n' ';' | sed 's/;$//')" \
            --onlyAllow \
            "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Python-2.0;Unlicense;0BSD;BlueOak-1.0.0"

  dependency-review:
    name: Dependency review
    # Only runs on pull_request — the action is a no-op on push/schedule.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          deny-licenses: "GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0"

  gitleaks:
    name: Secret leak prevention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: gitleaks-action
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A173: socket.dev supply-chain protection.
  # Detects typosquatting, compromised packages, and post-install scripts
  # that npm audit / Dependabot cannot catch (they only check known CVEs).
  #
  # A173 remediation: scan is now BLOCKING on both PRs and push-to-main so
  # a Monday-published malicious dep cannot land via a re-run or direct push.
  socket-security:
    name: Socket.dev supply chain scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # A34: Pin the Socket.dev CLI version for reproducibility.
      # Update via Renovate/Dependabot after reviewing the changelog.
      #
      # Preflight: probe whether the API key is configured BEFORE invoking
      # the CLI. When the key is unset the CLI prints help text and exits
      # 2 (looks like a hard failure), which used to break CI on main with
      # a misleading "scan failed" signal that obscured the real issue
      # (no key). Splitting the check into its own step lets the scan
      # itself only run when there is something to scan with, and emits
      # a clearly visible `::warning::` + GITHUB_STEP_SUMMARY entry on
      # main when the key is missing so the regression is loud, not silent.
      - name: Check Socket.dev API key
        id: socket-key
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          if [ -z "${SOCKET_SECURITY_API_KEY:-}" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            MSG="SOCKET_SECURITY_API_KEY is not configured — supply-chain scan skipped. Provision a Socket.dev API key in repo Settings → Secrets → Actions to re-enable A173 enforcement."
            echo "::warning::${MSG}"
            {
              echo "### ⚠️ Socket.dev supply-chain scan SKIPPED"
              echo ""
              echo "${MSG}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Socket Security scan
        if: steps.socket-key.outputs.has_key == 'true'
        run: npx --yes @socketsecurity/cli@2.1.0 scan --strict
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: javascript-typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4

  # FR-015: run the in-repo Semgrep rules (.semgrep/) in CI. The custom rules
  # encode project-specific security conventions (getClientIp usage, admin-route
  # authz, service-role import review, safe redirects) that CodeQL's generic
  # query packs do not cover. Findings are split by severity:
  #   • ERROR  → blocking gate (currently: admin-route-missing-auth).
  #   • WARNING→ advisory; surfaced in the Security tab as annotations but
  #              non-blocking, because they are review signals governed
  #              elsewhere (e.g. service-role imports are gated by
  #              lib/security/service-role-allowlist.ts + tests).
  semgrep:
    name: Semgrep SAST (custom rules)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Semgrep ships as a Python CLI. pipx is preinstalled on the GitHub
      # ubuntu runners and avoids PEP 668 "externally-managed" issues.
      # A34-style pin: version is fixed for reproducibility — bump via
      # Renovate/Dependabot after reviewing the changelog.
      - name: Install Semgrep
        run: pipx install semgrep==1.165.0

      # Advisory pass: scan with every rule, emit SARIF, never fail the build
      # here (no --error). All findings (ERROR + WARNING) land in the Security
      # tab via the upload step below.
      - name: Semgrep scan (SARIF, advisory)
        run: semgrep scan --config .semgrep/ --sarif --output semgrep.sarif --metrics=off --disable-version-check
        continue-on-error: true

      # GitHub code scanning does NOT honor the SARIF `suppressions` field —
      # it creates error-level annotations for every result in the file,
      # including findings suppressed via // nosemgrep. That means the
      # upload-sarif check fails even though the CLI gate (--severity ERROR
      # --error) passes with zero findings. Strip suppressed results from
      # the SARIF before upload so the advisory check stays green. The CLI
      # gate below remains the blocking enforcement.
      - name: Strip suppressed findings from SARIF
        if: always()
        run: |
          python3 -c "
          import json
          with open('semgrep.sarif') as f:
              sarif = json.load(f)
          for run in sarif.get('runs', []):
              run['results'] = [r for r in run.get('results', []) if not r.get('suppressions')]
          with open('semgrep.sarif', 'w') as f:
              json.dump(sarif, f)
          "

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # Blocking gate: fail the build only on ERROR-severity findings.
      - name: Semgrep gate (ERROR severity)
        run: semgrep scan --config .semgrep/ --severity ERROR --error --metrics=off --disable-version-check
