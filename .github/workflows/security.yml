# ═══════════════════════════════════════════════════════════════════════════
# SECURITY & COMPLIANCE CHECKS
#
# Runs on every push and PR, and weekly on a schedule so we catch newly
# disclosed advisories on dependencies we have not otherwise touched.
#
# Checks:
#   1. npm audit — fail on new high / critical vulnerabilities.
#   2. License compliance — fail if a new dependency adopts a restrictive
#      license (GPL/AGPL/SSPL).  The allowlist below is kept intentionally
#      narrow so any unexpected license shows up as a review item.
#   3. Dependency review (PRs only) — GitHub native check that flags
#      known-vulnerable or license-incompatible dep changes in the diff.
# ═══════════════════════════════════════════════════════════════════════════

name: 🔐 Security & Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday 06:00 UTC — catches advisories published over the weekend.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    name: npm audit (high / critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # AUD-10: Fail on moderate and above (previously high-only).
      # 0 moderate vulns as of 2026-05-28; lowered to catch Prototype
      # Pollution / ReDoS / SSRF in transitive deps early.
      - name: Run npm audit
        run: npm audit --omit=dev --audit-level=moderate

  licenses:
    name: License compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install license-checker
        run: npm install --no-save --no-audit --no-fund license-checker@25

      # Fail if a dep reports a license outside the allowlist.  The list
      # deliberately excludes strong copyleft licenses (GPL, AGPL, SSPL)
      # so a new copyleft dep trips the check instead of shipping silently.
      #
      # Excluded packages:
      #   - @img/sharp-libvips-*: prebuilt libvips binaries shipped by the
      #     `sharp` image-processing library. libvips itself is LGPL-3.0,
      #     used dynamically (not statically linked into our distributable),
      #     which is permitted by LGPL-3.0 §4. Reviewed and accepted.
      - name: Verify license allowlist
        run: |
          npx license-checker --production --excludePrivatePackages \
            --excludePackages "$(grep -v '^#' .github/license-exclusions.txt | grep -v '^$' | tr '\n' ';' | sed 's/;$//')" \
            --onlyAllow \
            "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Python-2.0;Unlicense;0BSD;BlueOak-1.0.0"

  dependency-review:
    name: Dependency review
    # Only runs on pull_request — the action is a no-op on push/schedule.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          deny-licenses: "GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0"

  gitleaks:
    name: Secret leak prevention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: gitleaks-action
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A173: socket.dev supply-chain protection.
  # Detects typosquatting, compromised packages, and post-install scripts
  # that npm audit / Dependabot cannot catch (they only check known CVEs).
  socket-security:
    name: Socket.dev supply chain scan
    runs-on: ubuntu-latest
    # Only block on PRs; schedule + main-push runs are informational so a
    # compromised published package on a Monday scan doesn't block deploys
    # that were already in-flight.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # A34: Pin the Socket.dev CLI version for reproducibility.
      # Update via Renovate/Dependabot after reviewing the changelog.
      #
      # Preflight: probe whether the API key is configured BEFORE invoking
      # the CLI. When the key is unset the CLI prints help text and exits
      # 2 (looks like a hard failure), which used to break CI on main with
      # a misleading "scan failed" signal that obscured the real issue
      # (no key). Splitting the check into its own step lets the scan
      # itself only run when there is something to scan with, and emits
      # a clearly visible `::warning::` + GITHUB_STEP_SUMMARY entry on
      # main when the key is missing so the regression is loud, not silent.
      - name: Check Socket.dev API key
        id: socket-key
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          if [ -z "${SOCKET_SECURITY_API_KEY:-}" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            MSG="SOCKET_SECURITY_API_KEY is not configured — supply-chain scan skipped. Provision a Socket.dev API key in repo Settings → Secrets → Actions to re-enable A173 enforcement."
            echo "::warning::${MSG}"
            {
              echo "### ⚠️ Socket.dev supply-chain scan SKIPPED"
              echo ""
              echo "${MSG}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Socket Security scan
        if: steps.socket-key.outputs.has_key == 'true'
        run: npx --yes @socketsecurity/cli@2.1.0 scan --strict
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          languages: javascript-typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
