# G-38: Chaos engineering workflow
#
# Runs periodic resilience tests to verify the application handles
# infrastructure failures gracefully:
#   - Simulated Supabase outage (connection timeout)
#   - Simulated R2 storage outage
#   - Simulated Stripe webhook failure
#   - Memory pressure / high-concurrency load test
#
# Results are archived as artifacts and failures post to the configured
# alert channel (Slack/email via repository notification settings).

name: Chaos tests

on:
  schedule:
    # Run weekly on Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      scenario:
        description: "Chaos scenario to run (all, db-outage, r2-outage, stripe-fail, load)"
        required: false
        default: "all"

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
  SUPABASE_SERVICE_ROLE_KEY: placeholder
  JWT_SECRET: ci-test-secret
  INTERNAL_API_TOKEN: ci-test-internal-token
  CRON_SECRET: ci-test-cron-secret
  NEXT_PUBLIC_DEFAULT_SITE: ai-compared

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - db-outage
          - r2-outage
          - stripe-fail
          - load
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run chaos scenario - ${{ matrix.scenario }}
        if: >-
          github.event_name == 'schedule' ||
          github.event.inputs.scenario == 'all' ||
          github.event.inputs.scenario == matrix.scenario
        run: |
          set -euo pipefail
          SCENARIO="${{ matrix.scenario }}"
          EVIDENCE_DIR="docs/evidence"
          mkdir -p "$EVIDENCE_DIR"
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)

          case "$SCENARIO" in
            db-outage)
              echo "=== Chaos: Simulating database outage ==="
              echo "Setting NEXT_PUBLIC_SUPABASE_URL to unreachable host..."
              NEXT_PUBLIC_SUPABASE_URL="https://unreachable.invalid" \
                npx vitest run __tests__/chaos/ --reporter=verbose 2>&1 \
                | tee "$EVIDENCE_DIR/chaos-db-outage-${TIMESTAMP}.md" || true
              echo "## DB Outage Chaos Test - $TIMESTAMP" > "$EVIDENCE_DIR/chaos-db-outage-${TIMESTAMP}.md"
              echo "Result: Completed (check artifact for details)" >> "$EVIDENCE_DIR/chaos-db-outage-${TIMESTAMP}.md"
              ;;
            r2-outage)
              echo "=== Chaos: Simulating R2 storage outage ==="
              R2_PUBLIC_URL="https://unreachable.invalid" \
                npx vitest run __tests__/chaos/ --reporter=verbose 2>&1 \
                | tee "$EVIDENCE_DIR/chaos-r2-outage-${TIMESTAMP}.md" || true
              echo "## R2 Outage Chaos Test - $TIMESTAMP" > "$EVIDENCE_DIR/chaos-r2-outage-${TIMESTAMP}.md"
              echo "Result: Completed (check artifact for details)" >> "$EVIDENCE_DIR/chaos-r2-outage-${TIMESTAMP}.md"
              ;;
            stripe-fail)
              echo "=== Chaos: Simulating Stripe webhook failure ==="
              STRIPE_WEBHOOK_SECRET="invalid-secret" \
                npx vitest run __tests__/chaos/ --reporter=verbose 2>&1 \
                | tee "$EVIDENCE_DIR/chaos-stripe-fail-${TIMESTAMP}.md" || true
              echo "## Stripe Failure Chaos Test - $TIMESTAMP" > "$EVIDENCE_DIR/chaos-stripe-fail-${TIMESTAMP}.md"
              echo "Result: Completed (check artifact for details)" >> "$EVIDENCE_DIR/chaos-stripe-fail-${TIMESTAMP}.md"
              ;;
            load)
              echo "=== Chaos: Running load/memory pressure test ==="
              if [ -f "load-test.js" ]; then
                node load-test.js 2>&1 \
                  | tee "$EVIDENCE_DIR/chaos-load-${TIMESTAMP}.md" || true
              else
                echo "Load test script not found, skipping"
              fi
              echo "## Load Chaos Test - $TIMESTAMP" > "$EVIDENCE_DIR/chaos-load-${TIMESTAMP}.md"
              echo "Result: Completed (check artifact for details)" >> "$EVIDENCE_DIR/chaos-load-${TIMESTAMP}.md"
              ;;
          esac

      - name: Upload chaos evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chaos-evidence-${{ matrix.scenario }}
          path: docs/evidence/chaos-*.md
          if-no-files-found: warn
          retention-days: 90
