name: Backup Restore Drill

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for backup restore drill"
        required: true
        default: "staging"
        type: choice
        options:
          - staging

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - name: Run backup restore drill
        run: bash scripts/dr-drill.sh --restore
        env:
          ENVIRONMENT: ${{ inputs.environment }}
