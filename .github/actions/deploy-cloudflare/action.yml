name: "Deploy to Cloudflare"
description: "Build OpenNext bundle and deploy to Cloudflare Workers"
inputs:
  cloudflare-api-token:
    description: "Cloudflare API token"
    required: true
  cloudflare-account-id:
    description: "Cloudflare account ID"
    required: true
  environment:
    description: "Target environment (staging or production)"
    required: true
    default: "production"
  worker-name:
    description: "Cloudflare Worker name"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Build OpenNext bundle
      shell: bash
      run: npx --yes @opennextjs/cloudflare build

    - name: Deploy to Cloudflare
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        WORKER_NAME: ${{ inputs.worker-name }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        DEPLOY_ARGS=()
        if [ -n "$WORKER_NAME" ]; then
          DEPLOY_ARGS+=("--name" "$WORKER_NAME")
        fi
        case "$ENVIRONMENT" in
          staging|production) ;;
          *) echo "::error::Invalid environment: $ENVIRONMENT"; exit 1 ;;
        esac
        if [ "$ENVIRONMENT" = "staging" ]; then
          DEPLOY_ARGS+=("--env" "staging")
        fi
        npx wrangler deploy "${DEPLOY_ARGS[@]}"

    - name: Post-deploy health check
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        WORKER_NAME: ${{ inputs.worker-name }}
      run: |
        echo "Deployment to $ENVIRONMENT complete"
        echo "Worker: ${WORKER_NAME:-default}"
