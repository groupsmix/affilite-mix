components:
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required:
        - error
        - code
      properties:
        error:
          type: string
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
        details: {}
    CsrfTokenResponse:
      type: object
      additionalProperties: false
      required:
        - csrfToken
      properties:
        csrfToken:
          type: string
    AuthMeResponse:
      type: object
      additionalProperties: false
      required:
        - role
        - email
        - activeSite
      properties:
        role:
          type: string
        email:
          oneOf:
            - type: string
            - type: "null"
        activeSite:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - id
                - name
              properties:
                id:
                  type: string
                name:
                  type: string
            - type: "null"
    NewsletterSignupRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - turnstileToken
      properties:
        email:
          type: string
          format: email
        turnstileToken:
          type: string
        website:
          type: string
          description: Honeypot field; clients should leave it empty.
    NewsletterSignupResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - message
      properties:
        ok:
          type: boolean
          const: true
        message:
          type: string
    HealthResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              const: healthy
        - type: object
          additionalProperties: false
          required:
            - status
            - timestamp
            - checks
          properties:
            status:
              type: string
              enum:
                - healthy
                - degraded
            timestamp:
              type: string
              format: date-time
            checks:
              type: object
              additionalProperties:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - warn
                      - error
                  latencyMs:
                    type: integer
                    minimum: 0
                  error:
                    type: string
  headers:
    API-Version:
      description: Numeric major version of the served API contract.
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
        example: "1"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    siteId:
      name: x-site-id
      in: header
      required: true
      schema:
        type: string
      description: Tenant identifier
tags:
  - name: System
  - name: Auth
  - name: Newsletter
  - name: Admin
  - name: Cron
  - name: Public
  - name: Internal
  - name: Membership
  - name: Community
