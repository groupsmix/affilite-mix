# Local Supabase stack for integration tests (J-1).
#
# Spins up Postgres + PostgREST + Kong so that integration tests can talk
# to a real Supabase API surface on `http://localhost:54321` without
# touching a staging database.  All four services are disposable — none of
# them carry production config and they live in an isolated Docker
# network so they can be brought up / torn down around test runs.
#
# Usage:
#   docker compose --env-file .env.local up -d   # start stack (.env.local is NOT loaded automatically)
#   TEST_WITH_SUPABASE=1 \
#   NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321 \
#   NEXT_PUBLIC_SUPABASE_ANON_KEY=$LOCAL_SUPABASE_ANON_KEY \
#   SUPABASE_SERVICE_ROLE_KEY=$LOCAL_SUPABASE_SERVICE_ROLE_KEY \
#     npm run test:integration
#   docker compose --env-file .env.local down -v # stop + wipe volumes
#
# NOTE: Docker Compose does NOT automatically load .env.local for variable
# substitution — only .env is loaded by default. Always pass --env-file .env.local
# explicitly, or export the variables into your shell before running compose.
#
# A32/A38: SECURITY REQUIREMENTS:
#   1. All images are pinned by SHA256 digest (immutable).
#   2. No local fallback secrets — you MUST create a .env.local file
#      with LOCAL_DB_PASSWORD and LOCAL_JWT_SECRET.
#   3. The compose file will FAIL if .env.local is missing or empty.
#   4. See docs/local-supabase.md for the .env.local template.

name: affilite-mix-supabase

services:
  db:
    labels:
      com.affilite-mix.service: "postgres"
      com.affilite-mix.environment: "local-dev"
    # A32: Image pinned by SHA256 digest for immutability.
    # Digest: sha256:9ce3d997e303d7be5941f40c6fa595131432f87ce94349c415034fa260ae6ea7 (supabase/postgres:15.14.1.129)
    # To update: docker pull supabase/postgres:15.14.1.129 && docker inspect --format='{{index .RepoDigests 0}}' supabase/postgres:15.14.1.129
    image: supabase/postgres:15.14.1.129@sha256:9ce3d997e303d7be5941f40c6fa595131432f87ce94349c415034fa260ae6ea7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      # A38: No local fallback secrets — must be provided via .env.local.
      # The compose file will fail if LOCAL_DB_PASSWORD is not set.
      POSTGRES_PASSWORD:
        ${LOCAL_DB_PASSWORD:?ERROR: LOCAL_DB_PASSWORD is required. Create .env.local with LOCAL_DB_PASSWORD=your-secure-password}
      POSTGRES_DB: postgres
      JWT_SECRET:
        ${LOCAL_JWT_SECRET:?ERROR: LOCAL_JWT_SECRET is required. Create .env.local with LOCAL_JWT_SECRET=your-64-char-secret}
      JWT_EXP: 3600
    # I31-003: Dev audit logging (CIS PostgreSQL 3.1)
    command:
      - postgres
      - -c
      - log_statement=ddl
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    # DOC32-009: Bind to localhost only — prevents network-adjacent access
    ports:
      - "127.0.0.1:54322:5432"
    # DOC32-007: Resource limits prevent container-level DoS
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      # Apply project migrations on first boot.  `docker-entrypoint-initdb.d`
      # runs all `*.sql` files in alphabetical order the first time the
      # data volume is empty — matches the numeric ordering we already use
      # under `supabase/migrations/`.
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro

  rest:
    labels:
      com.affilite-mix.service: "postgrest"
      com.affilite-mix.environment: "local-dev"
    # A32: Image pinned by SHA256 digest.
    # Digest: sha256:54000f24847d01a2c2302e0041cf0618b875c57fb48507d743cfa9aaa50bf43c (postgrest/postgrest:v14.12)
    image: postgrest/postgrest:v14.12@sha256:54000f24847d01a2c2302e0041cf0618b875c57fb48507d743cfa9aaa50bf43c
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # DOC32-007: Resource limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test:
        ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      # A38: No fallback secrets — must be provided via .env.local.
      PGRST_DB_URI:
        postgres://postgres:${LOCAL_DB_PASSWORD:?ERROR: LOCAL_DB_PASSWORD is required. Create .env.local with LOCAL_DB_PASSWORD=your-secure-password}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET:
        ${LOCAL_JWT_SECRET:?ERROR: LOCAL_JWT_SECRET is required. Create .env.local with LOCAL_JWT_SECRET=your-64-char-secret}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${LOCAL_JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: "3600"

  kong:
    labels:
      com.affilite-mix.service: "kong"
      com.affilite-mix.environment: "local-dev"
    # A32: Image pinned by SHA256 digest.
    # Digest: sha256:a2b2ec9964bba34065943e8be1d56791a4a06b7b0c10222f05564b372ca87840 (kong:3.9.1)
    image: kong:3.9.1@sha256:a2b2ec9964bba34065943e8be1d56791a4a06b7b0c10222f05564b372ca87840
    depends_on:
      - rest
    restart: unless-stopped
    # DOC32-008: Kong healthcheck
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
    # DOC32-007: Resource limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    ports:
      # Mirrors the Supabase CLI default local endpoint so test configs
      # that assume `http://localhost:54321` work out of the box.
      # DOC32-009: Bind to localhost only
      - "127.0.0.1:54321:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./docker/kong.yml:/var/lib/kong/kong.yml:ro

  # RISK-22: MinIO for local R2 emulation
  minio:
    labels:
      com.affilite-mix.service: "minio"
      com.affilite-mix.environment: "local-dev"
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:7f5d0da6a82e67d6a1fdeb5e7a10b68e2d2a5d33d5f68c49c6030e69c8e00d82
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  # RISK-22: Mailpit for local email testing (newsletter, password reset)
  mailpit:
    labels:
      com.affilite-mix.service: "mailpit"
      com.affilite-mix.environment: "local-dev"
    image: axllent/mailpit:v1.24.2@sha256:ad70b0e06e7d398e07cdef6eb00fe3da6d0bbfde8d2ed83f6cd8bffcede5e040
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  supabase-db-data:
  minio-data:
