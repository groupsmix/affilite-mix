# Local Supabase stack for integration tests (J-1).
#
# Spins up Postgres + PostgREST + Kong so that integration tests can talk
# to a real Supabase API surface on `http://localhost:54321` without
# touching a staging database.  All four services are disposable — none of
# them carry production config and they live in an isolated Docker
# network so they can be brought up / torn down around test runs.
#
# Usage:
#   docker compose up -d              # start stack
#   TEST_WITH_SUPABASE=1 \
#   NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321 \
#   NEXT_PUBLIC_SUPABASE_ANON_KEY=$LOCAL_SUPABASE_ANON_KEY \
#   SUPABASE_SERVICE_ROLE_KEY=$LOCAL_SUPABASE_SERVICE_ROLE_KEY \
#     npm run test:integration
#   docker compose down -v            # stop + wipe volumes
#
# A32/A38: SECURITY REQUIREMENTS:
#   1. All images are pinned by SHA256 digest (immutable).
#   2. No local fallback secrets — you MUST create a .env.local file
#      with LOCAL_DB_PASSWORD and LOCAL_JWT_SECRET.
#   3. The compose file will FAIL if .env.local is missing or empty.
#   4. See docs/local-supabase.md for the .env.local template.

name: affilite-mix-supabase

services:
  db:
    labels:
      com.affilite-mix.service: "postgres"
      com.affilite-mix.environment: "local-dev"
    # A32: Image pinned by SHA256 digest for immutability.
    # Digest: sha256:71a9c59d5f6d7f,... (supabase/postgres:15.6.1.144)
    # To update: docker pull supabase/postgres:17 && docker inspect --format='{{index .RepoDigests 0}}' supabase/postgres:17
    image: supabase/postgres@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      # A38: No local fallback secrets — must be provided via .env.local.
      # The compose file will fail if LOCAL_DB_PASSWORD is not set.
      POSTGRES_PASSWORD:
        ${LOCAL_DB_PASSWORD:?ERROR: LOCAL_DB_PASSWORD is required. Create .env.local with LOCAL_DB_PASSWORD=your-secure-password}
      POSTGRES_DB: postgres
      JWT_SECRET:
        ${LOCAL_JWT_SECRET:?ERROR: LOCAL_JWT_SECRET is required. Create .env.local with LOCAL_JWT_SECRET=your-64-char-secret}
      JWT_EXP: 3600
    # I31-003: Dev audit logging (CIS PostgreSQL 3.1)
    command:
      - postgres
      - -c
      - log_statement=ddl
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    # DOC32-009: Bind to localhost only — prevents network-adjacent access
    ports:
      - "127.0.0.1:54322:5432"
    # DOC32-007: Resource limits prevent container-level DoS
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      # Apply project migrations on first boot.  `docker-entrypoint-initdb.d`
      # runs all `*.sql` files in alphabetical order the first time the
      # data volume is empty — matches the numeric ordering we already use
      # under `supabase/migrations/`.
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro

  rest:
    labels:
      com.affilite-mix.service: "postgrest"
      com.affilite-mix.environment: "local-dev"
    # A32: Image pinned by SHA256 digest.
    image: postgrest/postgrest@sha256:a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # DOC32-007: Resource limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test:
        ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      # A38: No fallback secrets — must be provided via .env.local.
      PGRST_DB_URI:
        postgres://postgres:${LOCAL_DB_PASSWORD:?ERROR: LOCAL_DB_PASSWORD is required. Create .env.local with LOCAL_DB_PASSWORD=your-secure-password}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET:
        ${LOCAL_JWT_SECRET:?ERROR: LOCAL_JWT_SECRET is required. Create .env.local with LOCAL_JWT_SECRET=your-64-char-secret}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${LOCAL_JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: "3600"

  kong:
    labels:
      com.affilite-mix.service: "kong"
      com.affilite-mix.environment: "local-dev"
    # A32: Image pinned by SHA256 digest.
    image: kong@sha256:b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3
    depends_on:
      - rest
    restart: unless-stopped
    # DOC32-008: Kong healthcheck
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
    # DOC32-007: Resource limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    ports:
      # Mirrors the Supabase CLI default local endpoint so test configs
      # that assume `http://localhost:54321` work out of the box.
      # DOC32-009: Bind to localhost only
      - "127.0.0.1:54321:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./docker/kong.yml:/var/lib/kong/kong.yml:ro

volumes:
  supabase-db-data:
